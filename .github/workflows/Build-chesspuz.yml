           if(AN.err)h+='<div class="msg bad">সমস্যা হয়েছে: '+esc(AN.err)+'</div><div class="row"><button class="btn" id="ar">আবার চেষ্টা</button></div>';
           else h+='<div class="box res"><div class="big" id="apct">'+bn(p)+'%</div><div class="sub">বিশ্লেষণ চলছে। ফোন একটু গরম হতে পারে।</div><div class="progress"><i id="abar" style="width:'+p+'%"></i></div></div><div class="note" style="margin-top:12px">'+esc(engNote())+'<br>তুমি চাইলে পেছনে গিয়ে অন্য কিছু দেখতে পারো, বিশ্লেষণ চলতে থাকবে।</div><div class="row"><button class="btn ghost" id="acn">বন্ধ করো</button></div>';
