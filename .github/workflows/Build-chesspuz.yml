           vIdle();
          }
          function bkey(){return S.vis.mode+S.vis.dur}
          function vIdle(){
           var o=S.vis,b=best[bkey()]||0;
           $('#vbody').innerHTML='<div class="box res"><div class="sub">ব্যক্তিগত সেরা ('+bn(o.dur)+' সেকেন্ড)</div><div class="big">'+bn(b)+'</div><div class="sub" style="margin:8px 0 14px">'+(o.mode==='find'?'ফাঁকা বোর্ডে নামটা দেখে ঘরে ট্যাপ করবে।':'বোর্ডে একটা ঘর জ্বলে উঠবে, নামটা বেছে নেবে।')+'</div><button class="btn" id="vs">শুরু করো</button></div>';
           $('#vs').onclick=vStart}
          function vStart(){
           var o=S.vis;V={run:true,t:o.dur,sc:0,miss:0,flip:o.orient==='b',lock:false};
           $('#vbody').innerHTML='<div class="hud"><div><b id="vt">'+bn(o.dur)+'</b><span>সেকেন্ড</span></div><div><b id="vsc">০</b><span>সঠিক</span></div><div><b id="vms">০</b><span>ভুল</span></div></div><div id="vtg"></div><div id="vbd"></div><div id="vop"></div><label class="tgl"><input type="checkbox" id="vh"> সাহায্য: ঘরের কোণে নাম দেখাও</label>';
           $('#vh').checked=o.help;$('#vh').onchange=function(){o.help=this.checked;vDraw()};
           V.tm=setInterval(function(){V.t--;var e=$('#vt');if(e)e.textContent=bn(V.t);if(V.t<=0)vEnd()},1000);
           vNext()}
          function vNext(){
           var o=S.vis;if(o.orient==='r')V.flip=Math.random()<.5;
           var s;do{s=Math.floor(Math.random()*64)}while(s===V.cur);V.cur=s;V.lock=false;vDraw();
           if(o.mode==='find'){$('#vtg').innerHTML='<div class="target">'+sn(s)+'<small>এই ঘরে ট্যাপ করো</small></div>';$('#vop').innerHTML=''}
           else{$('#vtg').innerHTML='<div class="target" style="font-size:20px">জ্বলন্ত ঘরটার নাম কী?</div>';
            var set=[sn(s)];while(set.length<4){var x=sn(Math.floor(Math.random()*64));if(set.indexOf(x)<0)set.push(x)}
            set.sort(function(){return Math.random()-.5});
            $('#vop').innerHTML='<div class="opts">'+set.map(function(n){return'<button data-n="'+n+'">'+n+'</button>'}).join('')+'</div>';
            document.querySelectorAll('#vop button').forEach(function(b){b.onclick=function(){vName(b)}})}
          }
          function vDraw(){
           var o=S.vis;$('#vbd').innerHTML=boardHTML(null,{flip:V.flip,coords:o.help});
