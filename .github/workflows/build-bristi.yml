      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: bristi-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp bristi-app/app/build/outputs/apk/debug/app-debug.apk bristi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bristi-apk
          path: bristi.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bristi-v${{ github.run_number }}
          name: বৃষ্টি-ফোন v${{ github.run_number }}
          files: bristi.apk
