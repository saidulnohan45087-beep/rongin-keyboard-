      - name: Build letter app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chithighor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk chithighor.apk
          TAG="chithighor-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" chithighor.apk --repo "${{ github.repository }}" --title "Chithighor $TAG" --notes "Install chithighor.apk on your phone."
