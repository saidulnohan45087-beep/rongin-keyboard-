          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
          <style>
          /* Layout: one phone column. Big result on top, a tall colourful keypad under it, then plans, watchlist, poster card. */
          :root{
            --bg:#0c0a1d; --panel:#16132e; --panel2:#1e1a3c; --line:#2f2a58;
            --fg:#f4f1ff; --dim:#a39fc9;
            --a1:#ff4d4d; --a2:#7b61ff; --a3:#2ec4f1;
            --display:'Baloo Da 2','Hind Siliguri',system-ui,sans-serif;
            --body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
            color-scheme:dark;
          }
          *{box-sizing:border-box}
          html,body{min-height:100%}
          body{
            background:
              radial-gradient(120% 60% at 90% -10%, color-mix(in srgb,var(--a2) 28%,transparent), transparent 60%),
              radial-gradient(90% 50% at -10% 20%, color-mix(in srgb,var(--a1) 22%,transparent), transparent 60%),
              var(--bg);
            background-attachment:fixed;
            color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
            padding-left:max(16px,env(safe-area-inset-left,0px));
            padding-right:max(16px,env(safe-area-inset-right,0px));
            padding-block:14px 40px;
            -webkit-tap-highlight-color:transparent;
          }
          .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
          h1,h2{font-family:var(--display);margin:0;letter-spacing:.2px}
          button{font-family:inherit;color:inherit;cursor:pointer;border:0}
          button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a3);outline-offset:2px}

          /* header */
          .top{display:flex;align-items:center;gap:12px}
          .logo{width:48px;height:48px;flex:none;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--a2) 60%,transparent))}
          .top h1{font-size:23px;font-weight:800;line-height:1.1;flex:1;min-width:0}
          .top small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--dim);margin-top:2px}
          .iconbtn{width:44px;height:44px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
          .iconbtn svg{width:24px;height:24px}
          .iconbtn[aria-pressed="true"]{border-color:var(--a3)}

          /* theme tray */
          .tray{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
          .tbtn{background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:8px 8px 9px;display:flex;flex-direction:column;gap:7px;align-items:stretch;font-size:13px;font-weight:500}
          .tbtn[aria-pressed="true"]{border-color:var(--fg)}
          .bar{display:flex;height:16px;border-radius:8px;overflow:hidden}
          .bar i{flex:1}

          /* result */
          .result{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
          .result::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 45%,transparent),transparent 70%);pointer-events:none}
          .lbl{font-size:12.5px;color:var(--dim);letter-spacing:.4px}
          .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,48px);line-height:1.15;margin:2px 0 4px;
            background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
          .eq{color:var(--dim);font-size:14.5px}
          .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
          .pill{background:color-mix(in srgb,var(--a2) 20%,var(--panel));border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}

          /* inputs */
          .name{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font:inherit}
          .name::placeholder{color:var(--dim)}
          .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .field{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 14px 10px;text-align:left;min-width:0}
          .field[aria-pressed="true"]{border-color:var(--a3);box-shadow:0 0 0 4px color-mix(in srgb,var(--a3) 22%,transparent)}
          .field span{display:block;font-size:12.5px;color:var(--dim)}
          .field b{display:block;font-family:var(--display);font-size:34px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
          .field b.empty{color:var(--dim);opacity:.5}
          .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
          .chips .lbl{margin-right:2px}
          .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;min-height:38px}
          .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

          /* keypad */
          .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px;background:#09071a;border:1px solid var(--line);border-radius:22px}
          .key{height:64px;border-radius:16px;font-family:var(--display);font-size:27px;font-weight:700;display:grid;place-items:center;
            box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s,filter .06s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
          .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.12)}
          .key.w2{grid-column:span 2}
          .key.sm{font-size:18px}

          /* sections */
          .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
          .card h2{font-size:19px;font-weight:700}
          .note{font-size:14px;color:var(--dim);margin:0}
          .out{background:var(--panel2);border-radius:14px;padding:10px 14px;font-size:15.5px}
          .out b{font-family:var(--display);font-size:18px}
          .date{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:9px 12px;font:inherit;min-height:44px;max-width:100%}
          .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
          .list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
          .item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:10px 12px}
          .item .dot{width:10px;align-self:stretch;border-radius:5px;flex:none}
          .item .t{flex:1;min-width:0}
          .item .t b{display:block;overflow-wrap:anywhere}
          .item .t span{font-size:13.5px;color:var(--dim)}
          .item .x{width:36px;height:36px;border-radius:10px;background:transparent;color:var(--dim);font-size:20px;flex:none}
          .btn{background:linear-gradient(90deg,var(--a2),var(--a1));color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;font-size:16px;min-height:46px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
          .btn.ghost{background:var(--panel2);border:1px solid var(--line);text-shadow:none}
          .card img.cardimg{width:100%;height:auto;border-radius:16px;display:block;border:1px solid var(--line)}
          .foot{text-align:center;font-size:13px;color:var(--dim);padding-top:4px}
          @media (prefers-reduced-motion:reduce){.key{transition:none}}
          @media (max-width:360px){.key{height:56px;font-size:24px}.field b{font-size:28px}}
          </style>

          <div class="wrap">
            <header class="top">
              <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
                <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d9d"/><stop offset=".55" stop-color="#7b61ff"/><stop offset="1" stop-color="#2ec4f1"/></linearGradient></defs>
                <rect width="108" height="108" rx="26" fill="url(#lg1)"/>
                <circle cx="54" cy="54" r="31" fill="#120d2e"/>
                <circle cx="54" cy="54" r="30" fill="none" stroke="#fff" stroke-width="4.5"/>
                <path d="M54 29v4M54 75v4M29 54h4M75 54h4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                <path d="M54 54L42.5 46" stroke="#ffe14d" stroke-width="5" stroke-linecap="round"/>
                <path d="M54 54L71.5 44" stroke="#ff6b9d" stroke-width="4" stroke-linecap="round"/>
                <circle cx="54" cy="54" r="3.4" fill="#fff"/>
              </svg>
              <h1>অ্যানিমে ক্যালকুলেটর<small>কত ঘণ্টায় শেষ হবে?</small></h1>
              <button class="iconbtn" id="digitBtn" aria-label="সংখ্যার ধরন বদলান" title="১২৩ / 123"><span id="digitLbl" style="font-family:var(--display);font-weight:800;font-size:17px">১২৩</span></button>
              <button class="iconbtn" id="themeBtn" aria-label="থিম বদলান" aria-pressed="false">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.4 0 2-.9 2-1.8 0-.9-.6-1.4-.6-2.3 0-.9.7-1.6 1.7-1.6H17a4 4 0 004-4c0-4.4-4-8.3-9-8.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.4" fill="#ff4d4d"/><circle cx="10.5" cy="7" r="1.4" fill="#ffd93d"/><circle cx="15" cy="7" r="1.4" fill="#3ddc84"/></svg>
              </button>
            </header>

            <section class="tray" id="tray" hidden aria-label="থিম"></section>

            <section class="result" aria-live="polite">
              <div class="lbl">মোট সময় লাগবে</div>
              <div class="big" id="big">–</div>
              <div class="eq" id="eq"></div>
              <div class="pills" id="pills"></div>
            </section>

            <input class="name" id="name" type="text" placeholder="এনিমের নাম (ঐচ্ছিক)" maxlength="60" autocomplete="off">

            <div class="fields">
              <button class="field" id="fEps" aria-pressed="true"><span>এপিসোড</span><b id="vEps">১২</b></button>
              <button class="field" id="fMin" aria-pressed="false"><span>মিনিট / এপিসোড</span><b id="vMin">২৩</b></button>
            </div>
            <div class="chips" id="minChips"><span class="lbl">দৈর্ঘ্য</span></div>

            <div class="pad" id="pad"></div>

            <section class="card">
              <h2>কত দিনে শেষ করবেন?</h2>
              <div class="chips" id="hrChips"><span class="lbl">দিনে</span></div>
              <div class="out" id="outDaily"></div>
              <div class="row"><label class="lbl" for="deadline">শেষ করার তারিখ</label><input class="date" type="date" id="deadline"></div>
              <div class="out" id="outDead">তারিখ বেছে নিলে দিনে কয়টা এপিসোড দেখতে হবে সেটা এখানে দেখাবে।</div>
            </section>

            <section class="card">
              <h2>আমার ওয়াচলিস্ট</h2>
              <ul class="list" id="list"></ul>
              <div class="out" id="listTotal"></div>
              <p class="note">কি-প্যাডের নিচের <b>যোগ</b> বাটন চাপলে বর্তমান হিসাবটা এখানে জমা হবে।</p>
            </section>

            <section class="card">
              <h2>পোস্টার কার্ড (ঐচ্ছিক)</h2>
              <p class="note">এনিমের পোস্টার দিলে তার ওপর হিসাব করা সময় বসিয়ে একটা কার্ড বানিয়ে দেবে। ছবি শুধু আপনার ফোনেই থাকে, কোথাও পাঠানো হয় না।</p>
              <div class="row">
                <label class="btn" for="poster" style="display:inline-grid;place-items:center;cursor:pointer">পোস্টার বেছে নিন</label>
                <input type="file" id="poster" accept="image/*" hidden>
                <button class="btn ghost" id="noPoster">পোস্টার ছাড়াই বানান</button>
              </div>
              <img class="cardimg" id="cardImg" alt="তৈরি কার্ড" hidden>
              <p class="note" id="cardHint" hidden>ছবিটা চেপে ধরে "ছবি সেভ করুন" বেছে নিলে গ্যালারিতে চলে যাবে।</p>
              <button class="btn ghost" id="saveBtn" hidden>গ্যালারিতে সেভ করুন</button>
              <button class="btn ghost" id="shareBtn" hidden>শেয়ার করুন</button>
            </section>

            <div class="foot">অ্যানিমে ক্যালকুলেটর · সময় = এপিসোড × মিনিট</div>
          </div>

          <script>
          (function(){
            /* ---------- helpers ---------- */
            var $=function(id){return document.getElementById(id)};
            var BN='০১২৩৪৫৬৭৮৯', useBn=true;
            function dg(s){s=String(s);return useBn?s.replace(/[0-9]/g,function(d){return BN[+d]}):s}
            function store(k,v){try{localStorage.setItem('anic_'+k,JSON.stringify(v))}catch(e){}}
            function load(k,d){try{var v=localStorage.getItem('anic_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
            function lum(hex){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.2126*r+0.7152*g+0.0722*b)/255}
            function ink(hex){return lum(hex)>0.58?'#17102e':'#ffffff'}
            function fmtHM(total){
              var h=Math.floor(total/60), m=total%60, out=[];
              if(h>0) out.push(dg(h)+' ঘণ্টা');
              if(m>0||h===0) out.push(dg(m)+' মিনিট');
              return out.join(' ');
            }
            function fmtDays(total){
              var d=Math.floor(total/1440), h=Math.floor((total%1440)/60), out=[];
              if(d>0) out.push(dg(d)+' দিন');
              if(h>0) out.push(dg(h)+' ঘণ্টা');
              return out.join(' ');
            }
            function dec1(x){return dg((Math.round(x*10)/10).toString())}

            /* ---------- themes (rainbow first, five new ones) ---------- */
            var THEMES=[
              {id:'rain',name:'রংধনু',c:['#ff4d4d','#ff9f43','#ffd93d','#3ddc84','#2ec4f1','#7b61ff','#ff5ccb'],a:['#ff4d4d','#7b61ff','#2ec4f1']},
              {id:'sakura',name:'সাকুরা',c:['#ff8fb1','#f06292','#ffb3c8','#ce93d8','#b388ff','#ffc1e3','#e91e8c'],a:['#f06292','#b388ff','#ffb3c8']},
              {id:'neon',name:'নিয়ন',c:['#00f5d4','#00bbf9','#9b5de5','#f15bb5','#fee440','#00f5a0'],a:['#f15bb5','#9b5de5','#00f5d4']},
              {id:'flame',name:'অগ্নি',c:['#ff3b30','#ff6b1a','#ff9500','#ffc300','#e8261a','#ff7a59'],a:['#ff3b30','#ff9500','#ffc300']},
              {id:'galaxy',name:'গ্যালাক্সি',c:['#5b2eff','#8e44ff','#c13bff','#2d6cff','#00c2ff','#ff4fd8'],a:['#8e44ff','#c13bff','#00c2ff']},
              {id:'bolt',name:'বজ্র',c:['#ffd60a','#2f80ff','#ffe98a','#1fb6ff','#ffb300','#6c8cff'],a:['#ffd60a','#2f80ff','#1fb6ff']}
            ];
            var theme=THEMES[0];
            function applyTheme(t){
              theme=t;
              var r=document.documentElement.style;
              r.setProperty('--a1',t.a[0]);r.setProperty('--a2',t.a[1]);r.setProperty('--a3',t.a[2]);
              store('theme',t.id);
              buildPad();
              buildTray();
              renderAll();
            }
            function buildTray(){
              var tr=$('tray');tr.innerHTML='';
              THEMES.forEach(function(t){
                var b=document.createElement('button');b.className='tbtn';b.setAttribute('aria-pressed',t===theme);
                var bar=document.createElement('div');bar.className='bar';
                t.c.forEach(function(c){var i=document.createElement('i');i.style.background=c;bar.appendChild(i)});
                var s=document.createElement('span');s.textContent=t.name;
                b.appendChild(bar);b.appendChild(s);
                b.onclick=function(){applyTheme(t)};
                tr.appendChild(b);
              });
            }

            /* ---------- state ---------- */
            var st={eps:'12',mins:'23',active:'eps',hours:2,deadline:'',list:[]};
            var saved=load('state',null);
            if(saved){for(var k in saved){if(k in st)st[k]=saved[k]}}
            useBn=load('bn',true);
            function persist(){store('state',st)}
            function nEps(){return parseInt(st.eps||'0',10)||0}
            function nMin(){return parseInt(st.mins||'0',10)||0}
            function total(){return nEps()*nMin()}

            /* ---------- keypad ---------- */
            var KEYS=[
              ['7'],['8'],['9'],['⌫','del'],
              ['4'],['5'],['6'],['C','clr'],
              ['1'],['2'],['3'],['পরের ঘর','next','sm'],
              ['0'],['00'],['＋ যোগ','add','sm w2']
            ];
            function buildPad(){
              var pad=$('pad');pad.innerHTML='';
              var c=theme.c;
              KEYS.forEach(function(k,i){
                var b=document.createElement('button');
                b.className='key '+(k[2]||'');
                var col=c[i%c.length];
                b.style.background=col;b.style.color=ink(col);
                b.textContent=(/^[0-9]+$/.test(k[0]))?dg(k[0]):k[0];
                b.setAttribute('aria-label',k[1]||k[0]);
                b.onclick=function(){press(k[1]||k[0])};
                pad.appendChild(b);
              });
            }
            function press(k){
              try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}
              var f=st.active==='eps'?'eps':'mins', max=f==='eps'?5:4;
              if(k==='del'){st[f]=st[f].slice(0,-1)}
              else if(k==='clr'){st[f]=''}
              else if(k==='next'){st.active=f==='eps'?'mins':'eps'}
              else if(k==='add'){addToList();return}
              else{
                var v=(st[f]+k).replace(/^0+(?=\d)/,'');
                if(v.length<=max) st[f]=v;
              }
              renderAll();
            }

            /* ---------- chips ---------- */
            var MINS=[12,20,22,23,24,45];
            function buildChips(){
              var mc=$('minChips');
              MINS.forEach(function(m){
                var b=document.createElement('button');b.className='chip';b.dataset.v=m;
                b.onclick=function(){st.mins=String(m);renderAll()};
                mc.appendChild(b);
              });
              var hc=$('hrChips');
              [0.5,1,2,3,4,6].forEach(function(h){
                var b=document.createElement('button');b.className='chip';b.dataset.v=h;
                b.onclick=function(){st.hours=h;renderAll()};
                hc.appendChild(b);
              });
            }
            function hrLabel(h){return h===0.5?'আধা ঘণ্টা':dg(h)+' ঘণ্টা'}

            /* ---------- render ---------- */
            function daysBetween(dateStr){
              var p=dateStr.split('-'); if(p.length<3) return null;
              var t=new Date(+p[0],+p[1]-1,+p[2]); var n=new Date(); n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
              return Math.round((t-n)/86400000);
            }
            function renderAll(){
              var T=total();
              // fields
              $('vEps').textContent=st.eps?dg(st.eps):dg(0);$('vEps').className=st.eps?'':'empty';
              $('vMin').textContent=st.mins?dg(st.mins):dg(0);$('vMin').className=st.mins?'':'empty';
              $('fEps').setAttribute('aria-pressed',st.active==='eps');
              $('fMin').setAttribute('aria-pressed',st.active==='mins');
              // result
              $('big').textContent=T>0?fmtHM(T):'শূন্য';
              $('eq').textContent=dg(nEps())+' এপিসোড × '+dg(nMin())+' মিনিট = '+dg(T)+' মিনিট';
              var pills=[];
              if(T>0){
                pills.push('≈ '+dec1(T/1440)+' দিন (২৪ ঘণ্টা ধরে)');
                if(T>=1440) pills.push(fmtDays(T));
                var dd=Math.ceil(T/(st.hours*60));
                pills.push('দিনে '+hrLabel(st.hours)+' → '+dg(dd)+' দিন');
              }
              $('pills').innerHTML='';
              pills.forEach(function(p){var s=document.createElement('span');s.className='pill';s.textContent=p;$('pills').appendChild(s)});
              // chips
              document.querySelectorAll('#minChips .chip').forEach(function(b){
                b.textContent=dg(b.dataset.v);b.setAttribute('aria-pressed',+b.dataset.v===nMin());
              });
              document.querySelectorAll('#hrChips .chip').forEach(function(b){
                b.textContent=hrLabel(+b.dataset.v);b.setAttribute('aria-pressed',+b.dataset.v===st.hours);
              });
