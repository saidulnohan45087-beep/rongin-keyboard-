           '<div class="card"><b>Gemini চাবি (Google, ফ্রি)</b><ol class="st"><li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> খুলে গুগল অ্যাকাউন্টে ঢোকো।</li><li>"Create API key" চাপো, চাবিটা কপি করো।</li><li>নিচের ঘরে ধরে রেখে Paste করো।</li></ol><input type="password" id="kg" placeholder="AIza…" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(K.gemini)+'"><div class="row" style="margin-top:8px"><button class="btn sm" id="sg">সেভ ও পরীক্ষা</button></div>'+tst('gemini')+'<div class="note">ফ্রি সংস্করণে Google তোমার লেখা নিজেদের উন্নয়নে ব্যবহার করতে পারে। খুব ব্যক্তিগত কিছু লিখো না।</div></div>'+
           '<div class="card"><b>Groq চাবি (ফ্রি, বিকল্প)</b><ol class="st"><li><a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> খুলে সাইন-আপ করো।</li><li>"Create API Key" চাপো, চাবি কপি করো।</li><li>নিচের ঘরে Paste করো।</li></ol><input type="password" id="kq" placeholder="gsk_…" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(K.groq)+'"><div class="row" style="margin-top:8px"><button class="btn sm" id="sq">সেভ ও পরীক্ষা</button></div>'+tst('groq')+'</div>'+
           '<div class="card"><b>গোপনীয়তা</b><p style="margin:6px 0 0" class="sub">চাবি আর তোমার ঘটনাগুলো শুধু এই ফোনেই থাকে। লেখা সরাসরি Google বা Groq-এ যায়, অ্যাপের কোনো সার্ভার নেই।</p></div>'+
           '<div class="card"><b>সব ইতিহাস মুছবে?</b><div style="margin-top:8px"><button class="btn ghost sm" id="hc">'+(H.length?'আগের '+bn(H.length)+'টা ঘটনা মুছে ফেলো':'কোনো ইতিহাস নেই')+'</button></div></div>'}
          function bindSet(){document.querySelectorAll('.pf').forEach(function(b){b.onclick=function(){K.pref=b.dataset.p;lsSet('dd-keys',K);render()}});
           async function save(p,id){var v=$(id).value.trim();K[p]=v;if(p==='gemini')K.gmodel='';else K.qmodel='';lsSet('dd-keys',K);
            if(!v){S.test[p]={ok:true,m:'চাবি মুছে ফেলা হয়েছে।'};render();return}
            S.test[p]={ok:true,m:'পরীক্ষা চলছে…'};render();
            try{var o=p==='gemini'?await gemini('একটা ছোট ঘটনা: আমি আজ দেরি করে অফিসে গেছি।',true):await groq('একটা ছোট ঘটনা: আমি আজ দেরি করে অফিসে গেছি।');parseJSON(o.text);S.test[p]={ok:true,m:'চাবি ঠিক আছে ✓ (মডেল: '+o.model+')'}}
            catch(e){S.test[p]={ok:false,m:e.message||'পরীক্ষা ব্যর্থ'}}render()}
           var a=$('#sg');if(a)a.onclick=function(){save('gemini','#kg')};var b=$('#sq');if(b)b.onclick=function(){save('groq','#kq')};
           var c=$('#hc');if(c)c.onclick=function(){if(H.length){H=[];lsSet('dd-hist',H);render()}}}
          function render(){var keepScroll=window.scrollY;
           $('#app').innerHTML='<header>'+LOGO+'<div><h1>দর্শন দর্পণ</h1><small>ঘটনা বলো, দর্শনের আলোয় দেখো</small></div></header><div id="main">'+(S.tab==='ask'?vAsk():S.tab==='vault'?vVault():vSet())+'</div>';
           $('#nav').innerHTML=[['ask','ব্যাখ্যা'],['vault','ভাণ্ডার'],['set','সেটিং']].map(function(x){return'<button data-t="'+x[0]+'" class="'+(S.tab===x[0]?'on':'')+'">'+IC[x[0]]+x[1]+'</button>'}).join('');
           document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;if(S.tab==='ask')S.view=null;render();window.scrollTo(0,0)}});
           if(S.tab==='ask')bindAsk();else if(S.tab==='vault')bindVault();else bindSet()}
          window.appBack=function(){if(S.tab==='ask'&&S.view){S.view=null;render();return true}if(S.tab!=='ask'){S.tab='ask';render();return true}return false};
          render();
          })();
          </script></body></html>
