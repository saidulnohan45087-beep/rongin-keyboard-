      - name: Build keyboard APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rongin-bangla-keyboard.apk
          TAG="keyboard-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" rongin-bangla-keyboard.apk --repo "${{ github.repository }}" --title "Rongin Keyboard $TAG" --notes "Install rongin-bangla-keyboard.apk on your phone."
