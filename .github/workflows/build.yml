          package com.rongin.banglakb

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          class BanglaKeyboardService : InputMethodService() {

              private enum class Mode { JATIYA, EN, SYM }

              private var mode = Mode.JATIYA
              private var lang = Mode.JATIYA
              private var shift = 0 // 0 off, 1 once, 2 lock
              private var popupOn = true
              private var hapticOn = true
              private var rowHeightDp = 56
              private lateinit var sounds: SoundEngine
              private val handler = Handler(Looper.getMainLooper())

              private var root: LinearLayout? = null // the key rows
              private var overlay: FrameLayout? = null // key rows + the popup bubble
              private var bubble: TextView? = null
              private val hideRun = Runnable { hidePreview() }

              private val bubbleW = 58
              private val bubbleH = 64

              // A lone vowel sign or hasanta needs a dotted circle to be visible on a key.
              private val needsBase = Regex("^[ঁ-ঃ়া-্ৗ]")

              override fun onCreate() {
                  super.onCreate()
                  sounds = SoundEngine(this)
              }

              override fun onDestroy() {
                  sounds.release()
                  super.onDestroy()
              }

              override fun onCreateInputView(): View {
                  val frame = FrameLayout(this)
                  frame.setBackgroundColor(Color.parseColor("#07080B"))

                  val rows = LinearLayout(this)
                  rows.orientation = LinearLayout.VERTICAL
                  rows.setPadding(dp(4), dp(6), dp(4), dp(6))
                  val rowsLp = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  rowsLp.topMargin = dp(bubbleH + 6) // room above the top row for the popup bubble
                  rows.layoutParams = rowsLp
                  frame.addView(rows)

                  val bub = TextView(this)
                  bub.visibility = View.GONE
                  bub.gravity = Gravity.CENTER
                  bub.typeface = Typeface.DEFAULT_BOLD
                  bub.setTextSize(TypedValue.COMPLEX_UNIT_SP, 28f)
                  bub.elevation = dpf(8f)
                  bub.layoutParams = FrameLayout.LayoutParams(dp(bubbleW), dp(bubbleH))
                  frame.addView(bub)

                  root = rows
                  overlay = frame
                  bubble = bub
                  render()
                  return frame
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val cls = (info?.inputType ?: 0) and InputType.TYPE_MASK_CLASS
                  mode = if (cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE) Mode.SYM else lang
                  shift = 0
                  popupOn = Themes.popupOn(this)
                  hapticOn = Prefs.haptic(this)
                  rowHeightDp = Prefs.keyHeight(this)
                  sounds.prepare()
                  hidePreview()
                  render()
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  super.onFinishInputView(finishingInput)
                  hidePreview()
              }

              override fun onEvaluateFullscreenMode(): Boolean = false

              // ---------- drawing ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

              private fun dpf(v: Float): Float = v * resources.displayMetrics.density

              private fun show(s: String): String = if (needsBase.containsMatchIn(s)) "◌" + s else s

              private fun render() {
                  val container = root ?: return
                  container.removeAllViews()
                  val rows = when (mode) {
                      Mode.JATIYA -> Layouts.jatiya
                      Mode.EN -> Layouts.english
                      Mode.SYM -> Layouts.symbols
                  }
                  val theme = Themes.active(this)
                  rows.forEachIndexed { r, row ->
                      val rowView = LinearLayout(this)
                      rowView.orientation = LinearLayout.HORIZONTAL
                      rowView.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(rowHeightDp))
                      row.forEachIndexed { i, key ->
                          if (key.kind == Kind.PAD) {
                              val spacer = View(this)
                              spacer.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, key.w)
                              rowView.addView(spacer)
                          } else {
                              rowView.addView(keyView(key, r, i, theme))
                          }
                      }
                      container.addView(rowView)
                  }
              }

              private fun labelFor(key: Key): String = when (key.kind) {
                  Kind.SHIFT -> if (shift == 2) "⇪" else "⇧"
                  Kind.CHAR -> if (shift > 0) key.s else key.n
                  else -> key.n
              }

              private fun hintFor(key: Key): String? =
                  if (key.kind == Kind.CHAR) (if (shift > 0) key.altS else key.altN) else null

              @SuppressLint("ClickableViewAccessibility")
              private fun keyView(key: Key, r: Int, i: Int, theme: Theme): View {
                  val (bg, fg) = Themes.colorFor(theme, key, r, i)
                  val frame = FrameLayout(this)
                  val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, key.w)
                  lp.setMargins(dp(2), dp(3), dp(2), dp(3))
                  frame.layoutParams = lp
                  val shape = GradientDrawable()
                  shape.cornerRadius = dpf(9f)
                  shape.setColor(bg)
                  if (key.kind == Kind.SHIFT && shift > 0) shape.setStroke(dp(2), Color.parseColor("#F6C628"))
                  frame.background = shape
                  frame.elevation = dpf(1.5f)

                  val main = labelFor(key)
                  if (key.kind == Kind.DEL) {
                      val icon = ImageView(this)
                      icon.setImageResource(android.R.drawable.ic_input_delete)
                      icon.setColorFilter(fg)
                      icon.layoutParams = FrameLayout.LayoutParams(dp(26), dp(26), Gravity.CENTER)
                      frame.addView(icon)
                  } else if (main.isNotEmpty()) {
                      val tv = TextView(this)
                      tv.text = show(main)
                      tv.setTextColor(fg)
                      tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, if (main.codePointCount(0, main.length) > 2) 15f else 22f)
                      tv.typeface = Typeface.DEFAULT_BOLD
                      tv.gravity = Gravity.CENTER
                      tv.layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      frame.addView(tv)
                  }

                  val hint = hintFor(key)
                  if (hint != null) {
                      val h = TextView(this)
                      h.text = show(hint)
                      h.setTextColor(fg)
                      h.alpha = 0.7f
                      h.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                      val hlp = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.END
                      )
                      hlp.setMargins(0, dp(3), dp(5), 0)
                      h.layoutParams = hlp
                      frame.addView(h)
                  }

                  attach(frame, key, bg, fg)
                  return frame
              }

              // ---------- popup bubble ----------

              private fun previewPos(v: View): IntArray {
                  val ov = overlay ?: return intArrayOf(0, 0)
                  val a = IntArray(2)
                  val b = IntArray(2)
                  v.getLocationOnScreen(a)
                  ov.getLocationOnScreen(b)
                  val bw = dp(bubbleW)
                  val bh = dp(bubbleH)
                  var x = a[0] - b[0] + (v.width - bw) / 2
                  x = x.coerceIn(0, maxOf(0, ov.width - bw))
                  val y = a[1] - b[1] - bh - dp(2)
                  return intArrayOf(x, y)
              }

              private fun showPreview(pos: IntArray, text: String, bg: Int, fg: Int) {
                  val bub = bubble ?: return
                  val shape = GradientDrawable()
                  shape.cornerRadius = dpf(12f)
                  shape.setColor(bg)
                  shape.setStroke(dp(1), Color.parseColor("#55000000"))
                  bub.background = shape
                  bub.setTextColor(fg)
                  bub.text = show(text)
                  bub.x = pos[0].toFloat()
                  bub.y = pos[1].toFloat()
                  bub.visibility = View.VISIBLE
              }

              private fun hidePreview() {
                  handler.removeCallbacks(hideRun)
                  bubble?.visibility = View.GONE
              }

              // ---------- touch handling ----------

              @SuppressLint("ClickableViewAccessibility")
              private fun attach(v: View, key: Key, bg: Int, fg: Int) {
                  var longFired = false
                  var pos = intArrayOf(0, 0)
                  val longRun = Runnable {
                      val alt = if (shift > 0) key.altS else key.altN
                      if (alt != null) {
                          longFired = true
                          commit(alt)
                          v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          if (popupOn) {
                              showPreview(pos, alt, bg, fg)
                              handler.removeCallbacks(hideRun)
                              handler.postDelayed(hideRun, 450)
                          }
                          afterChar()
                      }
                  }
                  val repeat = object : Runnable {
                      override fun run() {
                          doDelete()
                          sounds.play(Variant.DEL)
                          handler.postDelayed(this, 55)
                      }
                  }
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              longFired = false
                              handler.removeCallbacks(hideRun)
                              v.alpha = 0.78f
                              if (hapticOn) v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              sounds.play(variantFor(key))
                              if (key.kind == Kind.CHAR && popupOn) {
                                  pos = previewPos(v)
                                  showPreview(pos, labelFor(key), bg, fg)
                              }
                              if (key.kind == Kind.DEL) {
                                  doDelete()
                                  handler.postDelayed(repeat, 400)
                              } else if (key.kind == Kind.CHAR && (if (shift > 0) key.altS else key.altN) != null) {
                                  handler.postDelayed(longRun, 380)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              v.alpha = 1f
                              handler.removeCallbacks(longRun)
                              handler.removeCallbacks(repeat)
                              if (!longFired) {
                                  hidePreview()
                                  if (key.kind != Kind.DEL) onKey(key)
                              }
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              v.alpha = 1f
                              handler.removeCallbacks(longRun)
                              handler.removeCallbacks(repeat)
                              if (!longFired) hidePreview()
                          }
                      }
                      true
                  }
              }

              private fun variantFor(key: Key): Variant = when (key.kind) {
                  Kind.DEL -> Variant.DEL
                  Kind.ENTER -> Variant.ENTER
                  Kind.CHAR -> Variant.KEY
                  else -> Variant.SPECIAL
              }

              private fun onKey(key: Key) {
                  when (key.kind) {
                      Kind.CHAR -> {
                          commit(if (shift > 0) key.s else key.n)
                          afterChar()
                      }
                      Kind.SHIFT -> {
                          shift = (shift + 1) % 3
                          render()
                      }
                      Kind.SPACE -> commit(" ")
                      Kind.ENTER -> doEnter()
                      Kind.SYM -> {
                          mode = Mode.SYM
                          shift = 0
                          render()
                      }
                      Kind.ABC -> {
                          mode = lang
                          shift = 0
                          render()
                      }
                      Kind.LANG -> {
                          lang = if (lang == Mode.JATIYA) Mode.EN else Mode.JATIYA
                          mode = lang
                          shift = 0
                          render()
                      }
                      else -> Unit
                  }
              }

              private fun afterChar() {
                  if (shift == 1) {
                      shift = 0
                      render()
                  }
              }

              private fun commit(text: String) {
                  currentInputConnection?.commitText(text, 1)
              }

              private fun doDelete() {
                  sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
              }

              private fun doEnter() {
                  val ei = currentInputEditorInfo
                  if (ei == null) {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                      return
                  }
                  val multiLine = (ei.inputType and InputType.TYPE_TEXT_FLAG_MULTI_LINE) != 0
                  val noAction = (ei.imeOptions and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                  val action = ei.imeOptions and EditorInfo.IME_MASK_ACTION
                  if (multiLine || noAction || action == EditorInfo.IME_ACTION_NONE || action == EditorInfo.IME_ACTION_UNSPECIFIED) {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  } else {
                      currentInputConnection?.performEditorAction(action)
                  }
              }
          }
          RONGIN_EOF
          mkdir -p app/src/main/java/com/rongin/banglakb
          cat > app/src/main/java/com/rongin/banglakb/Layouts.kt <<'RONGIN_EOF'
          package com.rongin.banglakb

          enum class Kind { CHAR, SHIFT, DEL, ENTER, SPACE, SYM, ABC, LANG, PAD }

          /**
           * One key. [n] is the normal label/output, [s] the shifted one.
           * [altN] / [altS] are the small corner characters typed by holding the key
           * (in normal / shifted state). Function keys keep their label in [n].
           */
          class Key(
              val n: String,
              val s: String = n,
              val altN: String? = null,
              val altS: String? = null,
              val w: Float = 1f,
              val kind: Kind = Kind.CHAR,
              val fn: Boolean = false,
          )

          object Layouts {
              private const val BN_DIGITS = "০১২৩৪৫৬৭৮৯"
              private val shiftedDigits = listOf("!", "@", "#", "৳", "%", "ঁ", "&", "*", "(", ")")

              /** Letter key whose hold-character is its shifted character. */
              private fun k(n: String, s: String, altN: String? = s, altS: String? = null) = Key(n, s, altN, altS)

              private fun fk(kind: Kind, label: String = "", w: Float = 1f) = Key(label, label, null, null, w, kind, true)

              private fun pad(w: Float) = Key("", "", null, null, w, Kind.PAD)

              private fun punct(c: String) = Key(n = c, fn = true)

              /** Bangla national (Jatiya) layout. */
              val jatiya: List<List<Key>> = listOf(
                  "1234567890".mapIndexed { i, d ->
                      Key(BN_DIGITS[d - '0'].toString(), shiftedDigits[i], d.toString(), null)
                  },
                  listOf(
                      k("ঙ", "ং"), k("য", "য়"), k("ড", "ঢ"), k("প", "ফ"), k("ট", "ঠ"),
                      k("চ", "ছ"), k("জ", "ঝ"), k("হ", "ঞ"), k("গ", "ঘ"), k("ড়", "ঢ়"),
