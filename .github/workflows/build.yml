          package com.rongin.banglakb

          import android.content.Context
          import android.graphics.Color
          import org.json.JSONArray
          import org.json.JSONObject

          /** A key colour theme. Colours are ARGB ints. Key colours repeat in order across the keyboard. */
          class Theme(
              val name: String,
              val cycle: List<Int>,
              val fn: Int,
              val enter: Int,
              val builtin: Boolean,
          )

          object Themes {
              private const val PREFS = "kb"

              private fun c(hex: String): Int = Color.parseColor(hex)

              val builtin: List<Theme> by lazy {
                  val y = c("#F6C628")
                  val b = c("#2563D9")
                  val w = c("#F3F2EE")
                  val r = c("#E5392F")
                  val k = c("#1D1F27")
                  val g = c("#27B37A")
                  val p = c("#EE5C9B")
                  val v = c("#7B57E0")
                  val o = c("#F58A1F")
                  listOf(
                      Theme("রংধনু", listOf(y, b, w, r), k, r, true),
                      Theme("সমুদ্র", listOf(b, w), k, y, true),
                      Theme("ক্যান্ডি", listOf(p, w, v), k, y, true),
                      Theme("বন", listOf(g, w, k), y, o, true),
                      Theme("সূর্যাস্ত", listOf(o, y, r), k, v, true),
                      Theme("রাত", listOf(k), v, y, true),
                  )
              }

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              /** Themes the user made. Unlimited; stored as JSON on the phone. */
              fun custom(ctx: Context): List<Theme> {
                  return try {
                      val arr = JSONArray(prefs(ctx).getString("custom", "[]") ?: "[]")
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          val cs = o.getJSONArray("c")
                          val colors = (0 until cs.length()).map { j -> cs.getInt(j) }
                          Theme(o.getString("n"), colors, o.getInt("f"), o.getInt("e"), false)
                      }.filter { it.cycle.isNotEmpty() }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun all(ctx: Context): List<Theme> = builtin + custom(ctx)

              private fun saveCustom(ctx: Context, list: List<Theme>) {
                  val arr = JSONArray()
                  list.forEach { t ->
                      val o = JSONObject()
                      o.put("n", t.name)
                      val cs = JSONArray()
                      t.cycle.forEach { col -> cs.put(col) }
                      o.put("c", cs)
                      o.put("f", t.fn)
                      o.put("e", t.enter)
                      arr.put(o)
                  }
                  prefs(ctx).edit().putString("custom", arr.toString()).apply()
              }

              fun addCustom(ctx: Context, t: Theme) {
                  saveCustom(ctx, custom(ctx) + t)
                  save(ctx, all(ctx).size - 1)
              }

              /** [allIndex] is the position in [all]. Built-in themes cannot be removed. */
              fun removeCustom(ctx: Context, allIndex: Int) {
                  val ci = allIndex - builtin.size
                  val list = custom(ctx).toMutableList()
                  if (ci in list.indices) {
                      list.removeAt(ci)
                      saveCustom(ctx, list)
                  }
                  val cur = current(ctx)
                  val next = if (cur == allIndex) 0 else if (cur > allIndex) cur - 1 else cur
                  save(ctx, next)
              }

              fun current(ctx: Context): Int =
                  prefs(ctx).getInt("theme", 0).coerceIn(0, all(ctx).size - 1)

              fun active(ctx: Context): Theme = all(ctx)[current(ctx)]

              fun save(ctx: Context, index: Int) {
                  prefs(ctx).edit().putInt("theme", index).apply()
              }

              fun popupOn(ctx: Context): Boolean = prefs(ctx).getBoolean("popup", true)

              fun setPopup(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean("popup", on).apply()
              }

              /** Dark label on light keys, white label on dark keys. */
              fun labelOn(bg: Int): Int {
                  val lum = (0.299 * Color.red(bg) + 0.587 * Color.green(bg) + 0.114 * Color.blue(bg)) / 255.0
                  return if (lum > 0.5) Color.parseColor("#16171B") else Color.WHITE
              }

              /** Returns (key background, label colour). */
              fun colorFor(theme: Theme, key: Key, row: Int, col: Int): Pair<Int, Int> {
                  val bg = when {
                      key.kind == Kind.ENTER -> theme.enter
                      key.fn -> theme.fn
                      else -> theme.cycle[(row * 2 + col) % theme.cycle.size]
                  }
                  return bg to labelOn(bg)
              }
          }
