             +hexbtn('play','খেলা শুরু',n>=5?bn(n)+'টি প্রশ্ন তৈরি':'আগে একটা পৃষ্ঠা যোগ করো',n<5)
             +hexbtn('add','পৃষ্ঠা যোগ করো','ছবি · পিডিএফ · লেখা')
             +hexbtn('bank','প্রশ্নভাণ্ডার',bn(A.sources.length)+'টি উৎস')+'</div>'
             +'<div class="stats"><div class="stat"><b>'+(st.best?money(st.best):'–')+'</b><span>সর্বোচ্চ জিত</span></div>'
             +'<div class="stat"><b>'+bn(sk)+' দিন</b><span>টানা খেলা'+(played?' · আজ খেলেছ':'')+'</span></div>'
             +'<div class="stat"><b>'+(st.asked?bn(Math.round(st.right*100/st.asked))+'%':'–')+'</b><span>ঠিক উত্তর</span></div></div>'
             +'<div class="row" style="margin-top:16px"><button class="btn" data-act="mute">'+(mute?'শব্দ বন্ধ':'শব্দ চালু')+'</button></div>';
          }
          function viewBank(){
            var h='<button class="back" data-act="home">← ঘরে ফিরি</button><h2>প্রশ্নভাণ্ডার</h2>';
            if(!A.sources.length)return h+'<p class="lead">এখনো কোনো পৃষ্ঠা যোগ করোনি।</p><button class="btn gold" data-act="add">পৃষ্ঠা যোগ করো</button>';
            A.sources.forEach(function(s){
              var dt=new Date(s.created||Date.now()),ds=bn(dt.getDate())+'/'+bn(dt.getMonth()+1);
              h+='<div class="src"><b>'+esc(s.title)+'</b><div class="small">'+ds+' · '+bn(s.qs.length)+'টি প্রশ্ন</div><div class="row" style="margin-top:8px">'
               +'<button class="btn gold" data-act="playsrc" data-id="'+esc(s.id)+'"'+(s.qs.length<5?' disabled':'')+'>এখান থেকে খেলো</button>'
               +'<button class="btn" data-act="delsrc" data-id="'+esc(s.id)+'">মুছো</button></div>'
               +'<details><summary>প্রশ্ন ও উত্তর পড়ো ('+bn(s.qs.length)+')</summary>';
              s.qs.forEach(function(q){h+='<div class="qi">'+esc(q.q)+'<br><i>উত্তর: '+esc(q.o[q.a])+'</i>'+(q.e?'<div class="small">'+esc(q.e)+'</div>':'')+'</div>';});
              h+='</details></div>';
            });
