           var h='<button class="back" id="bk">← গেমের তালিকা</button><h2>কাস্টম পাজল</h2><div class="sub">vs '+esc(g.opp)+' · এই গেমে '+bn(ts.length)+' ধরনের থিম পাওয়া গেছে</div>';
           if(!g.pz.length)h+='<div class="msg">এই গেমে কোনো পরিষ্কার ট্যাকটিক পাওয়া যায়নি।</div>';
           else{h+='<div class="th-head"><span></span><span>থিম</span><span>পাজল</span><span>আমার স্কোর</span></div><div class="box">';
           h+='<button class="th '+(all?'on':'')+'" data-t="*"><span class="ck">'+(all?'✓':'')+'</span><span class="nm">সব থিম</span><span class="n">'+bn(g.pz.length)+'</span><span class="s"></span></button>';
           ts.forEach(function(x){var on=S.sel[x.t];h+='<button class="th '+(on?'on':'')+'" data-t="'+esc(x.t)+'"><span class="ck">'+(on?'✓':'')+'</span><span class="nm">'+esc(x.t)+'<small>'+(TH[x.t]||'')+'</small></span><span class="n">'+bn(x.n)+'</span><span class="s">'+bnPct(myScore(x.t))+'</span></button>'});
