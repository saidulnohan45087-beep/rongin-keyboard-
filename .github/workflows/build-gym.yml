            function stroke(col,lw,dx){cx.strokeStyle=col;cx.lineWidth=lw*DPR;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();all.forEach(function(pt){cx.moveTo(pt[0][0]+dx,pt[0][1]+dx);for(var i=1;i<pt.length;i++)cx.lineTo(pt[i][0]+dx,pt[i][1]+dx)});cx.stroke()}
