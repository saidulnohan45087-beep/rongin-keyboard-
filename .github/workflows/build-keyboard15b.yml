      - name: Build keyboard APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard15b-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rongin-keyboard-15-alada.apk
          TAG="keyboard15b-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" rongin-keyboard-15-alada.apk --repo "${{ github.repository }}" --title "Rongin Keyboard 1.5 Alada Alada $TAG" --notes "Install rongin-keyboard-15-alada.apk on your phone."
