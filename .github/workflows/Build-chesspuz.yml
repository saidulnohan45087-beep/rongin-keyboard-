           var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520"><rect width="400" height="520" fill="#1b1840"/><g transform="translate(0,120)">'+c+'</g><text x="200" y="70" fill="#fff" font-size="40" font-weight="700" text-anchor="middle" font-family="sans-serif">নাইট ফর্ক</text><text x="200" y="104" fill="#c9c9ff" font-size="18" text-anchor="middle" font-family="sans-serif">নমুনা পোস্টার</text></svg>';
           return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
          function artLoad(){if(ART)return;ART=lsGet('cp-art',null);if(!ART){ART=[{id:'demo',title:'নাইট ফর্ক: এক চালে দুই শিকার',date:'নমুনা লেখা',poster:demoPoster(),body:'ফর্ক হলো এমন চাল, যেখানে একটা গুটি একসাথে দুটো বা তার বেশি প্রতিপক্ষ গুটিকে আক্রমণ করে।\nঘোড়া এই কাজে সবচেয়ে ভয়ংকর, কারণ ঘোড়াকে আক্রমণ করার সুযোগ প্রতিপক্ষ সহজে পায় না।\nসবচেয়ে বিখ্যাত ফর্ক হলো রয়্যাল ফর্ক, যেখানে ঘোড়া একসাথে রাজা আর বাদশাহকে আক্রমণ করে।\nএই লেখাটা শুধু নমুনা। নিচের বোতাম দিয়ে তুমি নিজের লেখা আর পোস্টার যোগ করতে পারবে।'}]}}
          function artSave(){return lsSet('cp-art',ART)}
