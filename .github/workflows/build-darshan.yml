name: Build Darshan APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-darshan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p darshan-app
          mkdir -p darshan-app/app
          cat > darshan-app/app/build.gradle.kts <<'PATH_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.darshan.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.darshan.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          PATH_EOF
          mkdir -p darshan-app/app/src/main
          cat > darshan-app/app/src/main/AndroidManifest.xml <<'PATH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PATH_EOF
          mkdir -p darshan-app/app/src/main/assets
          cat > darshan-app/app/src/main/assets/index.html <<'PATH_EOF'
          <!doctype html>
          <html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>দর্শন দর্পণ</title>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
          <style>
          /* Layout: single column, bottom tab bar (ব্যাখ্যা / ভাণ্ডার / সেটিং). Dark navy ground with a teal lens accent. */
          :root{--bg:#f3f5fa;--panel:#ffffff;--line:#d9deea;--fg:#171b2b;--mute:#5d6682;--accent:#0f766e;--accent-fg:#fff;--soft:#e3f1ef;--warn:#a15c07;--bad:#b3392b;--good:#1f7a4d;--f:'Hind Siliguri',system-ui,-apple-system,'Noto Sans Bengali',sans-serif}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--panel:#171c2e;--line:#272f48;--fg:#eceff8;--mute:#9aa4c0;--accent:#62d0c4;--accent-fg:#06201d;--soft:#16302f;--warn:#e6b45a;--bad:#f08b7d;--good:#6fd39b;color-scheme:dark}}
          :root[data-theme="dark"]{--bg:#0e1220;--panel:#171c2e;--line:#272f48;--fg:#eceff8;--mute:#9aa4c0;--accent:#62d0c4;--accent-fg:#06201d;--soft:#16302f;--warn:#e6b45a;--bad:#f08b7d;--good:#6fd39b;color-scheme:dark}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15.5px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:84px}
          .app{max-width:560px;margin:0 auto}
          button,textarea,input{font:inherit;color:inherit}
          button{cursor:pointer}
          button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
          header{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
          header svg{width:34px;height:34px;flex:none}
          h1{font-size:22px;margin:0;font-weight:700;line-height:1.2}
          header small{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
          h2{font-size:18px;margin:6px 0 8px}
          .sub{color:var(--mute);font-size:13.5px}
          .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
          textarea{width:100%;min-height:130px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.6;font-size:16px}
          input[type=password],input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
          .btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;width:100%}
          .btn.sm{width:auto;padding:8px 14px;font-size:14px}
          .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
          .btn[disabled]{opacity:.5;cursor:default}
          .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
          .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13.5px;color:var(--mute);text-align:left}
          .chip.on{background:var(--soft);color:var(--accent);border-color:var(--accent)}
          .msg{border-radius:12px;padding:10px 12px;margin:10px 0;border:1px solid var(--line);background:var(--panel)}
          .msg.bad{border-color:var(--bad);color:var(--bad)}.msg.ok{border-color:var(--good);color:var(--good)}
          .lens h3{margin:0;font-size:18px;line-height:1.3}
          .lens .en{font-size:13px;color:var(--mute)}
          .fit{display:inline-block;font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:middle}
          .lab{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin:12px 0 2px}
          .lens p{margin:0}
          .counter{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;color:var(--mute)}
          .note{font-size:12.5px;color:var(--mute);margin:8px 0}
          .hist button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
          .hist .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
          .hist .m{font-size:12.5px;color:var(--mute)}
          nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
          nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--mute);font-size:12.5px;font-weight:600}
          nav button.on{color:var(--accent)}
          nav svg{width:22px;height:22px}
          details.card summary{cursor:pointer;font-weight:700;font-size:16.5px;list-style:none}
          details.card summary::-webkit-details-marker{display:none}
          details.card summary small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
          details.card[open] summary{margin-bottom:8px}
          .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--accent-fg);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
          @keyframes sp{to{transform:rotate(360deg)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}}
          a{color:var(--accent)}
          .row{display:flex;gap:8px;align-items:center}
          .row>*{min-width:0}
          label.f{display:block;font-size:13.5px;color:var(--mute);margin:12px 0 4px}
          ol.st{padding-left:20px;margin:6px 0}ol.st li{margin-bottom:4px}
          </style></head><body><div class="app" id="app"></div>
          <nav id="nav"></nav>
          <script>
          (function(){
          var $=function(s){return document.querySelector(s)};
          function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
          function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
          function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
          var BN='০১২৩৪৫৬৭৮৯';function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
          var K=lsGet('dd-keys',{gemini:'',groq:'',pref:'gemini',gmodel:'',qmodel:''});
          var H=lsGet('dd-hist',[]);
          var S={tab:'ask',lens:'',q:'',busy:false,err:'',view:null,test:{}};
          var EX=['বন্ধু আমার সঙ্গে প্রতারণা করেছিল, কিন্তু আমি প্রতিশোধ নিইনি।','চাকরি হারিয়ে মন ভেঙে গেছে, কিন্তু পরিবারের জন্য আবার শুরু করতে হবে।','ভাইকে বাঁচাতে একটা মিথ্যা বলেছি, এখন খারাপ লাগছে।','সবাই যে পথে যাচ্ছে সেটা বাদ দিয়ে নিজের পথে হাঁটার সিদ্ধান্ত নিলাম।'];
          var SYS='তুমি একজন দর্শনের শিক্ষক। ব্যবহারকারী একটা ঘটনা বা পরিস্থিতি বলবে। ঘটনাটাকে কোন কোন দার্শনিক ধারার আলোয় দেখা যায়, সহজ বাংলায় বোঝাও।\nনিয়ম:\n১) ১ থেকে ৩টা ধারা বেছে নাও, সবচেয়ে মানানসইটা আগে। জোর করে মেলাবে না। কম মিললে "fit" এ সেটা বলো।\n২) প্রতিটা ধারার জন্য: name_bn, name_en, fit (শুধু "খুব মেলে", "মোটামুটি মেলে" বা "সামান্য মেলে"), why (ঘটনার নির্দিষ্ট অংশ ধরে কেন মেলে), thinkers (প্রধান দার্শনিকদের নাম), guidance (ওই ধারা অনুযায়ী ঘটনাটা কীভাবে ভাবা বা সামলানো যায়), counter (এর বিপরীত বা আলাদা একটা দৃষ্টিভঙ্গি, এক-দুই বাক্যে)।\n৩) নীতিকথা শোনাবে না, ব্যবহারকারীকে দোষী করবে না।\n৪) কোনো দার্শনিকের নামে উদ্ধৃতি বানাবে না।\n৫) সহজ বাংলা, ছোট বাক্য।\n৬) আউটপুট শুধু একটা JSON: {"summary":"ঘটনার এক-দুই লাইনের সারকথা","lenses":[{...}],"closing":"একটা ছোট ভাবনা"}। JSON ছাড়া আর কিছু লিখবে না।';
          var VAULT=[
          ['স্টোয়িসিজম','Stoicism','এপিক্টেটাস, সেনেকা, মার্কাস অরেলিয়াস','যা নিজের নিয়ন্ত্রণে নেই (অন্যের আচরণ, ফলাফল, ভাগ্য) তা মেনে নাও। যা নিয়ন্ত্রণে আছে (নিজের বিচার, সিদ্ধান্ত, কাজ) তাতেই মন দাও।','পরীক্ষার ফল নিয়ে দুশ্চিন্তা না করে পড়াশোনার চেষ্টাটা ঠিক রাখা।'],
          ['এপিকিউরিয়ানিজম','Epicureanism','এপিকিউরাস','সুখ মানে ব্যথা আর উদ্বেগ না থাকা। সহজ জীবন, বন্ধুত্ব আর শান্ত মনই সবচেয়ে বড় সুখ। অকারণ লোভ কষ্ট বাড়ায়।','দামি জিনিসের পেছনে না ছুটে বন্ধুদের সঙ্গে সময় কাটানো।'],
          ['অস্তিত্ববাদ','Existentialism','সার্ত্র, সিমন দ্য বুভোয়া (পূর্বসূরি: কিয়ের্কেগার)','মানুষকে কেউ আগে থেকে অর্থ দিয়ে পাঠায়নি। নিজের পছন্দ আর কাজ দিয়েই সে নিজের জীবনের অর্থ গড়ে। স্বাধীনতার সঙ্গে আসে পুরো দায়িত্ব।','সবাই যা করছে তা না করে নিজের বেছে নেওয়া পথে চলার দায় নিজে নেওয়া।'],
          ['অ্যাবসার্ডিজম','Absurdism','আলবের ক্যামু','অর্থ খোঁজার মানুষের আকুতি আর নীরব বিশ্বের মধ্যে যে ফাঁক, সেটাই "অযৌক্তিকতা"। ক্যামুর মতে সমাধান হার মানা নয়, জেনেও বিদ্রোহ করে পুরোপুরি বেঁচে থাকা।','অর্থহীন লাগলেও প্রতিদিনের কাজটা মন দিয়ে করে যাওয়া।'],
          ['নিহিলিজম','Nihilism','আলোচনায় নিটশে','মূল্য, নৈতিকতা বা জীবনের অর্থ কিছুই স্বতঃসিদ্ধ নয়, এই ধারণা। নিটশে একে বিপদ হিসেবে দেখেছিলেন এবং নতুন মূল্য নিজে সৃষ্টি করার কথা বলেছিলেন।','প্রচলিত বিশ্বাস ভেঙে গেলে তার জায়গায় কী গড়বে সেই প্রশ্ন।'],
          ['উপযোগবাদ','Utilitarianism','জেরেমি বেন্থাম, জন স্টুয়ার্ট মিল','যে কাজে মোট সুখ বেশি আর কষ্ট কম হয়, সেটাই ঠিক। ফল দেখেই কাজের মূল্য বিচার করা হয়, সবার সুখ সমান গুরুত্বের।','একটা সিদ্ধান্তে বেশি মানুষের উপকার হলে সেটাকে প্রাধান্য দেওয়া।'],
          ['কর্তব্যবাদ','Deontology','ইমানুয়েল কান্ট','ফল নয়, কাজটা নিজে নীতিতে ঠিক কি না সেটাই আসল। কাউকে শুধু উপায় হিসেবে ব্যবহার করা যায় না। কান্টের মতে মিথ্যা বলা সবসময় ভুল।','লাভ হলেও কথা দিয়ে কথা রাখা, প্রতারণা না করা।'],
          ['সদ্গুণ নীতি','Virtue Ethics','অ্যারিস্টটল','প্রশ্নটা "কোন কাজ ঠিক?" নয়, "আমি কেমন মানুষ হব?"। সাহস, সংযম, ন্যায়ের মতো গুণ অভ্যাসে গড়ে ওঠে। সবকিছুর মধ্যপন্থাই ভালো।','রাগের সময় ঠান্ডা থাকার অভ্যাস করে ধৈর্যশীল হওয়া।'],
          ['নির্ধারণবাদ','Determinism','আলোচনায় স্পিনোজা','সবকিছু আগের কারণ থেকে ঘটে, তাই মানুষের "মুক্ত ইচ্ছা" কতটা আছে তা নিয়ে তর্ক আছে। এই ধারা দোষারোপের বদলে কারণ বোঝার দিকে নেয়।','কেউ খারাপ আচরণ করলে তার পেছনের কারণ বোঝার চেষ্টা করা।'],
          ['প্র্যাগম্যাটিজম','Pragmatism','চার্লস পার্স, উইলিয়াম জেমস, জন ডিউই','একটা ধারণা ঠিক কি না তা তার বাস্তব ফল দিয়ে বোঝা যায়। কাজে লাগে এমন বিশ্বাসই মূল্যবান।','কোন পদ্ধতি ভালো তা তর্ক না করে পরীক্ষা করে দেখা।'],
          ['সংশয়বাদ','Skepticism','পিরো, সেক্সটাস এম্পিরিকাস','নিশ্চিত জ্ঞান পাওয়া কঠিন। প্রমাণ না থাকলে রায় স্থগিত রাখো। এতে মনও শান্ত থাকে।','কিছু শুনেই বিশ্বাস না করে যাচাই করে দেখা।'],
          ['সিনিসিজম','Cynicism','সিনোপের ডায়োজেনিস','সমাজের লোভ, খ্যাতি আর লোকাচার ত্যাগ করে প্রকৃতি অনুযায়ী সহজ জীবন কাটানো। সরাসরি সত্য বলা।','প্রচলিত ভোগ ছেড়ে অল্পে সন্তুষ্ট থাকা।'],
          ['বৌদ্ধ দর্শন','Buddhist philosophy','গৌতম বুদ্ধ','সবকিছু অনিত্য। আসক্তি থেকে দুঃখ জন্মায়। মধ্যপথ আর আর্য অষ্টাঙ্গিক মার্গ ধরে চললে দুঃখের অবসান সম্ভব।','কিছু হারানোর কষ্টে মনে রাখা যে সবই বদলায়।'],
          ['কনফুসীয় দর্শন','Confucianism','কনফুসিয়াস','মানুষ সম্পর্কের জালে বাঁধা। পরিবার ও সমাজে প্রত্যেকের দায়িত্ব পালন, শিক্ষা, শ্রদ্ধা আর আত্মগঠনই ভালো সমাজের ভিত্তি।','বাবা-মা ও গুরুজনের প্রতি দায়িত্ব নিয়ে সিদ্ধান্ত নেওয়া।'],
          ['সামাজিক চুক্তি','Social Contract','হবস, লক, রুশো','রাষ্ট্র ও আইনের বৈধতা আসে মানুষের সম্মতির এক অলিখিত চুক্তি থেকে। নিরাপত্তা বা অধিকারের বিনিময়ে কিছু স্বাধীনতা ছাড়া হয়।','আইন মানা কেন জরুরি, বা অন্যায় আইন ভাঙা কতটা ঠিক সেই তর্ক।'],
          ['চার্বাক','Charvaka','প্রাচীন ভারতীয় বস্তুবাদী ধারা','প্রত্যক্ষ প্রমাণকেই একমাত্র প্রমাণ মানে। যা দেখা-ছোঁয়া যায় না, যেমন পরকাল, তা নিয়ে সংশয় তোলে এবং ইহজীবনের সুখকে গুরুত্ব দেয়।','যা প্রমাণ করা যায় না তা মেনে নেওয়ার আগে প্রশ্ন তোলা।']];
          var IC={ask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>',vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11M4 20h16M9 20v-7h6v7"/></svg>',set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3M14 9l2 2"/></svg>'};
          var LOGO='<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#1b2140"/><circle cx="24" cy="24" r="14" fill="none" stroke="#62d0c4" stroke-width="2.5"/><circle cx="24" cy="24" r="7" fill="none" stroke="#e8c46a" stroke-width="2"/><circle cx="24" cy="24" r="2.6" fill="#e8c46a"/></svg>';
          function parseJSON(t){t=String(t).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(t)}catch(e){var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));throw e}}
          function E(code,msg){var e=new Error(msg);e.code=code;return e}
          function httpErr(name,r,j){var m=(j&&j.error&&(j.error.message||j.error))||'';
           if(r.status===429)return E('limit',name+'-এর ফ্রি সীমা এখন শেষ বা খুব দ্রুত অনুরোধ গেছে। একটু পরে চেষ্টা করো।');
           if(r.status===401||r.status===403||/API key|api_key|invalid/i.test(String(m))&&r.status===400)return E('auth',name+'-এর চাবি ঠিক নেই, বা এই এলাকা থেকে ব্যবহারের অনুমতি নেই। সেটিংসে চাবিটা আবার দেখো।');
           if(r.status===404)return E('model',name+'-এ মডেলটা পাওয়া যায়নি');
           return E('http',name+' থেকে সমস্যা এসেছে ('+r.status+')। '+String(m).slice(0,120))}
          async function netFetch(url,opt,name){try{return await fetch(url,opt)}catch(e){throw E('net','ইন্টারনেট সংযোগ নেই বা '+name+'-এ পৌঁছানো যাচ্ছে না।')}}
          async function gemini(q,test){var key=K.gemini;var base='https://generativelanguage.googleapis.com/v1beta/';
           async function go(m){return netFetch(base+'models/'+m+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{role:'user',parts:[{text:q}]}],generationConfig:{responseMimeType:'application/json',temperature:0.6}})},'Gemini')}
           var model=K.gmodel||'gemini-flash-latest';var r=await go(model);
           if(r.status===404&&!test||r.status===404){var lr=await netFetch(base+'models?pageSize=100&key='+encodeURIComponent(key),{},'Gemini');var lj=await lr.json().catch(function(){return null});
            if(!lr.ok)throw httpErr('Gemini',lr,lj);
            var c=((lj&&lj.models)||[]).filter(function(m){return(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0&&/flash/.test(m.name)&&!/lite|image|tts|live|audio|thinking|exp|robotics|embedding/.test(m.name)}).map(function(m){return m.name.replace('models/','')}).sort(function(a,b){return a.length-b.length});
            if(!c.length)throw E('model','Gemini-তে ব্যবহারের মতো মডেল পাওয়া যায়নি');model=c[0];K.gmodel=model;lsSet('dd-keys',K);r=await go(model)}
           var j=await r.json().catch(function(){return null});if(!r.ok)throw httpErr('Gemini',r,j);
           var cand=j&&j.candidates&&j.candidates[0];if(!cand||!cand.content)throw E('block','Gemini এই লেখার উত্তর দেয়নি। অন্যভাবে লিখে দেখো।');
           return{text:cand.content.parts.map(function(p){return p.text||''}).join(''),model:model,provider:'Gemini'}}
          async function groq(q){var key=K.groq;var base='https://api.groq.com/openai/v1/';var hd={'content-type':'application/json','authorization':'Bearer '+key};
           async function go(m){return netFetch(base+'chat/completions',{method:'POST',headers:hd,body:JSON.stringify({model:m,messages:[{role:'system',content:SYS},{role:'user',content:q}],response_format:{type:'json_object'},temperature:0.6})},'Groq')}
           var model=K.qmodel||'llama-3.3-70b-versatile';var r=await go(model);
           if(r.status===404||r.status===400&&!K.qmodel){var j0=await r.clone().json().catch(function(){return null});var msg=String(j0&&j0.error&&j0.error.message||'');
            if(r.status===404||/model/i.test(msg)){var lr=await netFetch(base+'models',{headers:hd},'Groq');var lj=await lr.json().catch(function(){return null});if(!lr.ok)throw httpErr('Groq',lr,lj);
             var c=((lj&&lj.data)||[]).map(function(m){return m.id}).filter(function(id){return!/whisper|guard|tts|prompt|embed/.test(id)});
             var pick=c.filter(function(id){return/llama/.test(id)&&/70b|versatile/.test(id)})[0]||c[0];if(!pick)throw E('model','Groq-এ ব্যবহারের মতো মডেল পাওয়া যায়নি');model=pick;K.qmodel=model;lsSet('dd-keys',K);r=await go(model)}}
           var j=await r.json().catch(function(){return null});if(!r.ok)throw httpErr('Groq',r,j);
           return{text:j.choices[0].message.content,model:model,provider:'Groq'}}
          async function callAI(q){var order=K.pref==='groq'?['groq','gemini']:['gemini','groq'];var errs=[];
           for(var i=0;i<order.length;i++){var p=order[i];if(!K[p])continue;
            try{var o=p==='gemini'?await gemini(q):await groq(q);var r=parseJSON(o.text);if(!r||!Array.isArray(r.lenses)||!r.lenses.length)throw E('parse','উত্তরটা পড়া গেল না। আবার চাপো।');o.res=r;return o}
            catch(e){errs.push(e.message||'অজানা সমস্যা');if(e.code==='parse'&&i===0&&order.length===1)throw e}}
           if(!errs.length)throw E('nokey','আগে সেটিংসে অন্তত একটা চাবি বসাও।');throw new Error(errs.join(' | '))}
          function userText(){var t=S.q.trim();if(S.lens)t+='\n\n(বিশেষ অনুরোধ: ঘটনাটা মূলত "'+S.lens+'" ধারার আলোয় ব্যাখ্যা করো। এছাড়া আরও ১টা তুলনামূলক ধারা চাইলে দিতে পারো।)';return t}
          async function ask(){var q=S.q.trim();if(!q||S.busy)return;S.busy=true;S.err='';S.view=null;render();
           try{var o=await callAI(userText());var it={id:Date.now(),t:Date.now(),q:q,lens:S.lens,res:o.res,provider:o.provider,model:o.model};H.unshift(it);H=H.slice(0,40);lsSet('dd-hist',H);S.view=it}
           catch(e){S.err=e.message||'সমস্যা হয়েছে'}
           S.busy=false;render();window.scrollTo(0,0)}
          function resultHTML(it){var r=it.res;var h='<div class="card"><div class="lab" style="margin-top:0">সারকথা</div><p style="margin:0">'+esc(r.summary||'')+'</p></div>';
           r.lenses.forEach(function(l){h+='<div class="card lens"><h3>'+esc(l.name_bn||l.name_en)+'<span class="fit">'+esc(l.fit||'')+'</span></h3><div class="en">'+esc(l.name_en||'')+(l.thinkers?' · '+esc(l.thinkers):'')+'</div>'+
            '<div class="lab">কেন মেলে</div><p>'+esc(l.why)+'</p><div class="lab">এই ধারা অনুযায়ী ভাবনা</div><p>'+esc(l.guidance)+'</p><div class="counter"><b>আলাদা দৃষ্টিভঙ্গি:</b> '+esc(l.counter)+'</div></div>'});
           if(r.closing)h+='<div class="card"><div class="lab" style="margin-top:0">শেষ ভাবনা</div><p style="margin:0">'+esc(r.closing)+'</p></div>';
           return h+'<div class="note">এটা এআইয়ের দেওয়া একটা ব্যাখ্যা, চূড়ান্ত সত্য নয়। ('+esc(it.provider)+' · '+esc(it.model)+') তোমার নিজের বিচারই শেষ কথা।</div>'}
          function vAsk(){var hasKey=K.gemini||K.groq;var h='';
           if(S.view){h+='<button class="btn ghost sm" id="vb" style="margin-bottom:12px">← ফিরে যাও</button><div class="card" style="background:var(--soft)"><div class="sub">ঘটনা</div><div>'+esc(S.view.q)+'</div></div>'+resultHTML(S.view)+'<button class="btn ghost" id="del">এই ফলাফল মুছে ফেলো</button>';return h}
