           h+='<h2>কী ঘটেছে?</h2><div class="sub" style="margin-bottom:8px">একটা ঘটনা বা পরিস্থিতি লেখো। অ্যাপ বলবে এটা কোন দর্শনের সঙ্গে মেলে।</div>';
