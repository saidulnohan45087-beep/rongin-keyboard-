name: Build Gym APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-gym.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p gym-app
          mkdir -p gym-app/app
          cat > gym-app/app/build.gradle.kts <<'PATH_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ironfist.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ironfist.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          PATH_EOF
          mkdir -p gym-app/app/src/main
          cat > gym-app/app/src/main/AndroidManifest.xml <<'PATH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".AlarmReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          PATH_EOF
          mkdir -p gym-app/app/src/main/assets
          cat > gym-app/app/src/main/assets/index.html <<'PATH_EOF'
          <!doctype html>
          <html lang="bn">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>লৌহমুষ্টি</title>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Bengali:wght@400;600;800;900&display=swap">
          <style>
          :root{--bg:#0d0d0f;--card:#17171b;--card2:#212127;--fg:#f4f1ec;--muted:#a09c94;--line:#2c2c34;--hot:#ff4d2e;--hot2:#ffb21f;--ice:#7fd8ff;--good:#38d27a;--on-hot:#1a0703;color-scheme:dark}
          @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f0e9;--card:#ffffff;--card2:#ece6db;--fg:#1b1917;--muted:#6c665c;--line:#ddd5c6;--hot:#e83a1c;--hot2:#b06a00;--ice:#0a86c4;--good:#16844a;--on-hot:#ffffff;color-scheme:light}}
          :root[data-theme="light"]{--bg:#f4f0e9;--card:#ffffff;--card2:#ece6db;--fg:#1b1917;--muted:#6c665c;--line:#ddd5c6;--hot:#e83a1c;--hot2:#b06a00;--ice:#0a86c4;--good:#16844a;--on-hot:#ffffff;color-scheme:light}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Bengali",system-ui,sans-serif;font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
          button{font:inherit;color:inherit;cursor:pointer}
          #app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
          .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;background:var(--bg)}
          body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
          .brand{display:flex;align-items:center;gap:10px}
          .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--hot),var(--hot2));display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(255,77,46,.35)}
          .brand b{display:block;font-size:19px;font-weight:900;line-height:1.1}
          .brand small{font-family:"Anton",sans-serif;letter-spacing:.2em;color:var(--hot);font-size:11px}
          .tr{display:flex;gap:8px;align-items:center}
          .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
          .icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px}
          .view{display:flex;flex-direction:column;gap:14px}
          .view[hidden]{display:none}
          .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
          .hero{position:relative;overflow:hidden;border:0;background:linear-gradient(160deg,#2a1410 0%,#1b1013 45%,#17171b 100%);color:#f6efe8}
          .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,77,46,.45),transparent 70%);pointer-events:none}
          :root[data-theme="light"] .hero,:root:not([data-theme="dark"]) .hero{--hx:0}
          .hdate{font-size:13px;opacity:.75;font-weight:600}
          .hero h2{margin:2px 0 6px;font-size:26px;line-height:1.2;font-weight:900;text-wrap:balance}
          .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
          .big{font-size:38px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
          .big small{font-size:16px;font-weight:700;opacity:.8;margin-right:6px}
          .tset{font-size:12.5px;opacity:.9;display:flex;flex-direction:column;gap:3px}
          .tset input{font:inherit;font-weight:700;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 8px;color-scheme:dark}
          .pill{display:inline-block;margin:12px 0 4px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13.5px;position:relative;z-index:1}
          .pill.wait{background:rgba(255,255,255,.12);color:#fff}
          .pill.ok{background:rgba(56,210,122,.2);color:#7ff0ad}
          .pill.late{background:var(--hot);color:#fff;animation:pulse 1.2s infinite}
          @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,77,46,.25)}}
          .exlist{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
          .exlist li{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;font-size:14.5px}
          .exlist li span{opacity:.75;white-space:nowrap}
          .cta{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:17px;background:linear-gradient(135deg,var(--hot),var(--hot2));color:var(--on-hot);box-shadow:0 8px 22px rgba(255,77,46,.35);position:relative;z-index:1}
          .cta:disabled{opacity:.45;box-shadow:none}
          .h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
          .h3 span{font-weight:600;color:var(--muted);font-size:13px}
          .meter{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 8px}
          .meter i{height:16px;border-radius:5px;background:linear-gradient(180deg,var(--ice),color-mix(in srgb,var(--ice) 55%,transparent));transform:skewX(-12deg)}
          .meter i.x{background:var(--card2);border:1px solid var(--line);opacity:.8}
          .muted{color:var(--muted);font-size:13.5px;margin:0}
          .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
          .tile b{display:block;font-family:"Anton","Noto Sans Bengali",sans-serif;font-size:34px;line-height:1.1;font-weight:400}
          .tile span{color:var(--muted);font-size:13px}
          .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
          .week div{text-align:center;border-radius:12px;padding:8px 0;font-size:12.5px;font-weight:700;background:var(--card2);color:var(--muted)}
          .week div.t{background:var(--hot);color:#fff}
          .week div.r{opacity:.55}
          .week div.d{background:var(--good);color:#06210f}
          .demo{border:1.5px dashed var(--line);background:transparent}
          .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
          .btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;min-height:42px;flex:1 1 auto}
          .btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
          .btn[aria-pressed="true"]{background:var(--ice);color:#04141c;border-color:var(--ice)}
          .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
          .chips::-webkit-scrollbar{display:none}
          .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
          .chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
          details.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
          details.ex summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
          details.ex summary::-webkit-details-marker{display:none}
          .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
          .ex .nm{flex:1;min-width:0}
          .ex .nm b{display:block;font-weight:800;font-size:15.5px}
          .ex .nm small{color:var(--muted);font-size:12.5px}
          .tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
          .exb{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
          .exb h4{margin:6px 0 0;font-size:13px;color:var(--hot);letter-spacing:.02em}
          .exb ol,.exb ul{margin:0;padding-left:20px;font-size:14px}
          .exb li{margin:2px 0}
          .note{background:var(--card2);border-left:3px solid var(--hot2);padding:8px 10px;border-radius:8px;font-size:13.5px}
          .day{display:flex;gap:12px;align-items:flex-start}
          .day .dn{flex:0 0 66px;font-weight:900}
          .day .dn small{display:block;color:var(--muted);font-weight:600;font-size:12px}
          .day.today{border-color:var(--hot)}
          .day p{margin:0;font-size:14px}
          nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
          nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
          nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-weight:700;font-size:12.5px}
          nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          nav button[aria-current="page"]{color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,transparent)}
          .anim{background:var(--card2);border-radius:14px;padding:6px 6px 8px}
          .anim svg{width:100%;display:block;max-height:220px}
          .phl{text-align:center;font-weight:800;font-size:14px;color:var(--hot);min-height:22px}
          .bd{fill:none;stroke:var(--fg);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
          .fr{opacity:.38}
          .fl{stroke:var(--line);stroke-width:2}
          .hd{fill:var(--card2);stroke:var(--fg);stroke-width:4}
          .mu{stroke:var(--muted);fill:none;stroke-width:3;stroke-linecap:round}
          .mur{fill:none;stroke:var(--muted);stroke-width:3}
          .cb{stroke:var(--muted);stroke-width:1.5}
          .eqf{fill:color-mix(in srgb,var(--hot2) 30%,transparent);stroke:var(--hot2);stroke-width:3}
          .eqb{stroke:var(--hot2);stroke-width:5;stroke-linecap:round}
          /* overlays */
          #cr{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
          #fx{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
          .flash{position:absolute;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);animation:fl .3s ease-out forwards}
          @keyframes fl{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.2)}}
          .fist{position:absolute;font-size:120px;line-height:1;margin:-60px 0 0 -60px;animation:fs .42s cubic-bezier(.2,.8,.3,1) forwards;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
          @keyframes fs{0%{transform:scale(4.2) rotate(-25deg);opacity:0}45%{opacity:1}70%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(.9) rotate(-6deg);opacity:0}}
          .shake{animation:sk .32s linear}
          @keyframes sk{0%,100%{transform:none}15%{transform:translate(-7px,4px) rotate(-.4deg)}35%{transform:translate(6px,-5px) rotate(.4deg)}55%{transform:translate(-5px,3px)}75%{transform:translate(4px,-2px)}}
          @media (prefers-reduced-motion:reduce){.shake{animation:none}.pill.late{animation:none}}
          #wo{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
          #wo[hidden]{display:none}
          .wi{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 40px)}
          .wtop{display:flex;align-items:center;gap:12px}
          .bar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
          .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--hot2));border-radius:99px}
          .wname{font-size:30px;font-weight:900;line-height:1.2;margin:0;text-wrap:balance}
          .weng{font-family:"Anton",sans-serif;letter-spacing:.08em;color:var(--hot);font-size:14px}
          .setbox{display:flex;gap:12px}
          .setbox>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
          .setbox b{display:block;font-family:"Anton","Noto Sans Bengali",sans-serif;font-size:42px;font-weight:400;line-height:1.1}
          .setbox span{color:var(--muted);font-size:13px}
          .ring{position:relative;width:200px;height:200px;margin:10px auto}
          .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
          .ring circle{fill:none;stroke-width:10}
          .ring .bg{stroke:var(--card2)}
          .ring .fg{stroke:var(--ice);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
          .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:900}
          .sp{flex:1}
          .row2{display:flex;gap:8px}
          #lost{position:fixed;inset:0;z-index:70;background:rgba(5,5,8,.88);display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f4f1ec}
          #lost.on{display:flex;animation:fi .6s}
          @keyframes fi{from{opacity:0}to{opacity:1}}
          #lost .bx{max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:center}
          #lost h2{margin:0;font-size:42px;font-weight:900;color:var(--hot)}
          #lost p{margin:0;opacity:.85}
          </style>
          </head>
          <body>
          <div id="app">
            <header class="top">
              <div class="brand"><div class="logo">👊</div><div><b>লৌহমুষ্টি</b><small>IRON FIST</small></div></div>
              <div class="tr"><span class="chip" id="hstreak">🔥 ০</span><button class="icon" id="snd" aria-label="শব্দ">🔊</button></div>
            </header>
            <main>
              <section class="view" id="v-today"></section>
              <section class="view" id="v-lib" hidden></section>
              <section class="view" id="v-plan" hidden></section>
            </main>
          </div>
          <nav><div class="in" id="nav">
            <button data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>আজ</button>
            <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>ব্যায়াম</button>
            <button data-v="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>রুটিন</button>
          </div></nav>
          <div id="wo" hidden></div>
          <canvas id="cr"></canvas>
          <div id="fx"></div>
          <div id="lost"><div class="bx"><div style="font-size:64px">💥</div><h2>হেরে গেছ</h2><p>কাচ ভেঙে গেছে। আজ থেকে আবার শুরু, এবার সময় মানো।</p><button class="cta" id="again" style="max-width:280px">নতুন করে শুরু</button></div></div>

          <script>
