                for(j=0;j<4;j++){ba+=(r()-.5)*.4;bx+=Math.cos(ba)*bl/4;by+=Math.sin(ba)*bl/4;bp2.push([bx,by])}paths.push(bp2)}
            }
            for(i=0;i<nr;i++)for(j=2;j<=6;j+=2){if(r()<.33){var A=rays[i][j],B=rays[(i+1)%nr][j];if(A&&B)paths.push([A,B])}}
