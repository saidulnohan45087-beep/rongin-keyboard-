          function bump(ok){if(ok){V.sc++;$('#vsc').textContent=bn(V.sc)}else{V.miss++;$('#vms').textContent=bn(V.miss)}}
          function vTap(sq){
           if(!V.run||V.lock)return;V.lock=true;var ok=sq===V.cur;bump(ok);
           sqEl(sq).classList.add(ok?'ok':'no');if(!ok)sqEl(V.cur).classList.add('ok');
           setTimeout(function(){if(V.run)vNext()},ok?220:650)}
          function vName(b){
           if(!V.run||V.lock)return;V.lock=true;var ok=b.dataset.n===sn(V.cur);bump(ok);b.classList.add(ok?'ok':'no');
