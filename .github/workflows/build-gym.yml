          mkdir -p gym-app/app/src/main/java/com/ironfist/app
          cat > gym-app/app/src/main/java/com/ironfist/app/Sched.kt <<'PATH_EOF'
          package com.ironfist.app

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar
          import java.util.TimeZone

          /** রোজকার জিমের সময় আর দেরির ঘুষির নোটিফিকেশন ঠিক করে। */
          object Sched {
              const val CAP = 4
              const val STEP_MIN = 10

              private fun sp(c: Context) = c.getSharedPreferences("gym", Context.MODE_PRIVATE)

              fun save(c: Context, h: Int, m: Int, mask: Int) {
                  sp(c).edit()
                      .putInt("h", h)
                      .putInt("m", m)
                      .putInt("mask", mask)
                      .putBoolean("on", true)
                      .apply()
              }

              fun markDone(c: Context, day: Long) {
                  sp(c).edit().putLong("done", day).apply()
              }

              fun doneDay(c: Context): Long = sp(c).getLong("done", -1L)

              fun dayNum(ms: Long): Long = (ms + TimeZone.getDefault().getOffset(ms)) / 86400000L

              /** এখনকার পরের সবচেয়ে কাছের নোটিফিকেশনের সময় বের করে অ্যালার্ম বসায়। */
              fun scheduleNext(c: Context) {
                  val p = sp(c)
                  if (!p.getBoolean("on", false)) return
                  val h = p.getInt("h", 17)
                  val m = p.getInt("m", 0)
                  val mask = p.getInt("mask", 0)
                  val done = p.getLong("done", -1L)
                  val now = System.currentTimeMillis()

                  for (off in 0..8) {
                      val cal = Calendar.getInstance()
                      cal.timeInMillis = now
                      cal.add(Calendar.DAY_OF_YEAR, off)
                      cal.set(Calendar.HOUR_OF_DAY, h)
                      cal.set(Calendar.MINUTE, m)
                      cal.set(Calendar.SECOND, 0)
                      cal.set(Calendar.MILLISECOND, 0)
                      val base = cal.timeInMillis
                      val dow = cal.get(Calendar.DAY_OF_WEEK) - 1
                      if (((mask shr dow) and 1) == 1) continue
                      if (dayNum(base) == done) continue
                      for (n in 0..CAP) {
                          val t = base + n * STEP_MIN * 60000L
                          if (t > now + 1000L) {
                              setAlarm(c, t, n)
                              return
                          }
                      }
                  }
              }

              private fun setAlarm(c: Context, t: Long, n: Int) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val i = Intent(c, AlarmReceiver::class.java)
                  i.putExtra("n", n)
                  val pi = PendingIntent.getBroadcast(
                      c, 0, i,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi)
              }
          }
