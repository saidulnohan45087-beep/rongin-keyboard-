            h+='<div class="'+cls+'" data-sq="'+sq+'">';
            if(p)h+='<img class="pc" draggable="false" alt="" src="'+PIMG[(p>0?'w':'b')+PC[Math.abs(p)]]+'">';
            if(o.coords){if(f===7)h+='<span class="co r">'+(rank+1)+'</span>';if(r===7)h+='<span class="co f">'+'abcdefgh'[file]+'</span>'}
            h+='</div>'}
           return h+'</div>'}
          function sqEl(s){return document.querySelector('[data-sq="'+s+'"]')}
