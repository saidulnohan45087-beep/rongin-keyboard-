          bench:{ed:-1,kd:1,hd:0,A:mk([183,117,90,183,55,85,166]),B:mk([183,117,90,181,100,85,166]),ph:['নামাও','ঠেলে তোলো'],eq:BEN.concat([['plate',13]])},
          incline:{ed:1,kd:-1,hd:0,A:mk([136.6,95.3,-50,152,40,232,167]),B:mk([136.6,95.3,-50,150,78,232,167]),ph:['নামাও','ঠেলে তোলো'],eq:[['line',176,135,122,94,9],['rect',160,140,40,7],['line',165,147,158,172,4],['line',195,147,205,172,4],['plate',8]]},
          dips:{ed:1,kd:-1,hd:-10,A:mk([160,34,12,160,92,128,126]),B:mk([160,56,25,160,92,112,142]),ph:['নামো','ঠেলে ওঠো'],eq:[['line',160,92,160,172,4],['circ',160,92,5],['line',136,92,190,92,4]]},
