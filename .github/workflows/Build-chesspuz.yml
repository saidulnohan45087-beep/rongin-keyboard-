          function tap(sq){
           if(P.busy||P.done)return;var pos=P.pos,pc=pos.b[sq];
           if(P.sel>=0){var ms=pos.legal().filter(function(m){return(m&63)===P.sel&&((m>>6)&63)===sq});
            if(ms.length){var m=ms[0];ms.forEach(function(x){if(((x>>12)&7)===5)m=x});tryMove(m);return}}
           clr('sel');clr('dst');clr('hint');
           if(pc&&pc*P.side>0){P.sel=sq;sqEl(sq).classList.add('sel');pos.legal().forEach(function(m){if((m&63)===sq)sqEl((m>>6)&63).classList.add('dst')})}else P.sel=-1;
          }
          function tryMove(m){
           var pos=P.pos,u=Core.uci(m),exp=P.p.sol[P.idx];P.sel=-1;
           pos.make(m);var mate=pos.legal().length===0&&pos.inCheck(pos.turn);
