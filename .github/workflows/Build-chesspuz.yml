          mkdir -p chesspuz-app/app/src/main/java/com/chesspuz/app
          cat > chesspuz-app/app/src/main/java/com/chesspuz/app/MainActivity.kt <<'PATH_EOF'
          package com.chesspuz.app

          import android.app.Activity
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewAssetLoader

          /** দাবা পাজল: ওয়েব-ভিত্তিক অ্যাপকে https://appassets... ঠিকানায় চালায়, যাতে Stockfish ওয়ার্কার ও Chess.com সংযোগ কাজ করে। */
          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var chooser: ValueCallback<Array<Uri>>? = null

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val night = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  val bg = if (night) Color.parseColor("#141916") else Color.parseColor("#F3F1EC")
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  if (!night) {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or 0x10
                  }

                  web = WebView(this)
                  web.setBackgroundColor(bg)
                  setContentView(web)

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  s.setSupportZoom(false)

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          return loader.shouldInterceptRequest(request.url)
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          w: WebView,
                          cb: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          chooser?.onReceiveValue(null)
                          chooser = cb
                          val i = try {
                              params.createIntent()
                          } catch (e: Exception) {
                              Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = "image/*"
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }
                          }
                          return try {
                              startActivityForResult(i, 77)
                              true
                          } catch (e: Exception) {
                              chooser = null
                              false
                          }
                      }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 77) {
                      chooser?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      chooser = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  web.evaluateJavascript("(window.appBack ? appBack() : false)") { r ->
                      if (r != "true") finish()
                  }
              }

              override fun onResume() { super.onResume(); web.onResume() }
              override fun onPause() { web.onPause(); super.onPause() }
          }
