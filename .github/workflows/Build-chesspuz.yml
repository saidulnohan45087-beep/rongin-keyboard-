           var g=GAMES[S.gi],p=g.pz[S.q[S.qi]];
           P={p:p,pos:new Core.Pos().setFen(p.fen),idx:0,sel:-1,fail:false,busy:false,last:null,done:false};
           P.side=P.pos.turn;
           var h='<button class="back" id="bk">← থিম তালিকা</button><div class="status"><b>পাজল '+bn(S.qi+1)+'/'+bn(S.q.length)+'</b><span class="chips">'+p.th.map(function(t){return'<span class="chip">'+esc(t)+'</span>'}).join('')+'<span class="chip '+(p.found?'got':'miss')+'">'+(p.found?'খেলায় পেয়েছিলে':'খেলায় মিস')+'</span></span></div>';
           h+=boardHTML(P.pos,{flip:P.side===-1})+'<div class="msg" id="msg"></div><div class="row"><button class="btn ghost" id="hint">ইঙ্গিত</button><button class="btn ghost" id="sol">সমাধান দেখাও</button><button class="btn" id="nx" disabled>পরেরটা</button></div>';
           $('#main').innerHTML=h;msg((P.side===1?'সাদার':'কালোর')+' চাল। সেরা চালটা খুঁজে বের করো।');
           $('#bk').onclick=function(){S.view='themes';render()};
