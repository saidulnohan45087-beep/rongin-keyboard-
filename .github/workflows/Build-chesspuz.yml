           h+='<h2 style="margin-top:14px;font-size:22px">'+esc(a.title)+'</h2><div class="sub">'+esc(a.date)+'</div><div class="body">'+a.body.split(/\n+/).filter(Boolean).map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+'</div><div class="row"><button class="btn ghost" id="ed">সম্পাদনা</button><button class="btn del" id="dl">মুছে ফেলো</button></div>';
           $('#main').innerHTML=h;$('#bk').onclick=function(){S.view='alist';render()};
           var pz=$('#pz');if(pz)pz.onclick=function(){var z=document.createElement('div');z.className='zoom';z.innerHTML='<img src="'+a.poster+'" alt="">';z.onclick=function(){z.remove()};document.body.appendChild(z)};
           $('#ed').onclick=function(){E={i:S.ai,poster:a.poster,title:a.title,body:a.body};S.view='aedit';render()};
           var d=$('#dl'),arm=false;d.onclick=function(){if(!arm){arm=true;d.textContent='আবার চাপলে মুছে যাবে';return}ART.splice(S.ai,1);artSave();S.view='alist';render()}}
          function aEdit(){var h='<button class="back" id="bk">← বাতিল</button><h2>'+(E.i<0?'নতুন লেখা':'লেখা সম্পাদনা')+'</h2>';
           h+='<label class="field">শিরোনাম<input type="text" id="at" value="'+esc(E.title)+'"></label><label class="field">পোস্টার (ছবি)<input type="file" id="af" accept="image/*"></label><div id="ap">'+(E.poster?'<img class="poster" src="'+E.poster+'" alt="">':'')+'</div><label class="field" style="margin-top:12px">লেখা<textarea id="ab">'+esc(E.body)+'</textarea></label><div class="msg" id="am" hidden></div><button class="btn" id="as" style="width:100%">সেভ করো</button>';
           $('#main').innerHTML=h;
           $('#bk').onclick=function(){S.view=E.i<0?'alist':'aview';render()};
           $('#af').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);E.poster=c.toDataURL('image/jpeg',.82);$('#ap').innerHTML='<img class="poster" src="'+E.poster+'" alt="">'};im.src=r.result};r.readAsDataURL(f)};
           $('#as').onclick=function(){E.title=$('#at').value.trim();E.body=$('#ab').value;var m=$('#am');
            if(!E.title){m.hidden=false;m.className='msg bad';m.textContent='শিরোনাম লিখতে হবে।';return}
            var item={id:E.i<0?String(Date.now()):ART[E.i].id,title:E.title,date:E.i<0?new Date().toLocaleDateString('bn-BD'):ART[E.i].date,poster:E.poster,body:E.body};
            var prev=ART.slice();if(E.i<0)ART.unshift(item);else ART[E.i]=item;
            if(!artSave()){ART=prev;m.hidden=false;m.className='msg bad';m.textContent='সেভ হয়নি। এই ডেমোতে ব্রাউজারের জায়গা কম, ছোট ছবি দিয়ে চেষ্টা করো।';return}
