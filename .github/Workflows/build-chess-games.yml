      - name: Build app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-games-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk chess-games.apk
          TAG="chess-games-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" chess-games.apk --repo "${{ github.repository }}" --title "Chess Games $TAG" --notes "Install chess-games.apk on your phone."
