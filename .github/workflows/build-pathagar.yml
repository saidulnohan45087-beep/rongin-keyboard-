      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: pathagar-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp pathagar-app/app/build/outputs/apk/debug/app-debug.apk pathagar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pathagar-apk
          path: pathagar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pathagar-v${{ github.run_number }}
          name: আমার পাঠাগার v${{ github.run_number }}
          files: pathagar.apk
