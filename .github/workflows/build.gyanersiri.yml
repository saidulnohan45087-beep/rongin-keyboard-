            var h='<button class="back" data-act="home">← ঘরে ফিরি</button><h2>পৃষ্ঠা যোগ করো</h2><p class="lead">যে পৃষ্ঠা পড়ার সময় পাওনি, তার ছবি বা পিডিএফ দাও। প্রশ্ন শুধু ওই পৃষ্ঠার তথ্য থেকে বানানো হবে।</p>';
            if(STANDALONE){
              h+='<div class="field"><label for="adKey">Claude API চাবি'+(A.sample?' (সেভ করা আছে)':'')+'</label><div class="row"><input id="adKey" type="password" autocomplete="off" placeholder="sk-ant-..." style="flex:1;min-width:0"><button class="btn" data-act="savekey">সেভ</button></div><p class="small" style="margin-top:6px">চাবিটা শুধু এই ফোনে থাকে। console.anthropic.com থেকে বানানো যায়, আর সেখানে ক্রেডিট লাগে।</p></div>';
              if(!A.sample)h+='<div class="warn">প্রশ্ন বানাতে আগে উপরে API চাবি সেভ করো।</div>';
            }else if(!A.sample)h+='<div class="warn">এই ভিউতে Claude সংযোগ পাওয়া যাচ্ছে না। লিংকটা Claude অ্যাপ বা claude.ai-তে সাইন-ইন করা অবস্থায় খোলো।</div>';
            h+='<div class="seg">';
            [['img','ছবি'],['pdf','পিডিএফ'],['text','লেখা']].forEach(function(t){h+='<button data-act="tab" data-t="'+t[0]+'" class="'+(AD.tab===t[0]?'on':'')+'">'+t[1]+'</button>';});
            h+='</div>';
            var ready=false;
            if(AD.tab==='img'){
              h+='<label class="drop" for="fImg"><b>পৃষ্ঠার ছবি তোলো বা বাছো</b><span>একসাথে অনেকগুলো দেওয়া যায় (সর্বোচ্চ ২০টি)</span></label><input class="vh" id="fImg" type="file" accept="image/*" multiple>';
              if(AD.imgs.length){h+='<div class="thumbs">';AD.imgs.forEach(function(it,i){h+='<figure><img alt="" src="'+it.url+'"><button data-act="rmimg" data-i="'+i+'" aria-label="সরাও">×</button></figure>';});h+='</div>';}
              ready=AD.imgs.length>0;
            }else if(AD.tab==='pdf'){
              h+='<label class="drop" for="fPdf"><b>'+(AD.pdfName?esc(AD.pdfName):'পিডিএফ বাছো')+'</b><span>'+(AD.pages?bn(AD.pages)+' পৃষ্ঠা':'পুরো পিডিএফ-ও দিতে পারো, পৃষ্ঠা বেছে নেওয়া যাবে')+'</span></label><input class="vh" id="fPdf" type="file" accept="application/pdf">';
              if(AD.pages){h+='<div class="two field"><div><label for="adFrom">কোন পৃষ্ঠা থেকে</label><input id="adFrom" type="number" min="1" max="'+AD.pages+'" value="'+AD.from+'"></div><div><label for="adTo">কোন পৃষ্ঠা পর্যন্ত</label><input id="adTo" type="number" min="1" max="'+AD.pages+'" value="'+AD.to+'"></div></div><p class="small" style="margin-top:6px">একবারে সর্বোচ্চ ৩০ পৃষ্ঠা। বেশি হলে কয়েক ভাগে যোগ করো।</p>';}
              ready=!!AD.pages;
            }else{
              h+='<div class="field"><label for="adText">লেখা পেস্ট করো</label><textarea id="adText" placeholder="অনলাইনের লেখা, নোট বা যেকোনো পাঠ্য এখানে দাও">'+esc(AD.text)+'</textarea></div>';
              ready=AD.text.trim().length>80;
            }
            h+='<div class="field"><label for="adTitle">নাম (না দিলে নিজে বসবে)</label><input id="adTitle" type="text" value="'+esc(AD.title)+'" placeholder="যেমন: ১৫ নভেম্বরের কারেন্ট অ্যাফেয়ার্স"></div>';
            h+='<div style="margin-top:18px">'+hexbtn('gen','প্রশ্ন বানাও','',!ready||!A.sample)+'</div><p class="small center" style="margin-top:10px">প্রশ্ন বানাতে তোমার Claude ব্যবহারের কিছুটা সীমা খরচ হয়।</p>';
            return h;
          }
          function viewGen(){
            var h='<h2>'+(AD.stage==='run'?'প্রশ্ন বানানো হচ্ছে':'কাজ শেষ')+'</h2><div class="pbar"><i id="gpBar" style="width:'+AD.pct+'%"></i></div><p id="gpMsg">'+esc(AD.msg)+'</p>'
             +'<p>এ পর্যন্ত <b id="gpCnt">'+bn(AD.cnt)+'</b>টি প্রশ্ন পেয়েছি।</p><div class="glog" id="gpLog">'+AD.log.map(function(l){return '<p>'+esc(l)+'</p>';}).join('')+'</div>';
            if(AD.stage==='run')h+='<button class="btn red" data-act="genstop">থামাও</button>';
            else{
              h+='<div class="menu">';
              if(AD.newId&&AD.cnt>=5)h+=hexbtn('playnew','এখনই খেলো','এই পৃষ্ঠার প্রশ্ন থেকে');
              h+=hexbtn('add2','আরেকটা যোগ করো','')+hexbtn('home','ঘরে ফিরি','')+'</div>';
            }
            return h;
          }
          function updGen(){
            var b=$('#gpBar'),m=$('#gpMsg'),c=$('#gpCnt'),l=$('#gpLog');
            if(b)b.style.width=AD.pct+'%';if(m)m.textContent=AD.msg;if(c)c.textContent=bn(AD.cnt);
            if(l){l.innerHTML=AD.log.map(function(x){return '<p>'+esc(x)+'</p>';}).join('');l.scrollTop=l.scrollHeight;}
          }
          function glog(t){AD.log.push(t);updGen();}

          /* ---------- generation ---------- */
          function loadPdfJs(){
            return new Promise(function(res,rej){
              if(window.pdfjsLib){res();return;}
              var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
              s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res();}catch(e){rej(e);}};
              s.onerror=function(){rej(new Error('load'));};document.head.appendChild(s);
            });
          }
          function canvasBlob(c){return new Promise(function(res){c.toBlob(function(b){res(b);},'image/jpeg',0.85);});}
          async function prepImage(file){
            try{
              var bm=await createImageBitmap(file,{imageOrientation:'from-image'}),s=Math.min(1,1800/Math.max(bm.width,bm.height));
              var c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
              c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
              var b=await canvasBlob(c);return b||file;
            }catch(e){return file;}
          }
          async function renderPdfPage(n){
            var page=await AD.pdf.getPage(n),v0=page.getViewport({scale:1}),sc=1700/Math.max(v0.width,v0.height),vp=page.getViewport({scale:sc});
            var c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
            await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
            return canvasBlob(c);
          }
          function norm(s){return String(s).replace(/\s+/g,'').toLowerCase();}
          function cleanQ(o){
            if(!o||typeof o.q!=='string'||!Array.isArray(o.o)||o.o.length!==4)return null;
            var opts=o.o.map(function(x){return String(x).trim();}),a=Number(o.a);
            if(opts.some(function(x){return !x;})||a!==Math.floor(a)||a<0||a>3)return null;
            var u={};opts.forEach(function(x){u[norm(x)]=1;});if(Object.keys(u).length<4)return null;
            var q=o.q.trim();if(q.length<8)return null;
            return {id:Math.random().toString(36).slice(2,9),q:q,o:opts,a:a,d:Math.min(5,Math.max(1,Math.round(Number(o.d))||3)),e:String(o.e||'').slice(0,400),t:String(o.t||'').slice(0,24),n:0,w:0};
          }
          function genPrompt(kind,count,text){
            return 'You are the question writer for a Bangla quiz game in the style of "Who Wants to Be a Millionaire".\n'
             +(kind==='text'?'Below is source text (Bangla and/or English).':'The attached images are pages (newspaper, magazine, current-affairs book, notes) in Bangla and/or English. Read them carefully.')
             +'\nWrite up to '+count+' multiple-choice questions based ONLY on facts clearly present in the source: names, dates, places, numbers, decisions, appointments, awards, records. Never use outside knowledge for the question or the correct answer. If the source is unreadable or has no factual content, write fewer questions or none.\n'
             +'Rules:\n- Write questions, options and notes in Bangla. If the source is English, translate and keep proper names in Bangla with the English name in brackets when helpful. Keep numbers and dates exact.\n'
             +'- Exactly 4 options, one correct. Wrong options must be plausible and of the same kind as the right answer.\n'
             +'- Each question must stand alone (never say "according to the passage" or "in the picture").\n'
             +'- "d" is difficulty from 1 (very easy) to 5 (hard); mix them. Vary the position of the correct option.\n'
             +'- "e" is one short Bangla sentence stating the fact from the source, used as a revision note.\n'
             +'- "t" is a one or two word Bangla category such as জাতীয়, আন্তর্জাতিক, অর্থনীতি, খেলা, বিজ্ঞান, নিয়োগ, পুরস্কার.\n'
             +'Reply with ONLY a JSON array like [{"q":"...","o":["...","...","...","..."],"a":0,"d":2,"e":"...","t":"..."}] where "a" is the index (0-3) of the correct option. Reply [] if nothing usable.'
             +(kind==='text'?'\n\nSOURCE TEXT:\n'+text:'');
          }
          function splitText(t){
            var parts=t.split(/\n\s*\n/),out=[],cur='';
            parts.forEach(function(p){if((cur+p).length>5000&&cur){out.push(cur);cur='';}cur+=(cur?'\n\n':'')+p;});
            if(cur)out.push(cur);
            return out.slice(0,8);
          }
          function dateLabel(){var d=new Date();return bn(d.getDate())+'/'+bn(d.getMonth()+1);}
          async function runGen(){
            var sample=A.sample;if(!sample)return;
            AD.stage='run';AD.log=[];AD.cnt=0;AD.pct=0;AD.msg='শুরু হচ্ছে…';AD.stop=false;AD.newId=null;render();
            var chunks=[],kind=AD.tab,per=Math.max(1,Math.min(2,(A.limits&&A.limits.images&&A.limits.images.maxCount)||2));
            try{
              if(kind==='img'){
                var us=AD.imgs.slice(0,20).map(function(it){return function(){return prepImage(it.file);};});
                for(var i=0;i<us.length;i+=per)chunks.push(us.slice(i,i+per));
              }else if(kind==='pdf'){
                var from=Math.max(1,AD.from|0),to=Math.min(AD.pages,Math.max(from,AD.to|0));
                if(to-from>29)to=from+29;
                var ps=[];for(var p=from;p<=to;p++)(function(p){ps.push(function(){return renderPdfPage(p);});})(p);
                for(var j=0;j<ps.length;j+=per)chunks.push(ps.slice(j,j+per));
              }else chunks=splitText(AD.text.trim());
            }catch(e){glog('পৃষ্ঠা তৈরি করতে পারিনি।');}
            var found=[],seen={};
            A.sources.forEach(function(s){s.qs.forEach(function(q){seen[norm(q.q)]=1;});});
            var stopMsg='';
            for(var c=0;c<chunks.length;c++){
              if(AD.stop)break;
              AD.msg=(kind==='text'?'অংশ ':'পৃষ্ঠা ')+bn(c+1)+'/'+bn(chunks.length)+' পড়ছি…';AD.pct=Math.round(c*100/chunks.length);updGen();
              var blobs=null,prompt;
              try{
                if(kind==='text')prompt=genPrompt('text',8,chunks[c]);
                else{
                  blobs=[];for(var k=0;k<chunks[c].length;k++)blobs.push(await chunks[c][k]());
                  prompt=genPrompt('img',Math.min(10,Math.max(4,blobs.length*4)));
                }
                AD.ctl=new AbortController();
                var out=await sample.json(prompt,kind==='text'?{signal:AD.ctl.signal}:{signal:AD.ctl.signal,images:blobs});
                var arr=Array.isArray(out)?out:(out&&Array.isArray(out.questions)?out.questions:[]),add=0;
                arr.forEach(function(o){var q=cleanQ(o);if(q&&!seen[norm(q.q)]){seen[norm(q.q)]=1;found.push(q);add++;}});
                AD.cnt=found.length;glog((kind==='text'?'অংশ ':'ধাপ ')+bn(c+1)+': '+bn(add)+'টি প্রশ্ন।');
              }catch(e){
                var code=e&&e.code;
                if(code==='cancelled'){break;}
                if(code==='invalid_json'||code==='empty_completion'||code==='refused'){glog('ধাপ '+bn(c+1)+': এখান থেকে প্রশ্ন পাইনি।');continue;}
                if(code==='no_credit')stopMsg='API-তে ক্রেডিট নেই। console.anthropic.com-এ ক্রেডিট যোগ করে আবার চেষ্টা করো।';
                else if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared')stopMsg=STANDALONE?'API চাবিটা ঠিক নেই বা কাজ করছে না। চাবি আবার দাও।':'Claude ব্যবহারের অনুমতি পাওয়া যায়নি।';
                else if(code==='rate_limited')stopMsg='এখন আর প্রশ্ন বানানো যাচ্ছে না (ব্যবহারের সীমা)। কিছুক্ষণ পরে আবার চেষ্টা করো।';
                else if(code==='image_rejected'||code==='images_unavailable')stopMsg='ছবিটা পড়া যায়নি। অন্য ছবি বা স্পষ্ট ছবি দিয়ে দেখো।';
                else stopMsg='মাঝপথে সংযোগ কেটে গেছে। আবার চেষ্টা করো।';
                break;
              }
            }
            if(found.length){
              var title=AD.title.trim()||(kind==='img'?'ছবি':kind==='pdf'?'পিডিএফ':'লেখা')+' — '+dateLabel();
              var src={id:Date.now().toString(36),title:title,kind:kind,created:Date.now(),qs:found.slice(0,120)};
              A.sources.unshift(src);saveSource(src);AD.newId=src.id;
              AD.msg=stopMsg||'শেষ। '+bn(src.qs.length)+'টি প্রশ্ন ভাণ্ডারে যোগ হয়েছে।';
            }else AD.msg=stopMsg||'প্রশ্ন বানানো গেল না। ছবি আরও স্পষ্ট করে তুলে বা লেখা বেশি দিয়ে আবার চেষ্টা করো।';
            AD.pct=100;AD.stage='done';AD.title='';
            if(AD.newId){AD.imgs.forEach(function(it){URL.revokeObjectURL(it.url);});AD.imgs=[];AD.text='';AD.pdf=null;AD.pdfName='';AD.pages=0;}
            if(A.screen==='add')render();
          }

          /* ---------- game ---------- */
          function startGame(srcId){
            var pool=[];
            A.sources.forEach(function(s){if(srcId&&s.id!==srcId)return;s.qs.forEach(function(q){pool.push({q:q,s:s,score:(q.n||0)-1.5*(q.w||0)+Math.random()*1.6});});});
            if(pool.length<5){toast('কমপক্ষে ৫টি প্রশ্ন লাগবে। আরও পৃষ্ঠা যোগ করো।');return;}
            pool.sort(function(a,b){return a.score-b.score;});
            var N=Math.min(15,pool.length),picked=pool.slice(0,N),extras=pool.slice(N,N+4);
            picked.forEach(function(r){r.k=r.q.d+Math.random()*0.9;});picked.sort(function(a,b){return a.k-b.k;});
            var prizes=[],k;for(k=0;k<N;k++)prizes.push(PR[N===1?0:Math.round(k*14/(N-1))]);
            var safe=N>=6?[Math.round(N/3)-1,Math.round(2*N/3)-1]:[];
            G={items:picked,extras:extras,i:0,N:N,prizes:prizes,safe:safe,life:{f:true,p:true,s:extras.length>0},locked:false,chosen:-1,revealed:false,hidden:[],poll:null,quit:false,res:[],dirty:{},final:null};
            prep();go('game');
          }
          function prep(){G.cur={perm:shuffle([0,1,2,3])};G.cur.correct=G.cur.perm.indexOf(G.items[G.i].q.a);G.locked=false;G.chosen=-1;G.revealed=false;G.hidden=[];G.poll=null;G.final=null;}
          function viewGame(){
            var it=G.items[G.i],q=it.q,j,h='';
            h+='<div class="gtop"><div class="badge">'+bn(G.i+1)+'</div><div class="info"><b>'+money(G.prizes[G.i])+'</b><span>'+bn(G.i+1)+'/'+bn(G.N)+' নম্বর প্রশ্ন'+(q.t?' · '+esc(q.t):'')+'</span></div>'
             +'<button class="iconbtn" data-act="mute" aria-label="শব্দ">'+(mute?'নীরব':'শব্দ')+'</button>'
             +'<button class="iconbtn" data-act="quit"'+(G.revealed?' disabled':'')+'>'+(G.quit?'নিশ্চিত? '+money(G.i?G.prizes[G.i-1]:0)+' নিয়ে থামো':'থামো')+'</button></div>';
            h+='<div class="segs">';for(j=0;j<G.N;j++)h+='<i class="'+(j<G.i?'done':j===G.i?'cur':'')+(G.safe.indexOf(j)>=0?' safe':'')+'"></i>';h+='</div>';
            h+='<div class="lives"><button class="life'+(G.life.f?'':' used')+'" data-act="l50"'+(!G.life.f||G.locked?' disabled':'')+'>৫০:৫০</button>'
             +'<button class="life'+(G.life.p?'':' used')+'" data-act="lpoll"'+(!G.life.p||G.locked?' disabled':'')+'>দর্শক</button>'
             +'<button class="life'+(G.life.s?'':' used')+'" data-act="lswap"'+(!G.life.s||G.locked?' disabled':'')+'>বদল</button></div>';
            h+='<div class="hex qbox" style="cursor:default"><span><b class="qt" style="font-weight:500">'+esc(q.q)+'</b></span></div><div class="opts">';
            for(j=0;j<4;j++){
              var cls='hex opt';
              if(G.hidden.indexOf(j)>=0)cls+=' gone';
              if(G.chosen===j)cls+=G.revealed?(j===G.cur.correct?' ok':' bad'):' sel';
              else if(G.revealed&&j===G.cur.correct)cls+=' ok';
              h+='<button class="'+cls+'" data-act="ans" data-j="'+j+'"'+(G.locked?' disabled':'')+'><span><i class="lt">'+LET[j]+'.</i><em>'+esc(q.o[G.cur.perm[j]])+'</em>'+(G.poll&&G.poll[j]!=null?'<b class="pc">'+bn(G.poll[j])+'%</b>':'')+'</span></button>';
            }
            h+='</div>';
            if(G.revealed){
              var ok=G.chosen===G.cur.correct;
              h+='<div class="exp'+(ok?'':' bad')+'"><b>'+(ok?'ঠিক উত্তর!':'ভুল হলো। সঠিক উত্তর: '+LET[G.cur.correct]+'. '+esc(q.o[q.a]))+'</b>'+(q.e?'<div class="small" style="color:#cfd8ff">'+esc(q.e)+'</div>':'')+'</div>'
               +'<div style="margin-top:14px">'+hexbtn('next',G.final?'ফলাফল দেখো':'পরের প্রশ্ন','',false)+'</div>';
            }
            h+='<details class="ladder"><summary>টাকার সিঁড়ি দেখো</summary><ol>';
            for(j=0;j<G.N;j++)h+='<li class="'+(j<G.i?'done':j===G.i?'cur':G.safe.indexOf(j)>=0?'safe':'')+'"><span>'+bn(j+1)+(G.safe.indexOf(j)>=0?' ◆':'')+'</span><span>'+money(G.prizes[j])+'</span></li>';
            h+='</ol></details>';
            return h;
          }
          function answer(j){
            if(G.locked||G.hidden.indexOf(j)>=0)return;
            G.locked=true;G.chosen=j;G.quit=false;sfx('click');render();
            setTimeout(reveal,1000);
          }
          function reveal(){
            if(!G||G.revealed)return;
            var it=G.items[G.i],ok=G.chosen===G.cur.correct;
            G.revealed=true;G.res[G.i]=ok?'ok':'bad';
            it.q.n=(it.q.n||0)+1;if(!ok)it.q.w=(it.q.w||0)+1;G.dirty[it.s.id]=it.s;
            if(!ok)G.final='wrong';else if(G.i===G.N-1)G.final='win';
            sfx(ok?(G.final==='win'?'win':'ok'):'bad');render();
          }
          function useFifty(){
            if(!G.life.f||G.locked)return;
            var wr=[];for(var j=0;j<4;j++)if(j!==G.cur.correct&&G.hidden.indexOf(j)<0)wr.push(j);
            shuffle(wr).slice(0,2).forEach(function(j){G.hidden.push(j);});
            if(G.poll)G.hidden.forEach(function(j){G.poll[j]=null;});
            G.life.f=false;sfx('click');render();
          }
          function usePoll(){
            if(!G.life.p||G.locked)return;
            var q=G.items[G.i].q,vis=[],j;for(j=0;j<4;j++)if(G.hidden.indexOf(j)<0)vis.push(j);
            var base=Math.max(30,Math.min(85,78-q.d*8-G.i*1.5+Math.random()*16)),rest=100-Math.round(base),others=vis.filter(function(x){return x!==G.cur.correct;}),w=others.map(function(){return 0.3+Math.random();}),ws=w.reduce(function(a,b){return a+b;},0),poll=[null,null,null,null],used=0;
            others.forEach(function(x,i){var v=i===others.length-1?rest-used:Math.round(rest*w[i]/ws);poll[x]=Math.max(0,v);used+=v;});
            poll[G.cur.correct]=100-others.reduce(function(a,x){return a+poll[x];},0);
            G.poll=poll;G.life.p=false;sfx('click');render();
          }
          function useSwap(){
            if(!G.life.s||G.locked||!G.extras.length)return;
            var d=G.items[G.i].q.d,bi=0,bd=99;
            G.extras.forEach(function(r,i){var x=Math.abs(r.q.d-d);if(x<bd){bd=x;bi=i;}});
            G.items[G.i]=G.extras.splice(bi,1)[0];
            G.life.s=false;var keepL={f:G.life.f,p:G.life.p,s:false};prep();G.life=keepL;sfx('click');render();
          }
          function next(){
            if(G.final){finish(G.final);return;}
            G.i++;G.quit=false;prep();render();window.scrollTo(0,0);
          }
          function winnings(kind){
            if(kind==='win')return G.prizes[G.N-1];
            var i=G.i;
            if(kind==='quit')return i?G.prizes[i-1]:0;
            var w=0;G.safe.forEach(function(s){if(s<i)w=Math.max(w,G.prizes[s]);});return w;
          }
          function finish(kind){
            var prize=winnings(kind),right=0,asked=0;
            G.res.forEach(function(r){if(r){asked++;if(r==='ok')right++;}});
            var st=A.stats;st.played++;st.best=Math.max(st.best,prize);st.right+=right;st.asked+=asked;
            var dk=dayKey();if(st.days.indexOf(dk)<0){st.days.push(dk);if(st.days.length>90)st.days=st.days.slice(-90);}
            Object.keys(G.dirty).forEach(function(id){saveSource(G.dirty[id]);});saveStats();
            G.end={kind:kind,prize:prize,right:right,asked:asked};
            go('over');
          }
          function viewOver(){
            var e=G.end,h='<div class="center"><h2>'+(e.kind==='win'?'অভিনন্দন! সব প্রশ্ন জিতেছ':e.kind==='quit'?'থেমে গেলে':'ভুল উত্তর, খেলা শেষ')+'</h2>'
             +'<div class="prize">'+money(e.prize)+'</div><p class="lead">'+bn(e.asked)+'টি প্রশ্নের মধ্যে '+bn(e.right)+'টি ঠিক'+(e.prize>A.stats.best-1&&e.prize>0&&e.prize===A.stats.best?' · নতুন সর্বোচ্চ জিত!':'')+'</p></div>';
            h+='<div class="menu">'+hexbtn('again','আবার খেলো','নতুন প্রশ্নগুলো আগে আসবে')+hexbtn('home','ঘরে ফিরি','')+'</div>';
            h+='<details class="rev" open><summary>পড়া ঝালাই: এই খেলার প্রশ্ন ও উত্তর</summary>';
            G.items.forEach(function(it,i){
              var r=G.res[i],q=it.q;
              h+='<div class="qi">'+(r==='ok'?'✓ ':r==='bad'?'✗ ':'')+esc(q.q)+'<br><i>উত্তর: '+esc(q.o[q.a])+'</i>'+(q.e?'<div class="small">'+esc(q.e)+'</div>':'')+'</div>';
            });
            return h+'</details>';
          }

          /* ---------- render + events ---------- */
          function render(){
            var h='';
            if(A.screen==='home')h=viewHome();else if(A.screen==='add')h=viewAdd();else if(A.screen==='bank')h=viewBank();else if(A.screen==='game')h=viewGame();else h=viewOver();
            app.innerHTML=h;
          }
          var delArm=null;
          app.addEventListener('click',function(e){
            var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
            var act=el.getAttribute('data-act');
            if(act==='home'){AD.stage='form';go('home');}
            else if(act==='play'){startGame();}
            else if(act==='add'){AD.stage='form';go('add');}
            else if(act==='add2'){AD.stage='form';AD.log=[];render();}
            else if(act==='bank'){go('bank');}
            else if(act==='mute'){mute=!mute;LS.set('gs-mute',mute);render();}
            else if(act==='savekey'){
              var kv=(($('#adKey')||{}).value||'').trim();
              if(kv.length<20){toast('চাবিটা ঠিক মনে হচ্ছে না। পুরোটা কপি করে দাও।');return;}
              LS.set('gs-key',kv);setupKey();render();toast('চাবি সেভ হয়েছে।');
            }
            else if(act==='tab'){AD.tab=el.getAttribute('data-t');render();}
            else if(act==='rmimg'){var i=+el.getAttribute('data-i');URL.revokeObjectURL(AD.imgs[i].url);AD.imgs.splice(i,1);render();}
            else if(act==='gen'){runGen();}
            else if(act==='genstop'){AD.stop=true;if(AD.ctl)AD.ctl.abort();}
            else if(act==='playnew'){var id=AD.newId;AD.stage='form';startGame(id);}
            else if(act==='playsrc'){startGame(el.getAttribute('data-id'));}
            else if(act==='delsrc'){
              var sid=el.getAttribute('data-id');
              if(delArm===sid){delArm=null;delSource(sid);render();}
              else{delArm=sid;el.textContent='আবার চাপলে মুছে যাবে';setTimeout(function(){if(delArm===sid){delArm=null;if(el.isConnected)el.textContent='মুছো';}},3500);}
            }
            else if(act==='ans'){answer(+el.getAttribute('data-j'));}
            else if(act==='l50'){useFifty();}
            else if(act==='lpoll'){usePoll();}
            else if(act==='lswap'){useSwap();}
            else if(act==='next'){next();}
            else if(act==='quit'){
              if(G.quit){finish('quit');}else{G.quit=true;render();setTimeout(function(){if(G&&G.quit&&A.screen==='game'){G.quit=false;render();}},3500);}
            }
            else if(act==='again'){startGame();}
          });
          app.addEventListener('input',function(e){
            var id=e.target.id;
            if(id==='adTitle')AD.title=e.target.value;
            else if(id==='adText'){AD.text=e.target.value;var b=app.querySelector('[data-act="gen"]');if(b){var ok=AD.text.trim().length>80&&!!A.sample;b.disabled=!ok;b.classList.toggle('dim',!ok);}}
            else if(id==='adFrom')AD.from=Math.max(1,Math.min(AD.pages,+e.target.value||1));
            else if(id==='adTo')AD.to=Math.max(1,Math.min(AD.pages,+e.target.value||1));
          });
          app.addEventListener('change',function(e){
            var id=e.target.id;
            if(id==='fImg'){
              Array.prototype.forEach.call(e.target.files,function(f){if(AD.imgs.length<20&&/^image\//.test(f.type))AD.imgs.push({file:f,url:URL.createObjectURL(f)});});
              render();
            }else if(id==='fPdf'&&e.target.files[0]){
              var f=e.target.files[0];AD.pdfName=f.name;AD.pages=0;AD.pdf=null;render();
              loadPdfJs().then(function(){return f.arrayBuffer();}).then(function(buf){return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;})
                .then(function(doc){AD.pdf=doc;AD.pages=doc.numPages;AD.from=1;AD.to=Math.min(doc.numPages,10);render();})
                .catch(function(){AD.pdfName='';toast('পিডিএফ খোলা গেল না। পৃষ্ঠার ছবি তুলে দাও।');render();});
            }
          });

          if(STANDALONE){window.addEventListener('popstate',function(){pushed=false;if(A.screen!=='home'){A.screen='home';render();}});}
          /*DBG*/
          render();
          initSample();
          initCloud();
          })();
          </script>
          </body></html>
          GS_EOF
      - name: Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "জ্ঞানের সিঁড়ি" com.nohan.gyanersingri --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gyaner-singri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gyaner-singri-apk
          path: gyaner-singri.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gyaner-singri-latest
          files: gyaner-singri.apk
