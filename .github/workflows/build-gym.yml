            '<section class="card"><div class="h3">নিয়ম</div><p class="muted">জিমের সময় ঠিক করতে "আজ" ট্যাবে যাও। প্রতিটা ওয়ার্কআউটের আগে ৫ মিনিট গা গরম করো (হালকা দৌড়ে বা হাত-পা ঘুরিয়ে)। ওজন তত বাড়াও, যত নিয়ম মেনে করতে পারো।</p></section>'+
