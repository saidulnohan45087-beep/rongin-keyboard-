           var h='<div class="row" style="margin-bottom:12px"><button class="btn" id="anew">+ নতুন লেখা যোগ করো</button></div><div class="list">';
           ART.forEach(function(a,i){h+='<button class="art" data-i="'+i+'"><img src="'+a.poster+'" alt=""><span><span class="g-t">'+esc(a.title)+'</span><br><span class="g-s">'+esc(a.date)+'</span></span></button>'});
           if(!ART.length)h+='<div class="msg">এখনো কোনো লেখা নেই। উপরের বোতাম টিপে প্রথম লেখাটা যোগ করো।</div>';
