           h+='<div class="note" id="gnote">'+esc(G.status||engNote())+(AN.err?' · বিশ্লেষণে সমস্যা: '+esc(AN.err):'')+'</div>';
           if(!GAMES.length)h+='<div class="msg">তোমার Chess.com ইউজারনেম লিখে সেভ চাপো। সাম্প্রতিক গেমগুলো এখানে আসবে।</div>';
