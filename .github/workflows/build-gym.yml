                  if (!night) {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or 0x10
                  }

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }

                  web = WebView(this)
                  web.setBackgroundColor(bg)
                  setContentView(web)

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.setSupportZoom(false)
                  s.mediaPlaybackRequiresUserGesture = false

                  web.addJavascriptInterface(Bridge(this), "GymNative")

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          return loader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val host = request.url.host ?: ""
                          if (host == "appassets.androidplatform.net") return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, request.url))
                              true
                          } catch (e: Exception) {
                              true
                          }
                      }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  web.evaluateJavascript("(window.appBack ? appBack() : false)") { r ->
                      if (r != "true") finish()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  web.evaluateJavascript("(window.onResumeApp ? onResumeApp() : 0)", null)
              }

              override fun onPause() {
                  web.onPause()
                  super.onPause()
              }
          }
