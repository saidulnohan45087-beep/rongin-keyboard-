      - name: Fetch California chess pieces
        run: |
          mkdir -p app/src/main/assets/pieces
          BASE=https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/california
          for p in wP wN wB wR wQ wK bP bN bB bR bQ bK; do
            curl -fsSL --retry 3 "$BASE/$p.svg" -o "app/src/main/assets/pieces/$p.svg" || echo "FAILED $p"
          done
          ls -la app/src/main/assets/pieces
      - name: Fetch Stockfish engine
        run: |
          set +e
          mkdir -p app/src/main/assets/sf /tmp/sfpk
          cd /tmp/sfpk
          npm pack stockfish > /dev/null 2>&1
          tar xzf stockfish-*.tgz 2>/dev/null
          JS=$(find package -type f -name '*.js' | grep -i lite | grep -i single | head -1)
          [ -z "$JS" ] && JS=$(find package -type f -name '*.js' | grep -i single | head -1)
          if [ -n "$JS" ] && [ -f "${JS%.js}.wasm" ]; then
            cp "$JS" "${JS%.js}.wasm" "$GITHUB_WORKSPACE/app/src/main/assets/sf/"
            printf '{"js":"%s"}' "$(basename "$JS")" > "$GITHUB_WORKSPACE/app/src/main/assets/sf/manifest.json"
            echo "Stockfish OK: $JS"
          else
            echo "Stockfish NOT found"; find package -type f | head -60
          fi
          cd "$GITHUB_WORKSPACE"
          ls -la app/src/main/assets/sf
      - name: Build Brilliant app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk brilliant.apk
          TAG="brilliant-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" brilliant.apk --repo "${{ github.repository }}" --title "Brilliant $TAG" --notes "Install brilliant.apk on your phone."
