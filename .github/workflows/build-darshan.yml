          mkdir -p darshan-app/app/src/main/java/com/darshan/app
          cat > darshan-app/app/src/main/java/com/darshan/app/MainActivity.kt <<'PATH_EOF'
          package com.darshan.app

          import android.app.Activity
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewAssetLoader

          /** দর্শন দর্পণ: ওয়েব-ভিত্তিক অ্যাপ, ফ্রি এআই চাবি দিয়ে চলে। বাইরের লিংক ব্রাউজারে খোলে। */
          class MainActivity : Activity() {

              private lateinit var web: WebView

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val night = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  val bg = if (night) Color.parseColor("#0E1220") else Color.parseColor("#F3F5FA")
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  if (!night) {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or 0x10
                  }

                  web = WebView(this)
                  web.setBackgroundColor(bg)
                  setContentView(web)

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.setSupportZoom(false)

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          return loader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val host = request.url.host ?: ""
                          if (host == "appassets.androidplatform.net") return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, request.url))
                              true
                          } catch (e: Exception) {
                              true
                          }
                      }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  web.evaluateJavascript("(window.appBack ? appBack() : false)") { r ->
                      if (r != "true") finish()
                  }
              }

              override fun onResume() { super.onResume(); web.onResume() }
              override fun onPause() { web.onPause(); super.onPause() }
          }
