              if(T>0){
                var days=Math.ceil(T/(st.hours*60));
                od.innerHTML='দিনে '+hrLabel(st.hours)+' দেখলে <b>'+dg(days)+' দিনে</b> শেষ হবে। দিনে প্রায় '+dg(Math.max(1,Math.round(st.hours*60/Math.max(1,nMin()))))+' এপিসোড।';
              } else od.textContent='এপিসোড আর মিনিট বসালে হিসাব দেখাবে।';
