      - name: Build math app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gonit-shikhi.apk
          TAG="math-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" gonit-shikhi.apk --repo "${{ github.repository }}" --title "Gonit Shikhi $TAG" --notes "Install gonit-shikhi.apk on your phone."
