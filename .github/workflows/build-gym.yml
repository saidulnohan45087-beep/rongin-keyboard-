          mkdir -p gym-app/app/src/main/java/com/ironfist/app
          cat > gym-app/app/src/main/java/com/ironfist/app/Receivers.kt <<'PATH_EOF'
          package com.ironfist.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val n = i.getIntExtra("n", 0)
                  val today = Sched.dayNum(System.currentTimeMillis())
                  if (Sched.doneDay(c) != today) {
                      show(c, n)
                  }
                  Sched.scheduleNext(c)
              }

              private fun show(c: Context, n: Int) {
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ch = NotificationChannel("gym", "জিমের সময়", NotificationManager.IMPORTANCE_HIGH)
                  ch.enableVibration(true)
                  nm.createNotificationChannel(ch)

                  val open = PendingIntent.getActivity(
                      c, 1, Intent(c, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val title = if (n == 0) "জিমের সময় হয়েছে" else "ঘুষি পড়ছে"
                  val text = if (n == 0) {
                      "এখনই ওয়ার্কআউট শুরু করো। ১০ মিনিট দেরি হলে প্রথম ঘুষি পড়বে।"
                  } else {
                      "$n নম্বর ঘুষি! কাচে ফাটল ধরছে, এখনই শুরু করো।"
                  }
                  val nb = Notification.Builder(c, "gym")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setContentIntent(open)
                      .setAutoCancel(true)
                  nm.notify(100 + n, nb.build())
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  Sched.scheduleNext(c)
              }
          }
