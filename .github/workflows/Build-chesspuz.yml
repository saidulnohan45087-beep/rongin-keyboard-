           document.querySelectorAll('.art').forEach(function(b){b.onclick=function(){S.ai=+b.dataset.i;S.view='aview';render()}})}
          var E={};
          function aView(){var a=ART[S.ai];var h='<button class="back" id="bk">← সব লেখা</button>';
