          cat > pathagar-app/app/src/main/java/com/pathagar/app/MainActivity.kt <<'PATH_EOF'
          package com.pathagar.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          /** ওয়েব-ভিত্তিক ৩ডি পাঠাগারকে পুরো পর্দার অ্যাপে চালায়। থ্রিডি ও পিডিএফ লাইব্রেরি ইন্টারনেট থেকে আসে। */
          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var chooser: ValueCallback<Array<Uri>>? = null

              @Suppress("DEPRECATION")
              private fun immersive() {
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  immersive()
                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#0c0907"))
                  setContentView(web)

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  s.setSupportZoom(false)

                  web.webViewClient = WebViewClient()
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          w: WebView,
                          cb: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          chooser?.onReceiveValue(null)
                          chooser = cb
                          val i = try {
                              params.createIntent()
                          } catch (e: Exception) {
                              Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = "application/pdf"
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              }
                          }
                          return try {
                              @Suppress("DEPRECATION")
                              startActivityForResult(i, 77)
                              true
                          } catch (e: Exception) {
                              chooser = null
                              false
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 77) {
                      chooser?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      chooser = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onResume() { super.onResume(); web.onResume(); immersive() }
              override fun onPause() { web.onPause(); super.onPause() }
              override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) immersive() }
          }
