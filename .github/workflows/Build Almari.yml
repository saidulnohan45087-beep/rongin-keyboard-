      - name: Build Almari app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: porar-almari-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk porar-almari.apk
          TAG="almari-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" porar-almari.apk --repo "${{ github.repository }}" --title "Porar Almari $TAG" --notes "Install porar-almari.apk on your phone."
