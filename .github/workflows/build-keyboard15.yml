      - name: Build keyboard APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard14-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rongin-bangla-keyboard-1.4.apk
          TAG="keyboard14-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" rongin-bangla-keyboard-1.4.apk --repo "${{ github.repository }}" --title "Rongin Keyboard 1.4 $TAG" --notes "Install rongin-bangla-keyboard-1.4.apk on your phone."
