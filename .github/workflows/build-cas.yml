      - name: Build app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cas-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cigarette-after-sex.apk
          TAG="cas-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" cigarette-after-sex.apk --repo "${{ github.repository }}" --title "Cigarette After Sex $TAG" --notes "Install cigarette-after-sex.apk on your phone."
