      - name: Fetch California chess pieces
        run: |
          mkdir -p chesspuz-app/app/src/main/assets/pieces
          BASE=https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/california
          for p in wP wN wB wR wQ wK bP bN bB bR bQ bK; do
            curl -fsSL --retry 3 "$BASE/$p.svg" -o "chesspuz-app/app/src/main/assets/pieces/$p.svg" || { echo "FAILED $p"; exit 1; }
          done
          ls -la chesspuz-app/app/src/main/assets/pieces

      - name: Fetch Stockfish engine
        continue-on-error: true
        run: |
          rm -rf sfpkg && mkdir sfpkg && cd sfpkg
          npm pack stockfish
          tar xzf stockfish-*.tgz
          cat > pick_engine.py <<'PICK_EOF'
          import os, json, shutil
          src = 'package/src' if os.path.isdir('package/src') else 'package'
          dst = '../chesspuz-app/app/src/main/assets'
          files = os.listdir(src)
          print('ENGINE FILES:', sorted(files))
          js = [f for f in files if f.endswith('.js') and 'worker' not in f.lower() and 'node' not in f.lower()]
          def score(f):
              s = 0
              if 'lite' in f: s -= 4
              if 'single' in f: s -= 3
              if 'asm' in f: s += 5
              return s
          cands = sorted(js, key=score)
          chosen = None
          for f in cands:
              stem = f[:-3]
              w = [x for x in files if x.endswith('.wasm') and x.startswith(stem)]
              if w and 'single' in f:
                  chosen = (f, w[0]); break
          if not chosen:
              for f in cands:
                  if 'asm' in f:
                      chosen = (f, ''); break
          if chosen:
              shutil.copy(os.path.join(src, chosen[0]), os.path.join(dst, chosen[0]))
              if chosen[1]:
                  shutil.copy(os.path.join(src, chosen[1]), os.path.join(dst, chosen[1]))
              json.dump({'js': chosen[0], 'wasm': chosen[1]}, open(os.path.join(dst, 'engine.json'), 'w'))
              print('ENGINE CHOSEN:', chosen)
          else:
              print('WARNING: no usable Stockfish file found, app will use the basic engine')
          PICK_EOF
          python3 pick_engine.py
          ls -la ../chesspuz-app/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: chesspuz-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp chesspuz-app/app/build/outputs/apk/debug/app-debug.apk chesspuz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chesspuz-apk
          path: chesspuz.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chesspuz-v${{ github.run_number }}
          name: দাবা পাজল v${{ github.run_number }}
          files: chesspuz.apk
