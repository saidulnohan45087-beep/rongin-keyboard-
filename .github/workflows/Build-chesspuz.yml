           var base='https://api.chess.com/pub/player/'+encodeURIComponent(u.toLowerCase());
           fetch(base+'/games/archives').then(function(r){if(r.status===404)throw new Error('এই ইউজারনেম Chess.com-এ পাওয়া যায়নি।');if(!r.ok)throw new Error('Chess.com সাড়া দিচ্ছে না ('+r.status+')।');return r.json()})
           .then(function(j){var a=(j.archives||[]).slice(-2).reverse();if(!a.length)throw new Error('এই আইডিতে এখনো কোনো গেম নেই।');
            return Promise.all(a.map(function(url){return fetch(url).then(function(r){return r.ok?r.json():{games:[]}})}))})
           .then(function(arr){var all=[];arr.forEach(function(x){(x.games||[]).forEach(function(g){all.push(g)})});
            all=all.filter(function(g){return g.rules==='chess'&&g.pgn}).sort(function(a,b){return b.end_time-a.end_time}).slice(0,20);
            var old={};GAMES.forEach(function(g){old[g.key]=g});var lu=u.toLowerCase();
            GAMES=all.map(function(g,i){var w=g.white.username.toLowerCase()===lu;var me=w?g.white:g.black,op=w?g.black:g.white;var res=me.result;
             var out=res==='win'?'win':(['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'].indexOf(res)>=0?'draw':'loss');var o=old[g.url];
             return{key:g.url,id:i,opp:op.username,rat:op.rating,color:w?'w':'b',out:out,tc:TCN[g.time_class]||g.time_class,t:g.end_time,date:relDay(g.end_time),pgn:g.pgn,an:o?o.an:false,pz:o?o.pz:[],eng:o?o.eng:''}});
            G.status='';saveGames();if(S.view==='list'&&S.tab==='games')vList();autoNext()})
           .catch(function(e){var m=e&&e.message||'';G.status=(m&&!/Failed to fetch|NetworkError|Load failed/i.test(m))?m:'ইন্টারনেট সংযোগে সমস্যা। একটু পরে আবার চেষ্টা করো।';if(S.view==='list'&&S.tab==='games')vList()})}
          /* ইঞ্জিন */
          var Eng={mode:'',w:null,on:null,p:null};
          function engSend(s){Eng.w.postMessage(s)}
          function engInit(){if(Eng.p)return Eng.p;Eng.p=new Promise(function(res){var done=false;
           function fin(m){if(done)return;done=true;Eng.mode=m;if(m!=='stockfish'&&Eng.w){try{Eng.w.terminate()}catch(e){}Eng.w=null}res(m)}
           setTimeout(function(){fin('basic')},20000);
           fetch('engine.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
            var w=new Worker(j.js+(j.wasm?'#'+j.wasm:''));Eng.w=w;
            w.onerror=function(){fin('basic')};
            w.onmessage=function(e){var l=typeof e.data==='string'?e.data:'';
             if(l==='uciok'){engSend('setoption name Threads value 1');engSend('setoption name Hash value 16');engSend('setoption name MultiPV value 2');engSend('isready')}
             else if(l==='readyok'&&!done){fin('stockfish')}else if(Eng.on)Eng.on(l)};
            engSend('uci')}).catch(function(){fin('basic')})});return Eng.p}
          function sc(x){return x.mate?(x.v>0?30000-x.v:-30000-x.v):x.v}
          function engEval(fen,ms){return new Promise(function(res){
           if(Eng.mode==='stockfish'){var pv={};Eng.on=function(l){
             if(l.indexOf('info')===0&&l.indexOf(' pv ')>0){var k=+((l.match(/ multipv (\d+)/)||[0,1])[1]);var m=l.match(/ score (cp|mate) (-?\d+)/);if(!m)return;pv[k]={mate:m[1]==='mate',v:+m[2],pv:l.split(' pv ')[1].trim().split(/\s+/)}}
             else if(l.indexOf('bestmove')===0){Eng.on=null;res(pv)}};
            engSend('position fen '+fen);engSend('go movetime '+ms)}
           else setTimeout(function(){var pos=new Core.Pos().setFen(fen);var an=SE.analyze(pos,ms>500?4:3);var out={};
            for(var i=0;i<2&&i<an.length;i++){var s=an[i].s;var mate=s>=SE.MATE-60||s<=-SE.MATE+60;
             out[i+1]=mate?{mate:true,v:s>0?((SE.MATE-s+1)>>1):-((SE.MATE+s+1)>>1),pv:[an[i].u]}:{mate:false,v:s,pv:[an[i].u]}}res(out)},0)})}
          /* পাজল হওয়ার শর্ত: সেরা চালটা স্পষ্টভাবে একটাই */
          function cond(r){var a=r[1],b=r[2];if(!a||!b)return null;var v1=sc(a),v2=sc(b);
           if(a.mate&&a.v>0)return(!(b.mate&&b.v>0)||b.v-a.v>=2)?'mate':null;
           if(a.mate)return null;
           if(v1>=120&&v1<1500&&v1-v2>=150&&v2<400)return'win';
           if(v1>=-60&&v1<=80&&v2<=-200)return'eq';
           return null}
          function trimLine(fen,pv,mateN){var p=new Core.Pos().setFen(fen),out=[];var lim=mateN?Math.min(pv.length,2*mateN-1):Math.min(pv.length,3);
           for(var i=0;i<lim;i++){var m=p.parse(pv[i]);if(!m)break;out.push(pv[i]);p.make(m)}
           if(out.length%2===0)out.pop();return out}
          function basicExt(fen,u1,mate){var p=new Core.Pos().setFen(fen);var sol=[u1];p.make(p.parse(u1));
           for(var k=0;k<3;k++){if(!p.legal().length)break;var o=SE.analyze(p,3)[0];var op=p.parse(o.u);var q=new Core.Pos().setFen(p.fen());q.make(op);if(!q.legal().length)break;
            var us=SE.analyze(q,4)[0];var um=q.parse(us.u);var cap=(um>>15)&8;var isMt=us.s>=SE.MATE-60;if(!(mate||cap||isMt))break;sol.push(o.u,us.u);p.make(op);p.make(um)}
           return sol}
          /* বিশ্লেষণ */
          var AN={g:null,pct:0,tok:null,err:''};
          function tick(g,p){AN.pct=p;var e=$('#apct');if(e)e.textContent=bn(Math.round(p*100))+'%';var b=$('#abar');if(b)b.style.width=Math.round(p*100)+'%';
           var c=document.querySelector('[data-pc="'+g.id+'"]');if(c)c.firstChild.textContent=bn(Math.round(p*100))+'%'}
          async function analyzeGame(g,tok){
           var mode=await engInit();G.eng=mode;
           var mv=parsePGN(g.pgn);var uc=g.color==='w'?1:-1;var pos=new Core.Pos().setFen(Core.START);var puz=[],last=-9;
           for(var ply=0;ply<mv.length;ply++){
            if(tok.cancel)return;tick(g,ply/mv.length);
            if(pos.turn===uc&&ply>=8&&ply-last>=4&&puz.length<10&&pos.legal().length>=2){
             var fen=pos.fen();var r=await engEval(fen,300);var c=cond(r);
             if(c){var r2=await engEval(fen,900);var c2=cond(r2);
              if(c2&&r2[1].pv[0]===r[1].pv[0]){var a=r2[1];var mateN=(a.mate&&a.v>0)?a.v:0;var sol=trimLine(fen,a.pv,mateN);
               if(mode!=='stockfish'&&sol.length<3)sol=basicExt(fen,a.pv[0],!!mateN);
               if(sol.length){var th=[];try{th=CL(fen,sol)||[]}catch(e){}
                th=th.filter(function(t){return t!=='Endgame Tactics'||th.length===1});
                if(!th.length)th=[c2==='eq'?'Equalizer':'Advantage'];
                puz.push({fen:fen,sol:sol,th:th,found:mv[ply]===sol[0]});last=ply}}}
             await sleep(80)}
            pos.make(pos.parse(mv[ply]))}
           if(tok.cancel)return;
           g.pz=puz;g.an=true;g.eng=mode}
          function startAn(g){if(AN.tok)AN.tok.cancel=true;var tok={cancel:false};AN={g:g,pct:0,tok:tok,err:''};
           analyzeGame(g,tok).then(function(){if(tok.cancel)return;AN={g:null,pct:0,tok:null,err:''};saveGames();refreshAn()}).catch(function(e){if(tok.cancel)return;AN={g:null,pct:0,tok:null,err:String(e&&e.message||e)};refreshAn()})}
          function refreshAn(){if(S.tab!=='games')return;if(S.view==='list')vList();else if(S.view==='an')vAn()}
          function autoNext(){if(!AN.g&&GAMES[0]&&!GAMES[0].an)startAn(GAMES[0])}
