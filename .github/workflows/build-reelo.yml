      - name: Build app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reelo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk reelo.apk
          TAG="reelo-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" reelo.apk --repo "${{ github.repository }}" --title "Reelo $TAG" --notes "Install reelo.apk on your phone."
