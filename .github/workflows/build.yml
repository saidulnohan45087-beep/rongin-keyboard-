          package com.rongin.banglakb

          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.math.sqrt

          enum class Variant { KEY, DEL, SPECIAL, ENTER }

          class StyleInfo(val id: String, val name: String)

          /**
           * Builds the short key sounds from maths, so no sound files have to ship with the app.
           * Each style has four variants: normal key, delete, space/shift/other, and enter.
           * No Android classes here, so it can also be run on a plain JVM.
           */
          object Synth {
              const val SR = 22050

              val styles = listOf(
                  StyleInfo("off", "নীরব"),
                  StyleInfo("ios", "আইফোন ধাঁচ"),
                  StyleInfo("blue", "মেকানিক্যাল নীল (ক্লিকি)"),
                  StyleInfo("brown", "মেকানিক্যাল বাদামি (নরম ক্লিক)"),
                  StyleInfo("red", "মেকানিক্যাল লাল (গভীর থক)"),
                  StyleInfo("typewriter", "টাইপরাইটার (এন্টারে ঘণ্টা)"),
                  StyleInfo("pop", "বাবল পপ"),
                  StyleInfo("tap", "হালকা ট্যাপ"),
              )

              private class Mix(seconds: Double) {
                  val n = (seconds * SR).toInt()
                  val buf = FloatArray(n)
                  private val rnd = java.util.Random(7)

                  /** A burst of noise around [freq] that dies away with time constant [tau]. */
                  fun band(freq: Double, q: Double, tau: Double, amp: Double, delay: Double = 0.0) {
                      val w0 = 2.0 * Math.PI * freq / SR
                      val alpha = sin(w0) / (2.0 * q)
                      val a0 = 1.0 + alpha
                      val b0 = alpha / a0
                      val b2 = -alpha / a0
                      val a1 = -2.0 * cos(w0) / a0
                      val a2 = (1.0 - alpha) / a0
                      // A narrow band passes little noise, so scale each layer to a similar loudness.
                      val gain = amp * sqrt((SR / 2.0) / (freq / q)) * 1.2
                      var x1 = 0.0
                      var x2 = 0.0
                      var y1 = 0.0
                      var y2 = 0.0
                      val start = (delay * SR).toInt()
                      for (i in 0 until n - start) {
                          val t = i.toDouble() / SR
                          val x = (rnd.nextDouble() * 2.0 - 1.0) * exp(-t / tau)
                          val y = b0 * x + b2 * x2 - a1 * y1 - a2 * y2
                          x2 = x1
                          x1 = x
                          y2 = y1
                          y1 = y
                          buf[start + i] += (y * gain).toFloat()
                      }
                  }

                  /** A fading sine. The pitch glides from [f0] to [f1] over the first moments. */
                  fun tone(f0: Double, f1: Double, tau: Double, amp: Double, delay: Double = 0.0) {
                      val start = (delay * SR).toInt()
                      var phase = 0.0
                      for (i in 0 until n - start) {
                          val t = i.toDouble() / SR
                          val glide = if (t >= tau * 1.5) 1.0 else t / (tau * 1.5)
                          val f = f0 + (f1 - f0) * glide
                          phase += 2.0 * Math.PI * f / SR
                          buf[start + i] += (sin(phase) * exp(-t / tau) * amp).toFloat()
                      }
                  }

                  fun pcm(): ShortArray {
                      // Short fades first, so the loudness is measured on what is actually played.
                      val fadeIn = max(1, (0.0003 * SR).toInt())
                      val fadeOut = max(1, (0.004 * SR).toInt())
                      for (i in 0 until n) {
                          var v = buf[i]
                          if (i < fadeIn) v *= i / fadeIn.toFloat()
                          if (i > n - fadeOut) v *= (n - i) / fadeOut.toFloat()
                          buf[i] = v
                      }
                      var peak = 0f
                      var sum = 0.0
                      for (v in buf) {
                          peak = max(peak, abs(v))
                          sum += (v * v).toDouble()
                      }
                      val rms = sqrt(sum / n).toFloat()
                      // Even loudness across styles, without clipping the sharp clicks.
                      var g = if (peak > 0f) 0.9f / peak else 1f
                      if (rms > 0f) g = minOf(g, 0.12f / rms)
                      return ShortArray(n) { i ->
                          (buf[i] * g * 32767f).toInt().coerceIn(-32768, 32767).toShort()
                      }
                  }
              }

              fun render(style: String, variant: Variant): ShortArray {
                  val bell = style == "typewriter" && variant == Variant.ENTER
                  val m = Mix(if (bell) 0.5 else 0.09)
                  // Lower pitch for delete and for the bigger keys.
                  val d = when (variant) {
                      Variant.DEL -> 0.82
                      Variant.SPECIAL -> 0.7
                      Variant.ENTER -> 0.62
                      Variant.KEY -> 1.0
                  }
                  when (style) {
                      "ios" -> {
                          m.band(2600.0 * d, 1.2, 0.004, 1.0)
                          m.tone(1500.0 * d, 1500.0 * d, 0.008, 0.6)
                      }
                      "blue" -> {
                          m.band(5200.0 * d, 2.0, 0.0015, 1.0)
                          m.band(900.0 * d, 1.5, 0.012, 1.1, 0.009)
                          m.tone(320.0 * d, 320.0 * d, 0.02, 0.6, 0.009)
                      }
                      "brown" -> {
                          m.band(3200.0 * d, 1.5, 0.002, 0.45)
                          m.band(700.0 * d, 1.2, 0.014, 1.1, 0.008)
                          m.tone(280.0 * d, 280.0 * d, 0.02, 0.6, 0.008)
                      }
                      "red" -> {
                          m.band(600.0 * d, 1.0, 0.016, 1.2)
                          m.tone(230.0 * d, 230.0 * d, 0.025, 0.8)
                          m.tone(480.0 * d, 480.0 * d, 0.012, 0.35)
                      }
                      "typewriter" -> {
                          if (bell) {
                              m.tone(2600.0, 2600.0, 0.25, 0.9)
                              m.tone(5200.0, 5200.0, 0.15, 0.35)
                              m.band(3800.0, 1.2, 0.003, 0.5)
                          } else {
                              m.band(3800.0 * d, 1.2, 0.003, 1.0)
                              m.tone(2600.0 * d, 2600.0 * d, 0.03, 0.4)
                              m.band(400.0 * d, 1.0, 0.02, 0.9, 0.004)
                          }
                      }
                      "pop" -> when (variant) {
                          Variant.KEY -> m.tone(550.0, 1300.0, 0.018, 1.0)
                          Variant.DEL -> m.tone(1000.0, 450.0, 0.02, 1.0)
                          Variant.SPECIAL -> m.tone(380.0, 850.0, 0.03, 1.0)
                          Variant.ENTER -> m.tone(500.0, 1700.0, 0.04, 1.0)
                      }
                      "tap" -> {
                          m.band(4200.0 * d, 1.0, 0.0025, 1.0)
                          m.tone(2300.0 * d, 2300.0 * d, 0.004, 0.5)
                      }
                  }
                  return m.pcm()
              }

              /** Wraps 16-bit mono samples in a standard WAV file. */
              fun wav(pcm: ShortArray): ByteArray {
                  val dataLen = pcm.size * 2
                  val out = java.io.ByteArrayOutputStream(44 + dataLen)
                  fun int(v: Int) {
                      out.write(v and 0xFF)
                      out.write((v shr 8) and 0xFF)
                      out.write((v shr 16) and 0xFF)
                      out.write((v shr 24) and 0xFF)
                  }
                  fun short(v: Int) {
                      out.write(v and 0xFF)
                      out.write((v shr 8) and 0xFF)
                  }
                  out.write("RIFF".toByteArray())
                  int(36 + dataLen)
                  out.write("WAVE".toByteArray())
                  out.write("fmt ".toByteArray())
                  int(16)
                  short(1) // PCM
                  short(1) // mono
                  int(SR)
                  int(SR * 2)
                  short(2)
                  short(16)
                  out.write("data".toByteArray())
                  int(dataLen)
                  for (s in pcm) short(s.toInt())
                  return out.toByteArray()
              }
          }
          RONGIN_EOF
          mkdir -p app/src/main/java/com/rongin/banglakb
          cat > app/src/main/java/com/rongin/banglakb/Themes.kt <<'RONGIN_EOF'
          package com.rongin.banglakb

          import android.content.Context
          import android.graphics.Color
          import org.json.JSONArray
          import org.json.JSONObject

          /** A key colour theme. Colours are ARGB ints. Key colours repeat in order across the keyboard. */
          class Theme(
              val name: String,
              val cycle: List<Int>,
              val fn: Int,
              val enter: Int,
              val builtin: Boolean,
          )

          object Themes {
              private const val PREFS = "kb"

              private fun c(hex: String): Int = Color.parseColor(hex)

              val builtin: List<Theme> by lazy {
                  val y = c("#F6C628")
                  val b = c("#2563D9")
                  val w = c("#F3F2EE")
                  val r = c("#E5392F")
                  val k = c("#1D1F27")
                  val g = c("#27B37A")
                  val p = c("#EE5C9B")
                  val v = c("#7B57E0")
                  val o = c("#F58A1F")
                  listOf(
                      Theme("রংধনু", listOf(y, b, w, r), k, r, true),
                      Theme("সমুদ্র", listOf(b, w), k, y, true),
                      Theme("ক্যান্ডি", listOf(p, w, v), k, y, true),
                      Theme("বন", listOf(g, w, k), y, o, true),
                      Theme("সূর্যাস্ত", listOf(o, y, r), k, v, true),
                      Theme("রাত", listOf(k), v, y, true),
                  )
              }

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              /** Themes the user made. Unlimited; stored as JSON on the phone. */
              fun custom(ctx: Context): List<Theme> {
                  return try {
                      val arr = JSONArray(prefs(ctx).getString("custom", "[]") ?: "[]")
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          val cs = o.getJSONArray("c")
                          val colors = (0 until cs.length()).map { j -> cs.getInt(j) }
                          Theme(o.getString("n"), colors, o.getInt("f"), o.getInt("e"), false)
                      }.filter { it.cycle.isNotEmpty() }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun all(ctx: Context): List<Theme> = builtin + custom(ctx)

              private fun saveCustom(ctx: Context, list: List<Theme>) {
                  val arr = JSONArray()
                  list.forEach { t ->
                      val o = JSONObject()
                      o.put("n", t.name)
                      val cs = JSONArray()
                      t.cycle.forEach { col -> cs.put(col) }
                      o.put("c", cs)
                      o.put("f", t.fn)
                      o.put("e", t.enter)
                      arr.put(o)
                  }
                  prefs(ctx).edit().putString("custom", arr.toString()).apply()
              }

              fun addCustom(ctx: Context, t: Theme) {
                  saveCustom(ctx, custom(ctx) + t)
                  save(ctx, all(ctx).size - 1)
              }

              /** [allIndex] is the position in [all]. Built-in themes cannot be removed. */
              fun removeCustom(ctx: Context, allIndex: Int) {
                  val ci = allIndex - builtin.size
                  val list = custom(ctx).toMutableList()
                  if (ci in list.indices) {
                      list.removeAt(ci)
                      saveCustom(ctx, list)
                  }
                  val cur = current(ctx)
                  val next = if (cur == allIndex) 0 else if (cur > allIndex) cur - 1 else cur
                  save(ctx, next)
              }

              fun current(ctx: Context): Int =
                  prefs(ctx).getInt("theme", 0).coerceIn(0, all(ctx).size - 1)

              fun active(ctx: Context): Theme = all(ctx)[current(ctx)]

              fun save(ctx: Context, index: Int) {
                  prefs(ctx).edit().putInt("theme", index).apply()
              }

              fun popupOn(ctx: Context): Boolean = prefs(ctx).getBoolean("popup", true)

              fun setPopup(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean("popup", on).apply()
              }

              /** Dark label on light keys, white label on dark keys. */
              fun labelOn(bg: Int): Int {
                  val lum = (0.299 * Color.red(bg) + 0.587 * Color.green(bg) + 0.114 * Color.blue(bg)) / 255.0
                  return if (lum > 0.5) Color.parseColor("#16171B") else Color.WHITE
              }

              /** Returns (key background, label colour). */
              fun colorFor(theme: Theme, key: Key, row: Int, col: Int): Pair<Int, Int> {
                  val bg = when {
                      key.kind == Kind.ENTER -> theme.enter
                      key.fn -> theme.fn
                      else -> theme.cycle[(row * 2 + col) % theme.cycle.size]
                  }
                  return bg to labelOn(bg)
              }
          }
