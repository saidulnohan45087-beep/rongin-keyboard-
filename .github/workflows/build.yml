              var oe=$('outDead');
              if(st.deadline&&T>0){
                var left=daysBetween(st.deadline);
                if(left===null||left<0){oe.textContent='এই তারিখ পার হয়ে গেছে, ভবিষ্যতের একটা তারিখ বেছে নিন।'}
                else{
                  var span=left+1; // today counts
                  var perDayEps=nEps()/span, perDayMin=T/span;
                  oe.innerHTML=dg(span)+' দিনের মধ্যে শেষ করতে দিনে <b>প্রায় '+dec1(perDayEps)+' এপিসোড</b> ('+fmtHM(Math.ceil(perDayMin))+') দেখতে হবে।';
                }
              } else if(!st.deadline){oe.textContent='তারিখ বেছে নিলে দিনে কয়টা এপিসোড দেখতে হবে সেটা এখানে দেখাবে।'}
              // list
