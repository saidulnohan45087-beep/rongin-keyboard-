      - name: Build GTA6 app APK
        run: gradle assembleDebug --no-daemon
      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta6-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gta6.apk
          TAG="gta6-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" gta6.apk --repo "${{ github.repository }}" --title "GTA6 $TAG" --notes "Install gta6.apk on your phone."
