              toast("বাঁধাই শেষ! " + bn(made.length) + "টি বই “আমার বই” তাকে রাখা হয়েছে।", 5500);
            }
            if (sample) {
              var minMs = Math.min(20000, 5000 + n * 55);
              var iv = setInterval(function () { var u = (performance.now() - t0) / minMs; bar.style.width = Math.min(100, u * 100) + "%"; if (u >= 1) { clearInterval(iv); finish(); } }, 200);
            } else {
              var i = 0;
              (function next() {
                if (i >= files.length) { setTimeout(finish, Math.max(0, Math.min(8000, 2000 + n * 40) - (performance.now() - t0))); return; }
                var f = files[i], fr = new FileReader();
                fr.onload = function () {
                  window.pdfjsLib.getDocument({ data: new Uint8Array(fr.result) }).promise.then(function (d) { parts.push({ file: f, n: d.numPages }); if (d.destroy) d.destroy(); }).catch(function () {}).then(function () { i++; bar.style.width = (i / files.length * 100) + "%"; next(); });
                };
                fr.onerror = function () { i++; next(); };
                fr.readAsArrayBuffer(f);
              })();
            }
          };

          /* owner + power */
          function endShed() { G.shed.on = false; G.flick = 1.4; G.shed.next = rnd(150, 300); toast("কারেন্ট এসেছে। বাতি জ্বলে উঠল।", 3000); sfx.click(); }
          function startShed() { G.shed.on = true; G.shed.dur = rnd(40, 75); G.shed.t = 0; sfx.click(); sfx.murmur(); toast("লোডশেডিং! বাতি নিভে গেল। জানালার ধারে গেলে আলো পাবেন, নয়তো টর্চ জ্বালান।", 5200); }
          function ownerUpdate(dt) {
            var want = ENV.day < 0.5; var o = G.owner;
            if (o.mode === "home" && want !== G.sw) {
              o.mode = "go"; walkTo(owner, [[8.6, 5.7], [9.3, 5.3]], function () { o.mode = "flip"; o.t = 0.7; });
            } else if (o.mode === "flip") {
              o.t -= dt; owner.g.rotation.y = -Math.PI / 2; owner.aR.rotation.x = 1.2;
              if (o.t <= 0) { G.sw = want; swKnob.rotation.z = G.sw ? 0 : Math.PI; G.flick = G.sw ? 1.2 : 0; sfx.click(); owner.aR.rotation.x = 0; o.mode = "back";
                toast(G.sw ? "মালিক বাতি জ্বালালেন।" : "মালিক বাতি নিভিয়ে দিলেন।", 3200);
                walkTo(owner, [[8.6, 5.7], OWNER_HOME], function () { o.mode = "home"; place(owner, OWNER_HOME[0], OWNER_HOME[1], Math.PI); }); }
            }
          }
          function lampUpdate(dt) {
            var tgt = G.sw && !G.shed.on ? 1 : 0; G.lamp += (tgt - G.lamp) * Math.min(1, dt * 3.5); if (G.flick > 0) G.flick -= dt;
          }

          function personUpdate(p, dt) {
            p.t += dt;
            if (p.st === "walk") {
              var tg = p.path[0];
              if (!tg) { poseStand(p); var f = p.done; p.done = null; if (f) f(); return; }
              var dx = tg[0] - p.g.position.x, dz = tg[1] - p.g.position.z, d = Math.hypot(dx, dz);
              if (d < 0.12) { p.path.shift(); return; }
              var sp = p.speed * dt; p.g.position.x += dx / d * Math.min(sp, d); p.g.position.z += dz / d * Math.min(sp, d);
              var ty = Math.atan2(-dx, -dz); p.yaw += angDiff(p.yaw, ty) * Math.min(1, dt * 8); p.g.rotation.y = p.yaw;
              var sw = Math.sin(p.t * 7) * 0.6; p.lL.rotation.x = sw; p.lR.rotation.x = -sw; p.aL.rotation.x = -sw * 0.7; p.aR.rotation.x = sw * 0.7;
            } else if (p.st === "seat") {
              p.head.position.y = 1.62 + Math.sin(p.t * 0.9 + p.nextFlip) * 0.004;
              if (p.lookT > 0) { p.lookT -= dt; var ang = Math.atan2(-(P.x - p.g.position.x), -(P.z - p.g.position.z)); p.head.rotation.y = clamp(angDiff(p.yaw, ang), -1.2, 1.2); p.head.rotation.x = -0.05; }
              else { p.head.rotation.y *= 0.9; p.head.rotation.x = -0.4 + Math.sin(p.t * 0.6) * 0.04; }
              p.nextFlip -= dt; if (p.nextFlip <= 0) { p.nextFlip = rnd(5, 14); p.prop.rotation.z = 0.25; setTimeout(function () { p.prop.rotation.z = 0; }, 350); }
              p.leaveAt -= dt;
            } else if (p.st === "stand" && !p.browse) { p.lL.rotation.x = p.lR.rotation.x = 0; }
            else if (p.browse) { p.head.rotation.x = 0; p.up.rotation.y = Math.sin(p.t * 0.4) * 0.05; }
          }
          function popQueue() {
            var p = queue.shift(); if (!p) return; p.queued = false; G.queueTimer = 6.5;
            queue.forEach(function (q, i) { var s = qSlot(i); walkTo(q, [s]); });
            var fs = freeSeats(); var s = fs.length ? pick(fs) : null;
            if (!s) { walkTo(p, [[0, 9.3], [0, 14], [0, 16.8]], function () { p.gone = true; p.g.visible = false; }); return; }
            s.npc = p; walkTo(p, [[-3.2, 12], [0, 9.3], [0, 6.5]].concat(s.route, [[s.x, s.z]]), function () { poseSeat(p, s); });
          }
          function gameLogic(dt) {
            G.tick += dt;
            var speed = CFG.speed * (BK.mode === "open" ? 4 : 1);
            G.hour = (G.hour + dt * speed / 3600) % 24;
            envCalc(G.hour); ownerUpdate(dt); lampUpdate(dt);
            if (CFG.shed && G.ticket) {
              if (!G.shed.on) { G.shed.next -= dt; if (G.shed.next <= 0 && G.lamp > 0.9) startShed(); }
              else { G.shed.t += dt; if (G.shed.t >= G.shed.dur) endShed(); }
            }
            G.queueTimer -= dt;
            if (queue.length && G.queueTimer <= 0 && !(Math.hypot(P.x - QX, P.z - QZ) < 2.1 && !G.ticket && false)) {
              if (G.ticket || queue.length) { if (!G.ticket && !queue.length) {} else popQueue(); }
            }
            if (G.ticket) {
              G.arrive -= dt; if (G.arrive <= 0) { G.arrive = rnd(16, 32); if (queue.length < 3 && persons.length < 60) { var q = mkPerson(); place(q, 0.8, 15.7, Math.PI); q.queued = true; queue.push(q); walkTo(q, [qSlot(queue.length - 1)]); } }
              G.leaveCheck -= dt;
              if (G.leaveCheck <= 0) { G.leaveCheck = rnd(10, 22);
                var lv = seats.filter(function (s) { return s.npc && s.npc.st === "seat" && s.npc.leaveAt <= 0; })[0];
                if (lv) { var p = lv.npc; lv.npc = null; walkTo(p, [[lv.route[lv.route.length - 1][0], lv.route[lv.route.length - 1][1]], lv.route[0], [0, 6.5], [0, 9.3], [0, 14], [0, 16.8]], function () { p.gone = true; p.g.visible = false; }); } }
            }
            if (G.ticket) {
              LEND.out.forEach(function (o) { o.t -= dt; });
              if (!LEND.wait) { var due = LEND.out.filter(function (o) { return o.t <= 0; })[0]; if (due) spawnVisitor("return", due); else { LEND.next -= dt; if (LEND.next <= 0) spawnVisitor("borrow"); } }
            }
            binder.aL.rotation.x = BI.busy ? 0.9 + Math.sin(G.tick * 8) * 0.4 : 0; binder.aR.rotation.x = BI.busy ? 0.9 + Math.cos(G.tick * 8) * 0.4 : 0;
            /* gate */
            var gy = gateBar.position.y, gt = G.ticket ? 3.2 : 1.0; gateBar.position.y += (gt - gy) * Math.min(1, dt * 3); gateCol[4] = !G.ticket;
            persons.forEach(function (p) { if (!p.gone) personUpdate(p, dt); }); if (G.tick % 5 < dt) recycle();
          }

          var tmpMat = null;
          function step(dt) {
            if (!G.started) {
              if (!G.hour) G.hour = realHour(); envCalc(G.hour); G.lamp = G.sw && !G.shed.on ? 1 : 0; camera.position.set(0, 1.62, 14.8); camera.rotation.set(0, Math.sin(performance.now() / 4000) * 0.3, 0); applyEnv(); persons.forEach(function (p) { if (!p.gone) personUpdate(p, dt); }); return;
            }
            gameLogic(dt);
            /* movement */
            var mx = joy.x, my = joy.y;
            if (keys.w || keys.arrowup) my = -1; if (keys.s || keys.arrowdown) my = 1; if (keys.a) mx = -1; if (keys.d) mx = 1;
            moveMag = Math.min(1, Math.hypot(mx, my));
            if (tw) {
              tw.t += dt / tw.d; var u = sm(tw.t); P.x = lerp(tw.fx, tw.tx, u); P.z = lerp(tw.fz, tw.tz, u); P.y = lerp(tw.fy, tw.ty, u); P.yaw = tw.fyaw + angDiff(tw.fyaw, tw.tyaw) * u;
              if (tw.t >= 1) { var f = tw.done; tw = null; if (f) f(); }
            } else if (!G.seated && moveMag > 0.05) {
              var sp = 2.0 * moveMag * dt, fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
              var dx = (rx * mx + fx * -my) * sp, dz = (rz * mx + fz * -my) * sp;
              if (!hitAt(P.x + dx, P.z)) P.x += dx; if (!hitAt(P.x, P.z + dz)) P.z += dz;
              G.step = (G.step || 0) + sp; if (G.step > 0.78) { G.step = 0; sfx.step(); }
            }
            var bob = !G.seated && !tw && moveMag > 0.05 ? Math.sin(G.tick * 9) * 0.018 : 0;
            camera.position.set(P.x, P.y + bob, P.z); camera.rotation.order = "YXZ"; camera.rotation.set(P.pitch, P.yaw, 0);
            applyEnv(); updateBook(dt); audioUpdate(dt);
            /* action + hints */
            act = findAction(); var ab = $("act");
            if (act && act.label && !document.querySelector(".sheet.on")) { ab.style.display = "block"; if (ab.textContent !== act.label) ab.textContent = act.label; } else ab.style.display = "none";
            var L = readLevel(), hm = "";
            if (act && act.hint) hm = act.hint;
            else if (!G.ticket && !act) hm = P.z > 8.5 ? "টিকিট ঘরে যান, বাঁ দিকে কাউন্টার" : "";
            else if (G.seated && BK.mode === "open" && L < 0.2) hm = "আলো কম, পড়া যাচ্ছে না। টর্চ জ্বালান বা জানালার ধারে বসুন।";
            else if (G.seated && BK.mode === "open" && L < 0.4) hm = "আলো কমে এসেছে, পড়তে কষ্ট হচ্ছে।";
            hint(hm);
            $("vig").style.opacity = BK.mode === "open" ? String(clamp(0.9 - L * 1.1, 0, 0.85)) : String(clamp(0.5 - L, 0, 0.5) * 0.9);
            $("tm").textContent = fmtTime(G.hour); $("part").textContent = part(G.hour) + (G.shed.on ? " · লোডশেডিং" : "");
          }

          /* ---------- boot ---------- */
          var last = performance.now();
          function loop(now) { var dt = Math.min(0.05, (now - last) / 1000); last = now; try { step(dt); renderer.render(scene, camera); } catch (e) { if (!loop.err) { loop.err = 1; var s = $("stErr"); s.textContent = "ত্রুটি: " + e.message; } } requestAnimationFrame(loop); }
          window.addEventListener("resize", fit);
          $("stP").textContent = "এখন বাজে " + fmtTime(realHour()) + " (" + part(realHour()) + ")। পাঠাগারেও এই সময়টাই থাকবে।";
          $("go").onclick = function () {
            audioInit(); openSheet("start", false); G.started = true; G.t0 = performance.now(); G.hour = realHour(); G.sw = realHour() > 0 && sm((realHour() - RISE + 0.6) / 1.4) * sm((SET + 0.6 - realHour()) / 1.4) >= 0.5; G.lamp = G.sw ? 1 : 0; swKnob.rotation.z = G.sw ? 0 : Math.PI; G.state = "walk"; updHud();
            toast("ঢুকে পড়ুন। বাঁ দিকের কাউন্টারে টিকিট কাটতে হবে।", 4500);
            try { if (document.fonts && document.fonts.load) { document.fonts.load("30px 'Hind Siliguri'", "আ").then(function () { if (BK.book) { drawCover(BK.book); drawSpread(); } }); } } catch (e) {}
          };
          document.addEventListener("visibilitychange", function () { if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); } });
