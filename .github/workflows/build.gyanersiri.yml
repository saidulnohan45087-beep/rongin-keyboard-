name: Build Gyaner Singri APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Write app
        run: |
          mkdir -p www
          cat > www/index.html <<'GS_EOF'
          <!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>জ্ঞানের সিঁড়ি</title>
          <meta name="claude:viewport-fit-sides" content="cover">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap">
          <style>
          :root{
            /* Layout: single column quiz stage. Night-blue studio with light beams, gold-rimmed hexagon buttons, blue option plates. */
            --bg0:#060a24; --bg1:#0e1650; --panel:#0b1240; --line:#2a3a9a;
            --gold:#f5b82e; --gold2:#ffe08a; --blue:#38bdf8; --fg:#eef2ff; --muted:#9aa6d8;
            --ok:#16a34a; --bad:#dc2626; --warn:#f59e0b;
            --display:'Tiro Bangla','Hind Siliguri',Georgia,serif;
            --body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
            color-scheme:dark;
          }
          *{box-sizing:border-box}
          html{background:var(--bg0)}
          body{margin:0;min-height:100%;color:var(--fg);font:400 16px/1.55 var(--body);
            background:radial-gradient(ellipse at 50% -10%,#25349e 0%,var(--bg1) 45%,var(--bg0) 100%) fixed;
            padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
          body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
            background:
             conic-gradient(from 168deg at 18% -8%,rgba(150,185,255,.16) 0 14deg,transparent 14deg),
             conic-gradient(from 178deg at 82% -8%,rgba(150,185,255,.16) 0 14deg,transparent 14deg),
             conic-gradient(from 173deg at 50% -12%,rgba(255,224,138,.13) 0 14deg,transparent 14deg)}
          .app{position:relative;z-index:1;max-width:560px;margin:0 auto}
          h2{font:400 22px/1.3 var(--display);margin:6px 0 8px;color:var(--gold2)}
          p{margin:0 0 10px}
          .lead{color:var(--muted);font-size:15px}
          .small{font-size:13px;color:var(--muted)}
          button{font-family:inherit}
          button:focus-visible,label:focus-within,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
          .vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}

          /* hexagon plates */
          .hex{--cut:16px;display:block;width:100%;border:0;padding:2px;cursor:pointer;color:var(--fg);text-align:center;
            background:linear-gradient(var(--gold2),var(--gold) 50%,#a87a10);
            clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);touch-action:manipulation}
          .hex>span{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;min-height:54px;padding:8px 26px;
            background:linear-gradient(#2a7ae8,#0b3d9c 55%,#0a2f7a);
            clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%)}
          .hex b{font:600 19px/1.3 var(--body)}
          .hex small{font-size:12px;color:#cfe0ff}
          .hex.sel>span{background:linear-gradient(#ffb84a,#e07a00)}
          .hex.ok>span{background:linear-gradient(#34d27a,#0f8a45)}
          .hex.bad>span{background:linear-gradient(#ff6b6b,#b91c1c)}
          .hex[disabled]{cursor:default}
          .hex.dim{filter:grayscale(.75) brightness(.7)}
          .hex.gone{visibility:hidden}
          .menu{display:flex;flex-direction:column;gap:14px;margin:14px 0 18px}
          .logo{display:flex;justify-content:center;margin-top:8px}
          .logo svg{display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
          .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
          .btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#16227a;color:var(--fg);font:600 15px/1.2 var(--body);cursor:pointer;touch-action:manipulation}
          .btn.gold{background:linear-gradient(var(--gold2),var(--gold));border-color:var(--gold);color:#2a1d00}
          .btn.red{background:#7f1d1d;border-color:#b91c1c}
          .btn:disabled{opacity:.45;cursor:default}
          .btn.wide{width:100%}
          .back{background:none;border:0;color:var(--muted);font:500 15px var(--body);min-height:44px;padding:0;cursor:pointer}

          /* stats */
          .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
          .stat{border-top:2px solid var(--gold);padding-top:6px}
          .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
          .stat span{font-size:12px;color:var(--muted)}

          /* add */
          .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
          .seg button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer}
          .seg button.on{background:#16227a;color:var(--fg);border-color:var(--gold)}
          .drop{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;text-align:center;min-height:110px;padding:14px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;background:rgba(10,18,64,.5)}
          .drop b{font-size:17px;color:var(--gold2)}
          .drop span{font-size:13px;color:var(--muted)}
          .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
          .thumbs figure{position:relative;margin:0;width:72px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
          .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
          .thumbs button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;cursor:pointer;line-height:1}
          .field{display:flex;flex-direction:column;gap:4px;margin-top:14px}
          .field label{font-size:13px;color:var(--muted)}
          input[type=text],input[type=number],textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#0a1250;color:var(--fg);font:400 16px var(--body);padding:8px 12px}
          textarea{min-height:150px;resize:vertical}
          .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .warn{border:1px solid var(--warn);color:#ffd9a0;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
          .pbar{height:10px;border-radius:5px;background:#16227a;overflow:hidden;margin:12px 0}
          .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
          .glog{font-size:14px;color:var(--muted);max-height:160px;overflow:auto;margin:8px 0 14px}
          .glog p{margin:0 0 4px}

          /* bank */
          .src{border-bottom:1px solid var(--line);padding:12px 0}
          .src b{font-size:17px}
          .src details{margin-top:8px}
          .src summary{cursor:pointer;color:var(--gold2);font-size:14px;min-height:36px;display:flex;align-items:center}
          .qi{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
          .qi i{font-style:normal;color:var(--ok);font-weight:600}

          /* game */
          .gtop{display:flex;align-items:center;gap:12px}
          .badge{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 40% 30%,#2c4ad8,#0a1a70);display:flex;align-items:center;justify-content:center;font:700 24px var(--body);color:#fff}
          .gtop .info{min-width:0;flex:1}
          .gtop .info b{display:block;font-size:20px;color:var(--gold2);font-variant-numeric:tabular-nums}
          .gtop .info span{font-size:13px;color:var(--muted)}
          .iconbtn{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#101a66;color:var(--fg);cursor:pointer;font-size:14px;font-weight:600}
          .segs{display:flex;gap:3px;margin:12px 0 10px}
          .segs i{flex:1;height:7px;border-radius:2px;background:#1a2680}
          .segs i.done{background:var(--ok)} .segs i.cur{background:var(--gold)} .segs i.safe{box-shadow:0 0 0 1px var(--gold2) inset}
          .lives{display:flex;gap:12px;justify-content:center;margin:8px 0 14px}
          .life{position:relative;width:62px;height:52px;border-radius:26px;border:2px solid var(--gold);background:radial-gradient(circle at 40% 30%,#2c4ad8,#0a1a70);color:#fff;font:700 13px/1.1 var(--body);cursor:pointer;touch-action:manipulation}
          .life:disabled{opacity:.35;cursor:default}
          .life.used::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--bad);transform:rotate(-20deg)}
          .qbox{--cut:22px;margin-bottom:12px}
          .qbox>span{min-height:118px;padding:16px 30px}
          .qbox .tag{font-size:12px;color:var(--gold2);letter-spacing:.02em}
          .qbox .qt{font:500 19px/1.5 var(--body);text-wrap:balance}
          .opts{display:grid;grid-template-columns:1fr;gap:10px}
          @media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
          .opt>span{flex-direction:row;justify-content:flex-start;gap:12px;min-height:56px}
          .opt .lt{font-style:normal;color:var(--gold2);font-weight:700;flex:none}
          .opt em{font-style:normal;text-align:left;font-size:16px;line-height:1.35;flex:1;min-width:0}
          .opt .pc{flex:none;font-size:14px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:0 6px}
          .exp{margin-top:14px;border-left:4px solid var(--ok);background:rgba(10,18,64,.7);padding:10px 14px;border-radius:0 10px 10px 0}
          .exp.bad{border-left-color:var(--bad)}
          .exp b{display:block}
          .ladder{margin-top:14px}
          .ladder summary{cursor:pointer;color:var(--gold2);font-size:14px;min-height:40px;display:flex;align-items:center}
          .ladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse}
          .ladder li{display:flex;justify-content:space-between;padding:3px 10px;font-size:14px;font-variant-numeric:tabular-nums;border-radius:6px}
          .ladder li.cur{background:var(--gold);color:#2a1d00;font-weight:700}
          .ladder li.safe{color:var(--gold2)}
          .ladder li.done{color:#7be0a5}

          /* over */
          .prize{font:700 38px/1.2 var(--body);color:var(--gold2);text-align:center;margin:6px 0}
          .center{text-align:center}
          .rev{margin-top:14px}
          .rev summary{cursor:pointer;color:var(--gold2);min-height:44px;display:flex;align-items:center}
          .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a1250;border:1px solid var(--gold);color:var(--fg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;font-size:14px;text-align:center}
          @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
          </style>

          <div class="app" id="app"></div>

          <script>
          (function(){
          'use strict';
          var BN='০১২৩৪৫৬৭৮৯';
          function bn(n){return String(n).replace(/\d/g,function(d){return BN.charAt(+d);});}
          function money(n){var s=String(n),l=s.slice(-3),r=s.slice(0,-3);if(r)r=r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',';return '৳ '+bn(r+l);}
          function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
          function $(s){return document.querySelector(s);}
          function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
          function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
          var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
          var LET=['ক','খ','গ','ঘ'];
          var STANDALONE=!(window.claude&&window.claude.use),pushed=false;
          var PR=[500,1000,2000,5000,10000,20000,40000,80000,160000,320000,640000,1250000,2500000,5000000,10000000];

          var app=$('#app');
          var A={screen:'home',sources:LS.get('gs-src',[]),stats:LS.get('gs-stats',null),sample:null,limits:null};
          if(!A.stats)A.stats={played:0,best:0,right:0,asked:0,days:[]};
          var AD={tab:'img',imgs:[],pdf:null,pdfName:'',pages:0,from:1,to:1,text:'',title:'',stage:'form',log:[],cnt:0,pct:0,msg:'',ctl:null,stop:false,newId:null};
          var G=null, col=null, wq=Promise.resolve(), mute=LS.get('gs-mute',false), AC=null;

          /* ---------- storage ---------- */
          function persistLocal(){LS.set('gs-src',A.sources);LS.set('gs-stats',A.stats);}
          function putDoc(id,data){if(!col)return;wq=wq.then(function(){return col.doc(id).set(data);}).catch(function(){});}
          function saveSource(s){persistLocal();putDoc('s_'+s.id,s);}
          function saveStats(){persistLocal();putDoc('stats',A.stats);}
          function delSource(id){A.sources=A.sources.filter(function(s){return s.id!==id;});persistLocal();
            if(col)wq=wq.then(function(){return col.doc('s_'+id).delete();}).catch(function(){});}
          function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
          async function initCloud(){
            try{
              if(!window.claude||!window.claude.use)return;
              var r=await Promise.all([claude.use('db'),claude.use('user')]),db=r[0],user=r[1];
              if(!db||!user)return;
              var id=await user.id();if(!id)return;
              col=db.collection('data/users/'+id);
              var snap=await withTimeout(col.get(),10000),srcs=[],st=null;
              snap.docs.forEach(function(d){var x=d.data();if(!x)return;if(d.id==='stats')st=x;else if(d.id.indexOf('s_')===0&&x.qs)srcs.push(x);});
              if(srcs.length||st){
                A.sources=srcs.sort(function(a,b){return (b.created||0)-(a.created||0);});
                if(st){A.stats={played:st.played||0,best:st.best||0,right:st.right||0,asked:st.asked||0,days:st.days||[]};}
                persistLocal();
              }else if(A.sources.length){A.sources.forEach(function(s){putDoc('s_'+s.id,s);});putDoc('stats',A.stats);}
              if(A.screen==='home'||A.screen==='bank')render();
            }catch(e){col=null;}
          }
          /* standalone (APK) mode: no Claude runtime, so the page calls the Anthropic API with a key the user saves on the phone */
          function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=function(){rej(new Error('read'));};r.readAsDataURL(blob);});}
          function apiErr(code,msg){return {code:code,message:msg||code};}
          function parseJson(t){
            try{return JSON.parse(t);}catch(e){}
            var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}
            var a=t.indexOf('['),z=t.lastIndexOf(']');if(a>=0&&z>a){try{return JSON.parse(t.slice(a,z+1));}catch(e){}}
            throw apiErr('invalid_json');
          }
          function apiSample(key){
            var f=function(){return Promise.reject(apiErr('invalid_request'));};
            f.limits=function(){return Promise.resolve({maxPromptBytes:262144,images:{maxCount:4,maxInputBytes:20000000,mediaTypes:['image/jpeg','image/png','image/webp']}});};
            f.json=async function(prompt,opts){
              opts=opts||{};
              var content=[],i;
              if(opts.images){for(i=0;i<opts.images.length;i++){var b=opts.images[i];content.push({type:'image',source:{type:'base64',media_type:(b.type&&b.type.indexOf('image/')===0)?b.type:'image/jpeg',data:await b64(b)}});}}
              content.push({type:'text',text:prompt});
              var res;
              try{
                res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,
                  headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
                  body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:6000,messages:[{role:'user',content:content}]})});
              }catch(e){throw apiErr(e&&e.name==='AbortError'?'cancelled':'upstream_error');}
              if(!res.ok){
                var j=null;try{j=await res.json();}catch(e){}
                var em=String(j&&j.error&&j.error.message||'').toLowerCase();
                var c=res.status===401||res.status===403?'not_granted':res.status===429?'rate_limited':
                  (res.status===400&&em.indexOf('credit')>=0)?'no_credit':(res.status===400||res.status===413)?'image_rejected':'upstream_error';
                throw apiErr(c,String(res.status));
              }
              var data=await res.json(),txt=(data.content||[]).map(function(x){return x.text||'';}).join('');
              return parseJson(txt);
            };
            return f;
          }
          function setupKey(){
            var k=LS.get('gs-key','');
            if(k){A.sample=apiSample(k);A.limits={images:{maxCount:4}};}else{A.sample=null;}
          }
          async function initSample(){
            try{
              if(window.claude&&window.claude.use){
                A.sample=await claude.use('sample');
                if(A.sample){try{A.limits=await A.sample.limits();}catch(e){A.limits=null;}}
              }else setupKey();
              if(A.screen==='add')render();
            }catch(e){}
          }

          /* ---------- sound ---------- */
          function tone(f,d,type,at,vol){
            try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
              var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(at||0);
              o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
              o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
          }
          function sfx(k){
            if(mute)return;
            if(k==='click')tone(520,0.06,'triangle');
            else if(k==='ok'){tone(660,0.14,'sine');tone(880,0.28,'sine',0.13);}
            else if(k==='bad'){tone(180,0.5,'sawtooth',0,0.1);}
            else if(k==='win'){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'sine',i*0.14);});}
          }

          /* ---------- helpers ---------- */
          function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
          function totalQ(){var n=0;A.sources.forEach(function(s){n+=s.qs.length;});return n;}
          function streak(){
            var set={};A.stats.days.forEach(function(d){set[d]=1;});
            var d=new Date(),n=0;
            if(!set[dayKey(d)])d.setDate(d.getDate()-1);
            while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
            return n;
          }
          function hexbtn(act,label,sub,dis,extra){
            return '<button class="hex'+(dis?' dim':'')+(extra?' '+extra:'')+'" data-act="'+act+'"'+(dis?' disabled':'')+'><span><b>'+label+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span></button>';
          }
          function go(s){
            var prev=A.screen;A.screen=s;
            if(STANDALONE){
              if(s!=='home'&&prev==='home'){try{history.pushState({},'');pushed=true;}catch(e){}}
              else if(s==='home'&&pushed){pushed=false;try{history.back();}catch(e){}}
            }
            render();window.scrollTo(0,0);
          }
          var LOGO='<svg viewBox="0 0 200 200" width="176" height="176" aria-hidden="true"><defs><radialGradient id="lg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#3b4fd0"/><stop offset="1" stop-color="#0a1250"/></radialGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs>'
           +'<circle cx="100" cy="100" r="95" fill="url(#gd)"/><circle cx="100" cy="100" r="87" fill="url(#lg)"/><circle cx="100" cy="100" r="76" fill="none" stroke="#f5b82e" stroke-width="1.4" stroke-dasharray="2 6"/>'
           +'<text x="100" y="88" text-anchor="middle" font-family="Tiro Bangla,Hind Siliguri,serif" font-size="30" fill="#ffe08a">জ্ঞানের</text>'
           +'<text x="100" y="124" text-anchor="middle" font-family="Tiro Bangla,Hind Siliguri,serif" font-size="36" fill="#ffffff">সিঁড়ি</text>'
           +'<path d="M58 152h20v-9h20v-9h20v-9h20v-9" stroke="#f5b82e" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

          /* ---------- views: home / bank ---------- */
          function viewHome(){
            var n=totalQ(),st=A.stats,played=st.days.indexOf(dayKey())>=0,sk=streak();
