              namespace = "com.rongin.banglakb"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rongin.banglakb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }

              signingConfigs {
                  create("rongin") {
                      storeFile = file("rongin.jks")
                      storePassword = "rongin123"
                      keyAlias = "rongin"
                      keyPassword = "rongin123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("rongin")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("rongin")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
