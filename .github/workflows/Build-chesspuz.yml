            else right='<span class="cnt" style="font-size:14px;color:var(--accent)">বিশ্লেষণ<small>ট্যাপ করো</small></span>';
            h+='<button class="game" data-g="'+g.id+'"><span class="dot '+g.out+'">'+OUT[g.out]+'</span><span class="g-t">'+(g.color==='w'?'⚪':'⚫')+' vs '+esc(g.opp)+' ('+bn(g.rat||'?')+')</span>'+right+'<span class="g-s">'+esc(g.tc)+' · '+bn(movesOf(g))+' চাল · '+g.date+(g.an&&g.pz.length?' · মিস '+bn(miss):'')+'</span></button>'});
