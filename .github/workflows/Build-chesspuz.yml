           $('#go').onclick=function(){S.q=[];g.pz.forEach(function(p,i){if(p.th.some(function(t){return S.sel[t]}))S.q.push(i)});S.qi=0;S.ok=0;S.fail=0;S.view='play';render()}
          }
          /* board */
          function boardHTML(pos,o){
           var h='<div class="board" id="bd">';
           for(var r=0;r<8;r++)for(var f=0;f<8;f++){
            var rank=o.flip?r:7-r,file=o.flip?7-f:f,sq=rank*8+file,p=pos?pos.b[sq]:0;
            var cls='sq'+(((rank+file)&1)?'':' d');
