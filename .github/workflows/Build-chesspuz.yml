           h+='<div class="seg" id="sm"><button data-m="find" class="'+(o.mode==='find'?'on':'')+'">নাম দেখে ঘর খোঁজো</button><button data-m="name" class="'+(o.mode==='name'?'on':'')+'">ঘর দেখে নাম বলো</button></div>';
           h+='<div class="seg" id="so"><button data-o="w" class="'+(o.orient==='w'?'on':'')+'">সাদার দিক</button><button data-o="b" class="'+(o.orient==='b'?'on':'')+'">কালোর দিক</button><button data-o="r" class="'+(o.orient==='r'?'on':'')+'">এলোমেলো</button></div>';
           h+='<div class="seg" id="sd"><button data-d="30" class="'+(o.dur===30?'on':'')+'">৩০ সেকেন্ড</button><button data-d="60" class="'+(o.dur===60?'on':'')+'">৬০ সেকেন্ড</button></div>';
           h+='<div id="vbody"></div>';$('#main').innerHTML=h;
