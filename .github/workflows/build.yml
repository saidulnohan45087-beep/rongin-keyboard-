          package com.rongin.banglakb

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.SoundPool
          import java.io.File

          /** Small settings stored on the phone. */
          object Prefs {
              private const val PREFS = "kb"

              private fun p(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun soundStyle(ctx: Context): String = p(ctx).getString("sound", "ios") ?: "ios"

              fun setSoundStyle(ctx: Context, id: String) {
                  p(ctx).edit().putString("sound", id).apply()
              }

              fun volume(ctx: Context): Int = p(ctx).getInt("volume", 60).coerceIn(0, 100)

              fun setVolume(ctx: Context, v: Int) {
                  p(ctx).edit().putInt("volume", v.coerceIn(0, 100)).apply()
              }

              /** Height of one key row in dp. The old fixed value was 50. */
              fun keyHeight(ctx: Context): Int = p(ctx).getInt("keyh", 56).coerceIn(44, 80)

              fun setKeyHeight(ctx: Context, dp: Int) {
                  p(ctx).edit().putInt("keyh", dp.coerceIn(44, 80)).apply()
              }

              fun haptic(ctx: Context): Boolean = p(ctx).getBoolean("haptic", true)

              fun setHaptic(ctx: Context, on: Boolean) {
                  p(ctx).edit().putBoolean("haptic", on).apply()
              }
          }

          /** Plays the key sound of the chosen style with very low delay. */
          class SoundEngine(private val ctx: Context) {
              private var pool: SoundPool? = null
              private val ids = HashMap<Variant, Int>()
              private val ready = java.util.Collections.synchronizedSet(HashSet<Int>())
              private var loadedStyle: String? = null
              private val rnd = java.util.Random()

              private fun wavFile(style: String, v: Variant): File {
                  val dir = File(ctx.filesDir, "snd1")
                  dir.mkdirs()
                  val f = File(dir, style + "_" + v.name.lowercase() + ".wav")
                  if (!f.exists() || f.length() == 0L) {
                      f.writeBytes(Synth.wav(Synth.render(style, v)))
                  }
                  return f
              }

              /** Loads the sounds of the style chosen in settings. Cheap if nothing changed. */
              fun prepare() {
                  val style = Prefs.soundStyle(ctx)
                  if (style == loadedStyle) return
                  release()
                  loadedStyle = style
                  if (style == "off") return
                  try {
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      val p = SoundPool.Builder().setMaxStreams(6).setAudioAttributes(attrs).build()
                      p.setOnLoadCompleteListener { _, sampleId, status ->
                          if (status == 0) ready.add(sampleId)
                      }
                      Variant.values().forEach { v ->
                          ids[v] = p.load(wavFile(style, v).absolutePath, 1)
                      }
                      pool = p
                  } catch (e: Exception) {
                      pool = null
                  }
              }

              fun play(v: Variant) {
                  val p = pool ?: return
                  val id = ids[v] ?: return
                  if (!ready.contains(id)) return
                  val vol = Prefs.volume(ctx) / 100f
                  // A tiny random pitch change keeps repeated keys from sounding robotic.
                  p.play(id, vol, vol, 1, 0, 0.97f + rnd.nextFloat() * 0.06f)
              }

              fun release() {
                  pool?.release()
                  pool = null
                  ids.clear()
                  ready.clear()
                  loadedStyle = null
              }
          }
