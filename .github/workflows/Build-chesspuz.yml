            if(P.idx>=P.p.sol.length||mate){finish()}else{P.busy=true;msg('ঠিক! প্রতিপক্ষ উত্তর দিচ্ছে…','good');setTimeout(function(){var o=pos.parse(P.p.sol[P.idx]);pos.make(o);P.last=[o&63,(o>>6)&63];P.idx++;P.busy=false;redraw();msg('এবার তোমার পরের চাল।')},550)}}
           else{pos.unmake();P.fail=true;redraw();var b=$('#bd');b.classList.add('shake');setTimeout(function(){b.classList.remove('shake')},320);msg('এটা সেরা চাল নয়। আবার চেষ্টা করো।','bad')}
          }
          function finish(){
           P.done=true;var ok=!P.fail;if(!P.rec){P.rec=1;if(ok)S.ok++;else S.fail++;P.p.th.forEach(function(t){var s=score[t]||(score[t]={ok:0,total:0});s.total++;if(ok)s.ok++});lsSet('cp-score',score)}
           msg(ok?'দারুণ! পাজল সমাধান হয়েছে।':'পাজলটা শেষ হলো (সাহায্য নিয়েছ বা ভুল করেছ, তাই স্কোরে ধরা হয়নি)।',ok?'good':'');
           var n=$('#nx');n.disabled=false;n.textContent=S.qi+1>=S.q.length?'ফলাফল':'পরেরটা'}
          function showSol(){
           if(P.done||P.busy)return;P.fail=true;P.busy=true;
