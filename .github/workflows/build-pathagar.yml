name: Build Pathagar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pathagar.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p pathagar-app/app
          cat > pathagar-app/app/build.gradle.kts <<'PATH_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pathagar.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pathagar.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          PATH_EOF
          mkdir -p pathagar-app/app/src/main
          cat > pathagar-app/app/src/main/AndroidManifest.xml <<'PATH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:screenOrientation="unspecified"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PATH_EOF
          mkdir -p pathagar-app/app/src/main/assets
          cat > pathagar-app/app/src/main/assets/index.html <<'PATH_EOF'
          <!doctype html>
          <html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
          <title>পাঠাগারের ভেতরে</title>
          <meta name="claude:viewport-fit-sides" content="cover">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
          <style>
          /* Layout: full-screen first-person view; HUD pinned to the edges, one contextual action button bottom-right, virtual stick bottom-left. */
          :root{
            --bg:#0c0907; --ink:#f4e7c9; --dim:#b9a98a; --amber:#e3a548; --amber-ink:#1d1206;
            --panel:rgba(22,15,10,.86); --line:rgba(244,231,201,.2); --ok:#9bd68f; --warn:#f08a5d;
            --f-display:'Tiro Bangla','Hind Siliguri',serif; --f-body:'Hind Siliguri',system-ui,sans-serif;
            color-scheme:dark;
          }
          html,body{height:100%}
          body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;position:fixed;inset:0;width:100%;
            -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
          #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
          .hud{position:fixed;z-index:5;pointer-events:none}
          #top{left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
            padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
          .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.25;backdrop-filter:blur(4px)}
          #clock b{font-family:var(--f-display);font-size:22px;font-weight:400;display:block;font-variant-numeric:tabular-nums}
          #clock span{color:var(--dim);font-size:12px}
          #chips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
          #chips .pill{font-size:12.5px}
          button{font:inherit;color:inherit;cursor:pointer}
          #gear{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
          #toast{left:50%;transform:translateX(-50%);top:calc(86px + env(safe-area-inset-top,0px));max-width:min(88vw,420px);text-align:center;
            background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:15px;opacity:0;transition:opacity .35s}
          #toast.on{opacity:1}
          #hint{left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:min(86vw,380px);text-align:center;
            font-size:14px;color:var(--ink);text-shadow:0 1px 6px #000,0 0 3px #000;opacity:0;transition:opacity .3s}
          #hint.on{opacity:1}
          #vig{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s;
            background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 28%,rgba(0,0,0,.88) 100%)}
          #stick{position:fixed;z-index:6;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
            width:120px;height:120px;border-radius:50%;background:rgba(244,231,201,.08);border:1.5px solid var(--line);touch-action:none}
          #stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(244,231,201,.28);border:1.5px solid var(--line)}
          #act{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));
            min-width:128px;max-width:46vw;padding:15px 18px;border-radius:30px;border:0;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:16px;
            box-shadow:0 4px 18px rgba(0,0,0,.5);display:none}
          #act:active{transform:scale(.97)}
          #readbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:8px}
          #readbar button{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 14px;font-size:14px}
          #readbar button:disabled{opacity:.35}
          #readbar button.on{background:var(--amber);color:var(--amber-ink)}
          .sheet{position:fixed;inset:0;z-index:20;background:rgba(8,5,3,.78);display:none;align-items:center;justify-content:center;
            padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
          .sheet.on{display:flex}
          .card{background:#1c140e;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(100%,460px);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
          .card h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
          .card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 10px}
          .card p{margin:0 0 12px;color:var(--dim);font-size:15px;line-height:1.55}
          .big{width:100%;padding:14px;border-radius:14px;border:0;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:17px;margin-top:6px}
          .ghost{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:transparent;font-size:15px;margin-top:8px}
          .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
          .row small{display:block;color:var(--dim);font-size:12px}
          .row input[type=range],.row select{width:150px;accent-color:var(--amber);background:#2a1f16;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px;font:inherit}
          .tg{width:48px;height:28px;border-radius:14px;background:#3a2d20;border:1px solid var(--line);position:relative;flex:none;padding:0}
          .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .2s}
          .tg.on{background:var(--amber)}.tg.on::after{left:23px;background:var(--amber-ink)}
          .item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#251a12;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
          .item i{width:30px;height:42px;border-radius:3px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.3)}
          .item b{display:block;font-weight:600;font-size:16px}.item span{color:var(--dim);font-size:13px}
          .txt{width:100%;background:#2a1f16;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:4px 0 8px;-webkit-user-select:text;user-select:text}
          .prog{height:10px;border-radius:5px;background:#2a1f16;border:1px solid var(--line);overflow:hidden;margin:10px 0}
          .prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
          .stars{color:var(--amber);font-size:20px;letter-spacing:2px}
          .err{color:var(--warn)}
          </style>

          <canvas id="c"></canvas>
          <div id="vig"></div>
          <div id="top" class="hud">
            <div class="pill" id="clock"><b id="tm">০০:০০</b><span id="part"></span></div>
            <div id="chips"><div class="pill" id="money"></div><div class="pill" id="tk" hidden></div><div class="pill" id="rd" hidden></div><div class="pill" id="fn" hidden style="color:var(--warn)"></div>
              <button id="gear" style="pointer-events:auto">সেটিংস</button></div>
          </div>
          <div id="toast" class="hud"></div>
          <div id="hint" class="hud"></div>
          <div id="stick"><i></i></div>
          <button id="act"></button>
          <div id="readbar">
            <button id="bPrev">◀</button><button id="bTorch">টর্চ</button><button id="bOpen">বই খুলুন</button><button id="bNext">▶</button>
          </div>

          <div class="sheet on" id="start"><div class="card">
            <h1>পাঠাগারের ভেতরে</h1>
            <p id="stP">আপনি যে সময়ে ঢুকবেন, লাইব্রেরিতেও সেই সময়টাই থাকবে।</p>
            <p>টিকিট কাটুন, বই বেছে জানালার ধারে বা মাঝখানের টেবিলে বসুন। পড়তে পড়তে রাত নামবে, মালিক বাতি জ্বালাবেন, কখনো কারেন্ট যাবে।</p>
            <p style="font-size:13px">বাঁ দিকের গোল বোতামে হাঁটুন, বাকি পর্দা টেনে চারদিকে তাকান। কিবোর্ডে WASD ও মাউস টানা চলবে।</p>
            <button class="big" id="go">ভেতরে ঢুকি</button>
            <button class="ghost" id="pdfBtn1">ফোনের পিডিএফ বই যুক্ত করুন</button>
            <p id="stErr" class="err" style="margin:10px 0 0"></p>
          </div></div>

          <div class="sheet" id="picker"><div class="card">
            <h2 id="pkT">বই বাছুন</h2><div id="pkL"></div>
            <button class="ghost" id="pkAdd" hidden>ফোন থেকে পিডিএফ যুক্ত করুন</button>
            <button class="ghost" id="pkX">থাক</button>
          </div></div>

          <div class="sheet" id="settings"><div class="card">
            <h2>সেটিংস</h2>
            <div class="row"><div>ফিসফিসের শব্দ<small>আশপাশের পাঠকদের কথা</small></div><button class="tg" data-k="whisper"></button></div>
            <div class="row"><div>খসখস শব্দ<small>কাগজ ও কাপড়ের</small></div><button class="tg" data-k="rustle"></button></div>
            <div class="row"><div>ঝিঁঝিঁ পোকা<small>শুধু রাতে</small></div><button class="tg" data-k="cricket"></button></div>
            <div class="row"><div>পায়ের শব্দ</div><button class="tg" data-k="steps"></button></div>
            <div class="row"><div>মোট আওয়াজ</div><input type="range" id="sVol" min="0" max="100"></div>
            <div class="row"><div>লোডশেডিং হবে<small>মাঝে মাঝে কারেন্ট যাবে</small></div><button class="tg" data-k="shed"></button></div>
            <div class="row"><div>সময়ের গতি</div><select id="sSpeed"><option value="1">১× (আসল)</option><option value="20">২০×</option><option value="60">৬০×</option><option value="150">১৫০×</option></select></div>
            <div class="row"><div>ঘড়ি ঠিক করুন<small>দিন-রাত দেখতে</small></div><input type="range" id="sClock" min="0" max="239"></div>
            <div class="row"><div>তাকানোর গতি</div><input type="range" id="sSens" min="30" max="200"></div>
            <div class="row"><div>পরিষ্কার ছবি<small>ফোন গরম হলে বন্ধ রাখুন</small></div><button class="tg" data-k="hq"></button></div>
            <button class="ghost" id="pdfBtn2">ফোনের পিডিএফ বই যুক্ত করুন</button>
            <button class="big" id="sX">ঠিক আছে</button>
          </div></div>

          <div class="sheet" id="bye"><div class="card">
            <h2>বাইরে এলেন</h2><p id="byeP"></p>
            <button class="big" id="again">আবার ঢুকি</button>
          </div></div>

          <div class="sheet" id="bind"><div class="card">
            <h2>মাঙ্গা বাঁধাই ঘর</h2>
            <p>বাঁধাইকর: “অধ্যায়গুলো দিন, জুড়ে বই বানিয়ে দেব। প্রতি অধ্যায় ২ টাকা।”</p>
            <input class="txt" id="bName" value="আমার মাঙ্গা" maxlength="40">
            <button class="ghost" id="bPick">অধ্যায়ের পিডিএফ বাছুন (একসাথে অনেকগুলো)</button>
            <button class="ghost" id="bSample">নমুনা: চেইনসম্যান, ২৩২ অধ্যায়</button>
            <p id="bInfo" style="margin-top:10px"></p>
            <div class="row"><div>বই কেমন হবে</div><select id="bMode"><option value="one">একটাই বড় বই</option><option value="vol">খণ্ডে ভাগ</option></select></div>
            <div class="row" id="bVolRow" style="display:none"><div>প্রতি খণ্ডে অধ্যায়</div><input class="txt" type="number" id="bVol" value="30" min="5" max="100" style="width:90px;margin:0"></div>
            <div class="prog"><i id="bBar"></i></div>
            <button class="big" id="bGo">বাঁধাই শুরু করুন</button>
            <button class="ghost" id="bX">বন্ধ</button>
          </div></div>
          <div class="sheet" id="lend"><div class="card"><h2 id="ldT"></h2><p id="ldP"></p><div id="ldL"></div><button class="ghost" id="ldX">পরে</button></div></div>
          <input type="file" id="chIn" accept="application/pdf,.pdf" multiple hidden>
          <input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden>

          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
          <script>
          (function () {
          "use strict";
          var $ = function (id) { return document.getElementById(id); };
          var bn = function (n) { return String(n).replace(/\d/g, function (d) { return "০১২৩৪৫৬৭৮৯"[d]; }); };
          function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
          function sm(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
          function lerp(a, b, t) { return a + (b - a) * t; }
          function rnd(a, b) { return a + Math.random() * (b - a); }
          function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
          function hash(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
          function angDiff(a, b) { var d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

          if (!window.THREE) { $("stErr").textContent = "থ্রিডি লাইব্রেরি লোড হয়নি। ইন্টারনেট দেখে পাতাটা আবার খুলুন।"; $("go").disabled = true; return; }

          /* ---------- settings ---------- */
          var CFG = { whisper: true, rustle: true, cricket: true, steps: true, shed: true, hq: false, vol: 70, speed: 20, sens: 100 };
          try { var sv = JSON.parse(localStorage.getItem("pf_cfg") || "{}"); for (var k in sv) CFG[k] = sv[k]; } catch (e) {}
          function saveCfg() { try { localStorage.setItem("pf_cfg", JSON.stringify(CFG)); } catch (e) {} }

          /* ---------- renderer / scene ---------- */
          var cv = $("c");
          var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
          function fit() {
            var pr = Math.min(window.devicePixelRatio || 1, CFG.hq ? 2 : 1.25);
            renderer.setPixelRatio(pr);
            renderer.setSize(window.innerWidth, window.innerHeight, false);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            if (BK.ready) layoutBook();
          }
          var scene = new THREE.Scene();
          var camera = new THREE.PerspectiveCamera(70, 1, 0.05, 420);
          scene.add(camera);
          scene.fog = new THREE.Fog(0x101a34, 60, 300);

          var UB = new THREE.BoxGeometry(1, 1, 1);
          function L(c, o) { var p = { color: c }; if (o) for (var k in o) p[k] = o[k]; return new THREE.MeshLambertMaterial(p); }
          function B(c, o) { var p = { color: c }; if (o) for (var k in o) p[k] = o[k]; return new THREE.MeshBasicMaterial(p); }
          function bx(w, h, d, mat, x, y, z, par) { var m = new THREE.Mesh(UB, mat); m.scale.set(w, h, d); m.position.set(x, y, z); (par || scene).add(m); return m; }
          function ctex(w, h, fn) { var c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d"), c); var t = new THREE.CanvasTexture(c); return t; }

          /* sky */
          var skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false, fog: false,
            uniforms: { top: { value: new THREE.Color(0x3f86d6) }, hor: { value: new THREE.Color(0xa8cfee) } },
            vertexShader: "varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
            fragmentShader: "uniform vec3 top; uniform vec3 hor; varying vec3 vD; void main(){ float h=clamp(vD.y,0.0,1.0); gl_FragColor=vec4(mix(hor,top,pow(h,0.55)),1.0); }"
          });
          var sky = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 14), skyMat); sky.renderOrder = -10; scene.add(sky);
          var stars = (function () {
            var n = 420, a = new Float32Array(n * 3);
            for (var i = 0; i < n; i++) { var u = Math.random() * Math.PI * 2, v = Math.random() * 1.35 + 0.08, r = 285; a[i * 3] = Math.cos(u) * Math.cos(v) * r; a[i * 3 + 1] = Math.sin(v) * r; a[i * 3 + 2] = Math.sin(u) * Math.cos(v) * r; }
            var g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(a, 3));
            var m = new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
            var p = new THREE.Points(g, m); scene.add(p); return p;
          })();
          function glowTex(inner, outer) {
            return ctex(128, 128, function (x) { var g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, inner); g.addColorStop(0.25, inner); g.addColorStop(0.27, outer); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128); });
