      - name: Build keyboard APK
        run: gradle assembleDebug --no-daemon
      - name: Build calculator APK
        run: gradle -p calc assembleDebug --no-daemon
      - name: Keep APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            calc/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APKs to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rongin-bangla-keyboard.apk
          cp calc/app/build/outputs/apk/debug/app-debug.apk anime-calculator.apk
          gh release create "v${{ github.run_number }}" rongin-bangla-keyboard.apk anime-calculator.apk --repo "${{ github.repository }}" --title "Apps v${{ github.run_number }}" --notes "rongin-bangla-keyboard.apk = keyboard, anime-calculator.apk = anime calculator. Install the one you want."
