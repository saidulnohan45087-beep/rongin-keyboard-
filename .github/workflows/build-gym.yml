          var animP=1;
          function crackPaths(im,diag,w,h,p){
            var r=rng(im.seed),X=im.x*w,Y=im.y*h,L=diag*(0.055+0.02*Math.min(S.hits,MAXHIT));
            var nr=7+(r()*5|0),a0=r()*6.283,rays=[],paths=[],i,j;
            for(i=0;i<nr;i++){
              var a=a0+i/nr*6.283+(r()-.5)*.4,len=L*(.55+r()*.9)*p,pts=[[X,Y]],x=X,y=Y,ang=a,st=9;
              for(j=0;j<st;j++){ang+=(r()-.5)*.35;x+=Math.cos(ang)*len/st;y+=Math.sin(ang)*len/st;pts.push([x,y])}
