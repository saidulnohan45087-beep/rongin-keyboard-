           return h}
          function bindAsk(){var q=$('#q');if(q)q.oninput=function(){S.q=q.value;var e=document.querySelectorAll('.ex');if(S.q.trim()&&e.length){render()}};
           var g=$('#go');if(g)g.onclick=ask;var gs=$('#gs');if(gs)gs.onclick=function(e){e.preventDefault();S.tab='set';render()};
