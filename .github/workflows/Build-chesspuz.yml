name: Build Chess Puzzle APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-chesspuz.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p chesspuz-app
          mkdir -p chesspuz-app/app
          cat > chesspuz-app/app/build.gradle.kts <<'PATH_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.chesspuz.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.chesspuz.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          PATH_EOF
          mkdir -p chesspuz-app/app/src/main
          cat > chesspuz-app/app/src/main/AndroidManifest.xml <<'PATH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PATH_EOF
          mkdir -p chesspuz-app/app/src/main/assets
          cat > chesspuz-app/app/src/main/assets/index.html <<'PATH_EOF'
          <!doctype html>
          <html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
          <title>দাবা পাজল</title>
          <meta name="claude:viewport-fit-sides" content="cover">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
          <style>
          /* Layout: one-column phone app, top tabs (খেলা / ভিশন), full-width board, sticky action bar */
          :root{--bg:#f3f1ec;--panel:#fffefb;--line:#ddd8cc;--fg:#1d2320;--mute:#6b726c;--accent:#2f6b4f;--accent-fg:#fff;--bsq-l:#ecdfc0;--bsq-d:#7d9a6e;--good:#2e8b57;--bad:#c0452f;--warn:#b7791f;--sel:#f2c94c99;--hint:#4f8fd9aa;
          --f-body:'Hind Siliguri',system-ui,-apple-system,'Noto Sans Bengali',sans-serif;--f-num:'Space Grotesk','Hind Siliguri',system-ui,sans-serif}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--panel:#1c231f;--line:#2e3832;--fg:#e8ece7;--mute:#92a098;--accent:#6fcf9b;--accent-fg:#0f1a14;--bsq-l:#d9ccaa;--bsq-d:#6c8860;--good:#5cc98a;--bad:#ef7a64;--warn:#e0b04c;color-scheme:dark}}
          :root[data-theme="dark"]{--bg:#141916;--panel:#1c231f;--line:#2e3832;--fg:#e8ece7;--mute:#92a098;--accent:#6fcf9b;--accent-fg:#0f1a14;--bsq-l:#d9ccaa;--bsq-d:#6c8860;--good:#5cc98a;--bad:#ef7a64;--warn:#e0b04c;color-scheme:dark}
          *{box-sizing:border-box}
          body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
          .app{max-width:520px;margin:0 auto}
          button{font:inherit;color:inherit;cursor:pointer}
          button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
          header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;gap:12px}
          h1{font-size:21px;margin:0;font-weight:700}
          .user{font-family:var(--f-num);font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 11px;white-space:nowrap}
          .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
          .tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--mute)}
          .tabs button.on{background:var(--accent);color:var(--accent-fg)}
          .note{font-size:12.5px;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin-bottom:12px}
          .sync{display:flex;gap:8px;margin-bottom:12px}
          .sync input{flex:1;min-width:0;font:inherit;font-family:var(--f-num);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
          .btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 15px;font-weight:600}
          .btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
          .btn[disabled]{opacity:.45;cursor:default}
          .list{display:flex;flex-direction:column;gap:8px}
          .game{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
          .dot{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
          .dot.win{background:var(--good)}.dot.loss{background:var(--bad)}.dot.draw{background:var(--mute)}
          .g-t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .g-s{font-size:12.5px;color:var(--mute);grid-column:2}
          .cnt{grid-row:span 2;text-align:right;font-family:var(--f-num);font-weight:700;font-size:19px;line-height:1.1}
          .cnt small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--mute)}
          .back{background:none;border:0;color:var(--mute);padding:4px 0;font-weight:600;margin-bottom:6px}
          h2{font-size:18px;margin:2px 0 2px}
          .sub{color:var(--mute);font-size:13px;margin-bottom:10px}
          .th-head,.th{display:grid;grid-template-columns:28px 1fr 44px 64px;gap:8px;align-items:center;padding:10px 12px}
          .th-head{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding-block:0 6px}
          .th-head span:nth-child(n+3),.th .n,.th .s{text-align:right}
          .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
          .th{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left}
          .th:first-child{border-top:0}
          .ck{width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--accent-fg)}
          .on .ck{background:var(--accent);border-color:var(--accent)}
          .th .nm{font-weight:600}.th .nm small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
          .n{font-family:var(--f-num);font-weight:700}.s{font-family:var(--f-num);font-size:13.5px;color:var(--mute)}
          .bar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
          .bar .btn{width:100%;padding:13px;font-size:16px}
          .board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:8px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
          .sq{position:relative;display:grid;place-items:center;background:var(--bsq-l);cursor:pointer;min-width:0;min-height:0;overflow:hidden}
          .sq.d{background:var(--bsq-d)}
          .sq.sel::after,.sq.hint::after,.sq.ok::after,.sq.no::after,.sq.last::after{content:"";position:absolute;inset:0}
          .sq.sel::after{background:var(--sel)}.sq.hint::after{background:var(--hint)}.sq.last::after{background:#f2c94c55}
          .sq.ok::after{background:#2e8b57cc}.sq.no::after{background:#c0452fcc}
          .sq.dst::before{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#1d232044;z-index:2}
          .pc{position:relative;z-index:1;font-size:min(10.2vw,50px);line-height:1;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans',sans-serif}
          .pc.w{color:#fff;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 1px #000a,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
          .pc.b{color:#1a1a1a;text-shadow:0 0 1px #fff8}
          .co{position:absolute;font-family:var(--f-num);font-size:10px;font-weight:700;opacity:.8;z-index:3;color:#1d2320}
          .co.f{right:3px;bottom:1px}.co.r{left:3px;top:1px}
          :root[data-board="purple"]{--bsq-l:#a2a3d9;--bsq-d:#533ad4;--sel:#e890e8bb;--bpick:#a2a3d9}
          :root[data-board="blue"]{--bsq-l:#3f6fc9;--bsq-d:#32439d;--sel:#f2c94cbb}
          :root[data-board="green"]{--bsq-l:#86bd47;--bsq-d:#5d8c34;--sel:#f2e04cbb}
          :root[data-board="red"]{--bsq-l:#c4413f;--bsq-d:#9d2d2c;--sel:#f2c94cbb}
          .pc{display:block;position:absolute;left:3%;top:3%;width:94%;height:94%;z-index:1}
          .pc{pointer-events:none}
          .bsw{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;font-size:12.5px;color:var(--mute)}
          .bsw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
          .bsw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
          .poster{display:block;width:100%;max-height:70vh;object-fit:contain;background:#0002;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
          .art{display:grid;grid-template-columns:96px 1fr;gap:12px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;align-items:center}
          .art img{width:96px;height:120px;object-fit:cover;border-radius:8px;background:#0002}
          .art .g-t{white-space:normal;font-size:16px}
          .body p{margin:0 0 12px;font-size:16px;line-height:1.7}
          .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--mute)}
          .field input[type=text],.field textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
          .field textarea{min-height:200px;resize:vertical;line-height:1.6}
          .zoom{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:12px;cursor:zoom-out}
          .zoom img{max-width:100%;max-height:100%;object-fit:contain}
          .btn.del{background:none;border:1px solid var(--bad);color:var(--bad)}
          .progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
          .shake{animation:sh .3s}
          @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
          @media (prefers-reduced-motion:reduce){.shake{animation:none}}
          .status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;font-size:13.5px}
          .chips{display:flex;gap:6px;flex-wrap:wrap}
          .chip{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
          .chip.miss{color:var(--bad);border-color:var(--bad)}.chip.got{color:var(--good);border-color:var(--good)}
          .msg{min-height:44px;margin:10px 0;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:500}
          .msg.good{border-color:var(--good);color:var(--good)}.msg.bad{border-color:var(--bad);color:var(--bad)}
          .row{display:flex;gap:8px}.row .btn{flex:1}
          .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
          .seg button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:500}
          .seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
          .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
          .hud div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center}
          .hud b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.2}.hud span{font-size:11.5px;color:var(--mute)}
          .target{font-family:var(--f-num);font-weight:700;font-size:46px;text-align:center;line-height:1.1;margin:2px 0 8px}
          .target small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--mute)}
          .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
          .opts button{font-family:var(--f-num);font-weight:700;font-size:22px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
          .opts button.ok{background:var(--good);color:#fff}.opts button.no{background:var(--bad);color:#fff}
          .res{text-align:center;padding:22px 14px}
          .res .big{font-family:var(--f-num);font-size:52px;font-weight:700;line-height:1}
          .pb{color:var(--warn);font-weight:700}
          .tgl{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:10px 0 0;color:var(--mute)}
